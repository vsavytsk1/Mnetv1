[package]
name = "gos_experiments"
version = "0.1.0"
edition = "2021"
description = "Seven witnesses to one integer identity, down to raw machine code."
license = "MIT"

[dependencies]
goldberg_kernel = { path = ".." }
gos_win32 = { path = "../win32" }

[[bin]]
name = "chi_witness"
path = "src/main.rs"

# NO [profile.*] here -- RUSTIUM R9: cargo ignores profiles in a workspace
