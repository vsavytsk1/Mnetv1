[package]
name = "goldberg_kernel"
version = "0.2.0"
edition = "2021"
description = "The closed set: vector primitives, C60/Goldberg topology, the exact ladder, complex arithmetic, and a deterministic PRNG. Certified chi=2, P=12, E/V=1.5."
license = "MIT"

# No dependencies. Not "few" -- none.
# There is nothing between the mathematics and the answer, which is what makes
# the result verifiable against the browser build.
[dependencies]

[dev-dependencies]

# The kernel is `#![forbid(unsafe_code)]`, so it can never own a window -- FFI
# needs `unsafe`. That constraint is a feature: it forces the Titans split.
#
#   Gos/         the TRUSTED base. integers, no unsafe, no deps. judged.
#   Gos/viewer/  UNTRUSTED surgery. raw Win32 FFI, unsafe allowed, no deps.
#                It may only ASK the kernel for pixels; it cannot change them.
[workspace]
members = ["viewer"]

[profile.release]
opt-level = 3
lto = true
