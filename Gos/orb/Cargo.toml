[package]
name = "gos_orb"
version = "0.2.0"
edition = "2021"
description = "The spini spini byte topology: a file's 1s and 0s on the certified shell."
license = "MIT"

[dependencies]
goldberg_kernel = { path = ".." }
gos_win32 = { path = "../win32" }

[[bin]]
name = "gos_orb"
path = "src/main.rs"

# NO [profile.*] here -- RUSTIUM R9: cargo ignores profiles in a workspace
# member and warns once. The real profile is in ../Cargo.toml.
