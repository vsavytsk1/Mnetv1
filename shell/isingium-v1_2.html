  ISINGIUM v1.2 — THE WALL, FOUND ON PURPOSE
  =================================================================
  "lets push this until chromium gives up... i must see it"
  Fine. Here is the wall. And it is not where you think.

  =================================================================
  ## THREE WALLS, AND THE THIRD IS THE ONLY REAL ONE

  WALL 1 · MEMORY — boring, and far away.
    s: Int8Array(N²) = N² bytes.  visit: Int32Array(N²) = 4N² bytes.
    Total ≈ 5N². N=16384 → 268M spins → ~1.34 GB. Chrome's per-tab heap on
    64-bit is roughly 2–4 GB, so this is close but survivable. Printed live.

  WALL 2 · THE CANVAS — a REAL, DOCUMENTED, SILENT limit.
    Desktop Chrome caps canvas AREA at 268,435,456 px = exactly 16384².
    Past it the canvas does not throw. IT SILENTLY BECOMES UNUSABLE —
    dimensions read back as 0, or getContext hands you a context that draws
    nothing. THAT IS CURSE 32's FAMILY AGAIN: the platform choosing silence.
    So this file DETECTS it: allocate, then read back and probe with
    getImageData. If it lies, the panel goes red and says so.
    (v1.2 renders by SAMPLING to a fixed display canvas, so the physics is
     never limited by the render. Said, not hidden — the wall must be the
     physics, not the paint.)

  WALL 3 ★ CRITICAL SLOWING DOWN — the one that actually stops you.
    You will not crash. YOU WILL ASYMPTOTE. sweeps/sec collapses as 1/N²,
    and that is only the arithmetic. The physics is worse:

        AT T_c, THE AUTOCORRELATION TIME DIVERGES:   τ ~ L^z
        and for Metropolis on the 2D Ising model,    z ≈ 2.17

    Double the lattice → equilibration takes ~4.5× LONGER, PER SWEEP, and each
    sweep already costs 4× more. So doubling L costs you ~18× in wall-clock to
    reach the same statistics. THAT IS THE WALL. It is not silicon. It is the
    model refusing.

    AND IT IS VLAD'S OWN THESIS, one last time:
    at T_c the system is SCALE-INVARIANT — there is NO characteristic length
    to discount against. No symmetry to quotient by. So you pay FULL PRICE AT
    EVERY SCALE SIMULTANEOUSLY. The compute explodes at exactly the one
    temperature where the physics is interesting. That is not bad luck. That is
    what "critical" MEANS.

  =================================================================
  ## AND THE ANSWER IS NOT A BIGGER MACHINE. IT IS A BETTER ALGORITHM.

    WOLFF (1989): pick a spin. Add each aligned neighbour to the cluster with
    probability p = 1 − e^(−2J/T). Grow. FLIP THE WHOLE CLUSTER AT ONCE.
    Five lines. And:
        Metropolis   z ≈ 2.17
        Wolff        z ≈ 0.35        ← a SIX-FOLD EXPONENT improvement
    No hardware on earth buys you a change in the exponent. Ever.

  ★★ AND HERE IS WHY WOLFF WORKS, AND IT CLOSES THE ENTIRE WEEK:
     THE WOLFF CLUSTER AT T_c *IS* THE CRITICAL FRACTAL. Same object. Same
     dimension: d_f = 187/96 = 1.9479. The algorithm that defeats critical
     slowing down does it BY FINDING THE FRACTAL AND FLIPPING IT.
     Vlad spent a week hunting a fractal to compute with. It was always the
     thing that made the computation cheap.
     Turn on WOLFF, go to T_c, turn on "largest cluster" — you are watching the
     algorithm eat the fractal it lives on.

  K1 Onsager exact T_c = 2/ln(1+√2) = 2.2691853 · measured by χ peak · the
     finite-size gap is REPORTED, and it shrinks as N grows. Watch it.
  K2 d_f exact = 187/96. box-counting range grows with N — this is the ONE
     number that gets HONESTLY better with a bigger lattice. That is the whole
     reason to pay.
  K3 render is SAMPLED for N > 2048. the physics is full resolution. the paint
     is not. said in advance.
  K4 z ≈ 2.17 (Metropolis) and z ≈ 0.35 (Wolff) are literature values for 2D
     Ising. This file does not measure them — measuring z properly needs
     careful autocorrelation analysis across many L. Quoted, not claimed.

  Pure Canvas 2D. No deps. chi=2 · always. 2026-07-17.
-->

<body>
<canvas id="lat"></canvas>

<div id="top">
  <div id="brand"><div class="t">ISINGIUM v1.2</div><div class="s" id="b-s">the wall · found on purpose</div></div>

</div>

<script>
"use strict";
var SIZES=[128,256,512,1024,2048,4096,8192,16384];
var CANVAS_AREA_LIMIT=268435456;              // desktop Chrome, = 16384² exactly
var N=128, J=1, T=2.269185, s=null, visit=null, visitStamp=0;
var run=true, useWolff=false, showClu=false, dTab="wall";
var TC_EXACT=2/Math.log(1+Math.SQRT2), DF_EXACT=187/96, Z_METRO=2.17, Z_WOLFF=0.35;
var expTab=new Float64Array(17), expOK=false;
var flips=0, sweepsDone=0, fps=0, sps=0, lastT=performance.now();
var dfMeas=0, cluMask=null, wallMsg="", allocFail=false, canvasLies=false;
var BUDGET=4e6;                                // flips per frame — fixed by the CPU, not by N

function buildExp(){
  for(var d=-8;d<=8;d+=4) expTab[d+8]= d<=0?1:Math.exp(-d/T);
  expOK = isFinite(expTab[12])&&expTab[12]>0&&isFinite(expTab[16])&&expTab[16]>0;
}
function idx(x,y){ return ((y+N)%N)*N + ((x+N)%N); }

// ── WALL 1 + 2 · allocate, then VERIFY. the platform lies silently. ──
function alloc(n){
  allocFail=false; canvasLies=false; wallMsg="";
  try{
    var a=new Int8Array(n*n), v=new Int32Array(n*n);
    for(var i=0;i<n*n;i++) a[i]= Math.random()<0.5?-1:1;
    s=a; visit=v; N=n; visitStamp=0;
  }catch(e){ allocFail=true; wallMsg="Int8Array("+(n*n)+") + Int32Array("+(n*n)+") threw: "+e.name+". ~"+((5*n*n)/1048576).toFixed(0)+" MB refused."; return false; }
  // probe the CANVAS limit honestly — it fails SILENTLY (CURSE 32's family)
  try{
    var t=document.createElement("canvas"); t.width=n; t.height=n;
    if(t.width!==n || t.height!==n){ canvasLies=true;
      wallMsg="canvas asked for "+n+"×"+n+" and reported back "+t.width+"×"+t.height+". IT DID NOT THROW. it lied."; }
    else {
      var c=t.getContext("2d");
      if(!c){ canvasLies=true; wallMsg="getContext('2d') returned null at "+n+"×"+n+". silently."; }
      else { c.getImageData(0,0,1,1); }
    }
  }catch(e2){ canvasLies=true; wallMsg="canvas "+n+"×"+n+" ("+(n*n).toLocaleString()+" px) threw "+e2.name+". area limit ≈ "+CANVAS_AREA_LIMIT.toLocaleString()+"."; }
  return true;
}
function resetStats(){ flips=0; sweepsDone=0; }

// ── METROPOLIS. one spin at a time. z ≈ 2.17. ──
function metro(n){
  for(var k=0;k<n;k++){
    var x=(Math.random()*N)|0, y=(Math.random()*N)|0, i=idx(x,y);
    var nb=s[idx(x+1,y)]+s[idx(x-1,y)]+s[idx(x,y+1)]+s[idx(x,y-1)];
    var dE=2*J*s[i]*nb;
    if(dE<=0 || Math.random()<expTab[dE+8]) s[i]=-s[i];
  }
  flips+=n; sweepsDone+=n/(N*N);
}
// ── ★ WOLFF. grow a cluster, flip it whole. z ≈ 0.35. five lines. ──
// and the cluster it grows at T_c IS the critical fractal, d_f = 187/96.
var wolffStack=null;
function wolff(){
  var p=1-Math.exp(-2*J/T), n=N*N;
  if(!wolffStack||wolffStack.length<n) wolffStack=new Int32Array(n);
  visitStamp++;
  var start=(Math.random()*n)|0, sv=s[start], sp=0, size=0;
  wolffStack[sp++]=start; visit[start]=visitStamp;
  while(sp>0){
    var i=wolffStack[--sp]; s[i]=-sv; size++;
    var x=i%N, y=(i/N)|0;
    var a=idx(x+1,y), b=idx(x-1,y), c=idx(x,y+1), d=idx(x,y-1);
    if(visit[a]!==visitStamp && s[a]===sv && Math.random()<p){ visit[a]=visitStamp; wolffStack[sp++]=a; }
    if(visit[b]!==visitStamp && s[b]===sv && Math.random()<p){ visit[b]=visitStamp; wolffStack[sp++]=b; }
    if(visit[c]!==visitStamp && s[c]===sv && Math.random()<p){ visit[c]=visitStamp; wolffStack[sp++]=c; }
    if(visit[d]!==visitStamp && s[d]===sv && Math.random()<p){ visit[d]=visitStamp; wolffStack[sp++]=d; }
  }
  flips+=size; sweepsDone+=size/(N*N);
  return size;
}
function magnet(){ var t=0, n=N*N; for(var i=0;i<n;i++) t+=s[i]; return t/n; }

// ── the cluster + box count. K2: the range GROWS with N. that is the payoff. ──
function largestCluster(){
  var n=N*N;
  if(n>4194304) return null;                   // 2048² — beyond this the BFS itself is the wall
  var lab=new Int32Array(n).fill(-1), best=0, bestRoot=-1, stack=new Int32Array(n);
  for(var st=0;st<n;st++){
    if(lab[st]!==-1) continue;
    var sp=0, cnt=0, sv=s[st];
    stack[sp++]=st; lab[st]=st;
    while(sp>0){
      var p=stack[--sp]; cnt++;
      var x=p%N, y=(p/N)|0;
      var a=idx(x+1,y),b=idx(x-1,y),c=idx(x,y+1),d=idx(x,y-1);
      if(lab[a]===-1&&s[a]===sv){lab[a]=st;stack[sp++]=a;}
      if(lab[b]===-1&&s[b]===sv){lab[b]=st;stack[sp++]=b;}
      if(lab[c]===-1&&s[c]===sv){lab[c]=st;stack[sp++]=c;}
      if(lab[d]===-1&&s[d]===sv){lab[d]=st;stack[sp++]=d;}
    }
    if(cnt>best){ best=cnt; bestRoot=st; }
  }
  var mask=new Uint8Array(n);
  for(var i2=0;i2<n;i2++) if(lab[i2]===bestRoot) mask[i2]=1;
  return mask;
}
function boxCount(mask){
  var xs=[], ys=[], top=Math.min(N/4,128);
  for(var box=1;box<=top;box*=2){
    var seen={}, c=0, g=Math.ceil(N/box);
    for(var y=0;y<N;y++) for(var x=0;x<N;x++){
      if(!mask[y*N+x]) continue;
      var k=((y/box)|0)*g+((x/box)|0);
      if(!seen[k]){ seen[k]=1; c++; }
    }
    if(c>0){ xs.push(Math.log(1/box)); ys.push(Math.log(c)); }
  }
  if(xs.length<3) return {df:0,dec:0};
  var m=xs.length,sx=0,sy=0,sxx=0,sxy=0;
  for(var i=0;i<m;i++){ sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];sxy+=xs[i]*ys[i]; }
  return { df:(m*sxy-sx*sy)/((m*sxx-sx*sx)||1), dec:(xs[0]-xs[m-1])/Math.LN10 };
}
var dfDec=0;
function measure(){
  if(!showClu){ cluMask=null; return; }
  var mk=largestCluster();
  if(!mk){ cluMask=null; dfMeas=0; return; }
  cluMask=mk; var B=boxCount(mk); dfMeas=B.df; dfDec=B.dec;
}

// ── render: SAMPLED for large N. the physics is full res. the paint is not. (K3)
var lc=document.getElementById("lat"), lx=lc.getContext("2d"), img=null, DISP=512;
function layout(){
  var side=Math.min(innerWidth-380, innerHeight-190); side=Math.max(220,side);
  DISP=Math.min(N,1024);
  lc.width=DISP; lc.height=DISP; lc.style.width=side+"px"; lc.style.height=side+"px";
  img=lx.createImageData(DISP,DISP);
}
addEventListener("resize",layout);
function drawLat(){
  if(!img) return;
  var d=img.data, step=N/DISP;
  for(var y=0;y<DISP;y++){
    var sy=((y*step)|0)*N;
    for(var x=0;x<DISP;x++){
      var i=sy+((x*step)|0), o=(y*DISP+x)*4;
      if(cluMask && cluMask[i]){ d[o]=255; d[o+1]=215; d[o+2]=0; }
      else if(s[i]>0){ d[o]=0; d[o+1]=212; d[o+2]=255; }
      else { d[o]=14; d[o+1]=14; d[o+2]=26; }
      d[o+3]=255;
    }
  }
  lx.putImageData(img,0,0);
}

function judge(){
  var m=Math.abs(magnet()), ve=document.getElementById("verdict"), mFloor=1/N;
  var dead=(!expOK)||(T>3.2&&m>6*mFloor);
  if(allocFail||canvasLies){ ve.className="bad"; set("v-t","☠ THE WALL");
    set("v-s",wallMsg); }
  else if(dead){ ve.className="bad"; set("v-t","☠ PHYSICS DEAD"); set("v-s","the Boltzmann table or the floor check failed."); }
  else if(sps<0.3 && sps>0){ ve.className="bad"; set("v-t","⌛ ASYMPTOTING");
    set("v-s","<b>"+sps.toFixed(2)+" sweeps/sec</b>. you did not crash — you SLOWED TO A STOP. and near T_c the autocorrelation time is τ ~ L^"+(useWolff?Z_WOLFF:Z_METRO)+", so you also need MORE sweeps. that product is the wall."); }
  else if(Math.abs(T-TC_EXACT)<0.06){ ve.className="crit"; set("v-t","★ CRITICAL · N="+N);
    set("v-s","T = T_c. ξ has diverged. "+(useWolff?"WOLFF is flipping the fractal itself — d_f = 187/96 — which is exactly why it does not slow down.":"Metropolis is crawling: at T_c there is NO length scale to discount against, so you pay full price at every scale at once. z ≈ 2.17. TRY WOLFF.")); }
  else if(T<TC_EXACT){ ve.className="ord"; set("v-t","ORDERED · |m|="+m.toFixed(3));
    set("v-s","below T_c. the lattice chose a direction and nobody told it which."); }
  else { ve.className="dis"; set("v-t","DISORDERED · |m|≈"+m.toFixed(4));
    set("v-s","above T_c. TV static. |m| ≈ "+mFloor.toFixed(4)+" = 1/√N² — the finite-size floor, not order."); }
  set("m-n",N); set("m-sp", (N*N>=1e6? (N*N/1e6).toFixed(1)+"M" : (N*N/1000).toFixed(0)+"k"));
  set("m-mem", ((5*N*N)/1048576).toFixed(0)+" MB");
  set("m-sw", sps<1? sps.toFixed(2) : sps.toFixed(0));
  document.getElementById("m-sw").style.color = sps<0.3?"#ff3355":sps<3?"#ffb454":"#00ffd5";
  set("m-fl", (fps/1e6).toFixed(1)+"M");
  set("m-m", m.toFixed(4));
  set("m-df", showClu? (dfMeas>0?dfMeas.toFixed(3):"—") : "off");
  document.getElementById("m-df").style.color=(showClu&&Math.abs(dfMeas-DF_EXACT)<0.12)?"#00ffd5":"#ffd700";
  set("b-s", (useWolff?"WOLFF":"Metropolis")+" · N="+N+" · "+(N*N).toLocaleString()+" spins");
}
function set(id,v){ var e=document.getElementById(id); if(e)e.textContent=v; }

function setTab(t){
  dTab=t;
  var tabs=document.querySelectorAll("#dossier .tab");
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle("active",tabs[i].getAttribute("data-t")===t);
  render();
}

function setN(i){
  var n=SIZES[i];
  set("v-n",n+"²");
  if(!alloc(n)){ render(); judge(); return; }
  layout(); resetStats(); measure(); render();
}
function climb(){
  for(var i=0;i<SIZES.length;i++){
    var ok=alloc(SIZES[i]);
    if(!ok||canvasLies){
      document.getElementById("sN").value=Math.max(0,i-1);
      alloc(SIZES[Math.max(0,i-1)]); layout();
      wallMsg="★ THE WALL IS AT N = "+SIZES[i]+" ("+(SIZES[i]*SIZES[i]).toLocaleString()+" spins). "+wallMsg+" — dropped back to "+SIZES[Math.max(0,i-1)]+"².";
      allocFail=true; render(); judge(); return;
    }
  }
  document.getElementById("sN").value=SIZES.length-1;
  set("v-n",SIZES[SIZES.length-1]+"²"); layout(); resetStats(); render();
  wallMsg="climbed to "+N+"² = "+(N*N).toLocaleString()+" spins and NOTHING BROKE. the wall is not memory. it is sweeps/sec. watch it.";
  allocFail=false; canvasLies=false;
}
function setT(v){ T=v; buildExp(); document.getElementById("sT").value=Math.round(v*100); set("v-t2",v.toFixed(2)); }

var frames=0;
function loop(){
  requestAnimationFrame(loop);
  if(run && s && !allocFail){
    if(useWolff){ var budget=BUDGET, done=0, guard=0;
      while(done<budget && guard++<20000) done+=wolff();
    } else metro(Math.min(BUDGET, N*N*3));
  }
  if(++frames%20===0 && showClu) measure();
  drawLat();
  var now=performance.now();
  if(now-lastT>400){
    var dt=(now-lastT)/1000;
    fps=flips/dt; sps=sweepsDone/dt; flips=0; sweepsDone=0; lastT=now;
    judge(); render();
  }
}
alloc(128); buildExp(); layout(); setT(2.269185); render();
requestAnimationFrame(loop);
</script>
