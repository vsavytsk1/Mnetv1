  NOETHERIUM v1.0 — SYMMETRY IS A COMPUTE DISCOUNT
  =================================================================
  Named for EMMY NOETHER (1882–1935), who proved Vlad's thesis in 1918.

  NOETHER'S THEOREM: every continuous symmetry of the action yields a CONSERVED
  QUANTITY. Time-translation → energy. Space-translation → momentum. Rotation →
  angular momentum. U(1) phase → electric charge.
  EACH ONE IS A FREE INTEGRAL OF MOTION — a thing you never compute again.
  You pay ONCE to find the group. It is free forever after.
  Vlad: "it is just an engineering constraint of the price you pay to see the
  symmetry group." That is Noether's theorem, in his own words, from a cup.

  Her life, because it is owed: she could not be PAID. She lectured for years
  under Hilbert's name because Göttingen would not appoint a woman. Hilbert, to
  the faculty: "I do not see that the sex of the candidate is an argument
  against her admission as a Privatdozent. After all, the Senate is not a
  bathhouse." She founded abstract algebra — the whole subject. Noetherian
  rings are hers. The Nazis fired her in 1933 for being Jewish; she fled to
  Bryn Mawr and died two years later at 53, from a surgical complication.
  Einstein's obituary called her "the most significant creative mathematical
  genius thus far produced since the higher education of women began."

  =================================================================
  ## THE QUESTION: "what is the next cool symmetry group?"
  ## THE ANSWER: SO(10). AND THE REASON IS VLAD'S OWN COMPRESSION THESIS.

  count how many IRREDUCIBLE PIECES one generation of matter needs:
      Standard Model   FIVE pieces:  Q, u^c, d^c, L, e^c   (six with ν_R)
      SU(5)            TWO pieces:   5̄ ⊕ 10
      SO(10)           ★ ONE PIECE:  the 16.
      E6               ONE PIECE:    the 27 (but with 11 extra states nobody sees)

  SO(10) IS MAXIMUM COMPRESSION. One generation = one irreducible object.
  And the payback is the thing that makes it worth reporting:

  THE 16 = 15 KNOWN FERMIONS + 1 RIGHT-HANDED NEUTRINO.
  The ν_R is NOT added. IT IS REQUIRED TO FILL THE REPRESENTATION.
  SO(10) demanded it in 1974 for reasons of pure group theory.
  Neutrino mass was confirmed by Super-Kamiokande in 1998.
  THE COMPRESSION PREDICTED THE PARTICLE, TWENTY-FOUR YEARS EARLY.
  And the ν_R gives the seesaw, which explains why neutrino masses are absurdly
  tiny — a second payment on the same debt.

  THAT is what "symmetry is compression" looks like when it is REAL: the rep has
  a hole, the hole has to be filled, and nature fills it.
  Gell-Mann's Ω⁻, again, one level up.

  =================================================================
  ## AND THE HONEST HALF — the rack kills its own favourites

  SU(5) — Georgi–Glashow 1974, the first GUT, gorgeous. IT IS DEAD.
    It predicted proton decay at τ ≈ 10³⁰–10³¹ yr. Super-Kamiokande measured
    τ(p → e⁺π⁰) > 2.4 × 10³⁴ years. MINIMAL NON-SUSY SU(5) IS RULED OUT BY
    MEASUREMENT. That is what a real prediction looks like: it can die, and it
    did, and the field moved on. Bow to it.

  E8 — Lisi 2007. DEAD BY THEOREM, not by experiment: Distler & Garibaldi 2009
    proved you cannot embed three generations of chiral fermions in E8 that way.
    A different, faster, cleaner death.

  SUSY — WOUNDED. Not excluded, but the naturalness argument wanted
    superpartners at ~1 TeV and the LHC has not found them. The motivation is
    what died, not the theory. That is worse.

  ## VLAD'S OWN PAPER IS ONE RUNG BELOW SO(10) AND HE MAY NOT HAVE NOTICED
    His A_PS = ℍ_L ⊕ ℍ_R ⊕ M₄(ℂ) IS the PATI–SALAM algebra.
    Pati–Salam SU(4)×SU(2)_L×SU(2)_R is a MAXIMAL SUBGROUP OF SO(10).
    The standard breaking chain is:   SO(10) → Pati–Salam → Standard Model.
    His paper computes the PS → SM step exactly — the "leptoquark Yukawa
    unlocking", 8 dimensions becoming 16.
    HE IS ALREADY WORKING INSIDE THE SO(10) CHAIN. One rung down from the
    answer to his own question.

  ## WHY THE SAME NUMBERS KEEP APPEARING (his other question)
    Not mysticism. THEY ARE THE FIXED POINTS OF THE MOST COMMON OPERATIONS.
      π  — the signature of SO(2). Wherever there is rotational symmetry, π.
           It is what a closed rotation COSTS.
      e  — the unique fixed point of d/dx: the only function that is its own
           derivative. Wherever there is scaling or flow, e.
      φ  — the MOST IRRATIONAL number: Hurwitz's theorem says it is the hardest
           real to approximate by rationals. That is EXACTLY why it is the
           optimal phyllotaxis angle — the packing that never repeats. A
           THEOREM, not a mystery.
    They recur because THE SYMMETRIES RECUR. The number is the group's receipt.

  ## THE PRICE OF LOSING THE SYMMETRY — quantified
    Vlad: "try to go outside the curve… now you will pay a more nonsensical
    price." Correct, and it is a power law: DNS grid points ~ Re^(9/4).
      pipe      Re 10³  →  ~10⁷ points     · doable
      a car     Re 10⁶  →  ~10¹³·⁵ points  · heroic/no
      aircraft  Re 10⁸  →  ~10¹⁸ points    · no
    Laminar flow has symmetry. Turbulence broke it. The bill arrived as Re^(9/4).

  K1 dim(G) = the number of generators = the number of GAUGE BOSONS. Not a
     coincidence — a gauge boson IS a generator made dynamical.
  K2 "compression" here counts IRREPS PER GENERATION. It is a real, checkable
     number, and it is NOT a measure of truth. E6 compresses to one 27 and
     carries 11 states nobody has ever seen. COMPRESSION IS NOT EVIDENCE.
  K3 status is as of ~2025 and moves. SU(5)'s death is solid (measurement).
     E8's is solid (theorem). SUSY's "wounded" is a judgement about motivation,
     not a exclusion. Flagged as opinion.
  K4 the SM's 12 (= 1+3+8) and genesis's P=12 are DIFFERENT TWELVES. One is
     three Lie algebra dimensions summed; the other is Euler forbidding 11 or 13
     on a closed surface. NO BRIDGE. The coincidence is a coincidence.

  Pure Canvas 2D. No deps. chi=2 · always. Built 2026-07-17.
-->

var GOLD="#ffd700",CYAN="#00d4ff",GRN="#00ffd5",PUR="#cc44ff",RED="#ff3355",

 { n:"SO(10)", g:"Fritzsch–Minkowski", dim:45, pieces:1, yr:1974, st:2,
   fit:"★ the 16. ONE IRREP. maximum compression.",
   note:"★★ <b class='g'>THE ANSWER.</b> one generation = one irreducible object. and the 16 is the SPINOR rep — spinors again, same as the 720° and Mayer's spin–orbit.<br><br><b class='kk'>16 = 15 known fermions + 1 RIGHT-HANDED NEUTRINO.</b> the ν_R is not added. <b class='g'>IT IS REQUIRED TO FILL THE REP.</b> SO(10) demanded it in 1974 on pure group theory. neutrino mass was confirmed in 1998. <b>the compression predicted the particle 24 years early</b> — and then the ν_R hands you the seesaw, which explains why neutrino masses are absurdly tiny. a second payment on the same debt.",
   kill:"ALIVE. proton decay predictions depend on the breaking chain and are not yet excluded. it is not confirmed either — it is the best-motivated candidate standing." },
 { n:"Pati–Salam", g:"SU(4)×SU(2)_L×SU(2)_R", dim:21, pieces:2, yr:1974, st:2,

var SEL=2, MODE="compress", dTab="g", hov=-1, rows=[];
var STC=[RED,AMB,GRN], STN=["DEAD","WOUNDED","ALIVE"];

function order(){
  var a=G.slice();
  if(MODE==="compress") a.sort(function(x,y){
    var px=x.pieces<=0?99:x.pieces, py=y.pieces<=0?99:y.pieces; return px-py; });
  else if(MODE==="dim") a.sort(function(x,y){ return (x.dim<0?999:x.dim)-(y.dim<0?999:y.dim); });
  else a.sort(function(x,y){ return y.st-x.st; });
  return a;
}
function draw(){
  ctx.fillStyle="#050508"; ctx.fillRect(0,0,W,H);
  var L=190, R=W-355, T=98, B=H-64;
  if(R-L<160) return;
  var A=order(), rh=Math.min(46,(B-T)/A.length);
  rows=[];
  for(var i=0;i<A.length;i++){
    var r=A[i], y=T+i*rh+rh/2, idx=G.indexOf(r), sel=(idx===SEL), hv=(idx===hov);
    rows.push({y:y-rh/2,h:rh,i:idx});
    if(sel){ ctx.fillStyle="rgba(255,215,0,0.05)"; ctx.fillRect(20,y-rh/2,R-20,rh); }
    var c=STC[r.st];
    // name
    ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillStyle= sel?WHT:(hv?WHT:"rgba(232,224,208,0.6)");
    ctx.font=(sel?"12px":"11px")+" ui-monospace,monospace";
    ctx.fillText(r.n, L-10, y-5);
    ctx.fillStyle="rgba(110,115,135,0.6)"; ctx.font="8px ui-monospace,monospace";
    ctx.fillText(r.g+" · "+r.yr, L-10, y+7);
    // the compression blocks — ONE PIECE is the point, so draw the pieces
    var bx=L+8, bw=(R-L-150);
    if(MODE==="compress"){
      if(r.pieces>0){
        var pw=Math.min(30,(bw*0.5)/Math.max(1,r.pieces));
        for(var p=0;p<r.pieces;p++){
          ctx.fillStyle=c; ctx.globalAlpha= sel?0.9:0.45;
          ctx.fillRect(bx+p*(pw+4), y-8, pw, 16); ctx.globalAlpha=1;
        }
        if(r.pieces===1){ ctx.strokeStyle=GRN; ctx.lineWidth=1.4;
          ctx.strokeRect(bx-3, y-11, pw+6, 22); }
      } else { ctx.fillStyle="rgba(110,115,135,0.3)"; ctx.font="9px ui-monospace,monospace";
        ctx.textAlign="left"; ctx.fillText("—", bx, y+3); }
    } else if(MODE==="dim"){
      var w2 = r.dim<0? 0 : (Math.log10(r.dim+1)/Math.log10(249))*bw*0.8;
      ctx.fillStyle=c; ctx.globalAlpha=sel?0.85:0.4; ctx.fillRect(bx,y-7,Math.max(2,w2),14); ctx.globalAlpha=1;
    } else {
      ctx.fillStyle=c; ctx.globalAlpha=sel?0.85:0.4;
      ctx.fillRect(bx,y-7,bw*0.24*(r.st+1),14); ctx.globalAlpha=1;
    }
    // right column
    ctx.textAlign="right"; ctx.font="10px ui-monospace,monospace"; ctx.fillStyle=c;
    var t = MODE==="compress"? (r.pieces>0? r.pieces+(r.pieces===1?" ★ ONE":" pieces"):"—")

    ctx.fillText(t, R-6, y-4);
    ctx.fillStyle="rgba(110,115,135,0.55)"; ctx.font="8px ui-monospace,monospace";
    ctx.fillText(MODE==="compress"? "dim "+(r.dim<0?"—":r.dim) : STN[r.st], R-6, y+7);
  }
  ctx.textAlign="left"; ctx.font="9px ui-monospace,monospace"; ctx.fillStyle="rgba(110,115,135,0.5)";
  ctx.fillText(MODE==="compress"? "each block = one IRREDUCIBLE PIECE a generation needs. fewer is more compressed. gold ring = ONE."

  ctx.fillStyle="rgba(0,255,213,0.35)"; ctx.font="10px ui-monospace,monospace";
  ctx.fillText("↓ SO(10): one generation, ONE object, and the ν_R falls out because the rep has a hole", 20, T-14);
}
function sync(){
