<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Möbius • Assembly + Closure</title>
<style>
  body { margin:0; overflow:hidden; background:#0a0c12; font-family: ui-monospace, monospace; color:#ccd1e0; }
  canvas { display:block; }
  .label {
    position:fixed; top:14px; left:14px; z-index:10;
    background:rgba(10,12,18,0.78); padding:10px 14px; border-radius:6px;
    border:1px solid #1a1f2e; font-size:12px; line-height:1.6;
  }
  .label .title { color:#00d4ff; font-weight:bold; margin-bottom:4px; }
  .label .phase { color:#7fffa0; font-weight:bold; }
  .label .warn { color:#ff9090; }
  .label .small { color:#8a92a8; font-size:11px; margin-top:6px; }
  .controls {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:10;
    background:rgba(10,12,18,0.88); padding:12px 18px; border-radius:8px;
    border:1px solid #1a1f2e; display:flex; align-items:center; gap:14px;
    min-width: 560px; font-size:12px;
  }
  .controls button {
    background:#1a1f2e; color:#ccd1e0; border:1px solid #2a3040;
    padding:6px 14px; border-radius:4px; cursor:pointer; font-family:inherit; font-size:12px;
    min-width: 38px;
  }
  .controls button:hover { background:#2a3040; }
  .controls input[type=range] { flex:1; accent-color: #00d4ff; }
  .controls .pval { color:#00d4ff; font-weight:bold; min-width:78px; text-align:right; }
  .controls .speed { display:flex; gap:4px; }
  .controls .speed button.active { background:#00d4ff; color:#0a0c12; border-color:#00d4ff; }
  .controls #spin.spinOn { background:#00d4ff; color:#0a0c12; border-color:#00d4ff; }
  .controls .step { display:flex; gap:4px; }
  .phasebar {
    position:fixed; bottom:75px; left:50%; transform:translateX(-50%); z-index:10;
    width: 560px; height: 4px; background:#1a1f2e; border-radius:2px;
    display:flex; overflow:hidden;
  }
  .phasebar .seg { height:100%; }
  .phasebar .build { background:#7fffa0; flex: 40; }
  .phasebar .hold { background:#00d4ff; flex: 5; }
  .phasebar .close { background:#ff9090; flex: 55; }
</style>
</head>
<body>
<div class="label">
  <div class="title">Möbius • Assembly + Closure</div>
  <div class="phase" id="phaseText">PHASE 1 — assembly</div>
  <div class="small">1080 hexagonal cells</div>
  <div class="small">χ(Möbius) = 0  ·  χ(sphere) = 2</div>
  <div class="warn">closure must self-intersect</div>
</div>

<div class="phasebar">
  <div class="seg build" title="assembly"></div>
  <div class="seg hold" title="stable"></div>
  <div class="seg close" title="forcing closure"></div>
</div>

<div class="controls">
  <div class="step">
    <button id="stepBack" title="back">«</button>
    <button id="playpause">▶</button>
    <button id="stepFwd" title="forward">»</button>
  </div>
  <input type="range" id="slider" min="0" max="1" step="0.001" value="0">
  <span class="pval" id="pval">p=0.000</span>
  <div class="speed">
    <button data-speed="0.0006">slow</button>
    <button data-speed="0.002" class="active">med</button>
    <button data-speed="0.006">fast</button>
  </div>
  <button id="spin" title="toggle auto-rotation" class="spinOn">⟳</button>
  <button id="reset" title="reset">↻</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c12);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// === Core
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.25, 32, 32),
  new THREE.MeshBasicMaterial({color: 0x00d4ff})
);
scene.add(core);
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 32, 32),
  new THREE.MeshBasicMaterial({color: 0x00d4ff, transparent:true, opacity:0.1})
);
scene.add(halo);

// === Möbius parameters
const R0 = 3.0;
const width0 = 1.25;
const uSteps = 120;
const vSteps = 18;
const numPoints = (uSteps + 1) * (vSteps + 1);

// === Phase mapping
// p ∈ [0, 1] master parameter
// p ∈ [0, 0.40]: assembly — hexagons appear in u-sweep
// p ∈ [0.40, 0.45]: hold — stable Möbius
// p ∈ [0.45, 1.0]: forcing closure — geometry deforms
function buildProgress(p) {
  return Math.min(1, Math.max(0, p / 0.40));
}
function closureT(p) {
  return Math.max(0, Math.min(1, (p - 0.45) / 0.55));
}
function currentPhase(p) {
  if (p < 0.40) return 1;
  if (p < 0.45) return 2;
  return 3;
}

// === The deformation (same math as closure artifact)
function deform(u, v, t) {
  const cosU2 = Math.cos(u/2);
  const sinU2 = Math.sin(u/2);
  const R = R0 * (1 - 0.88 * t);
  const v_eff = v * (1 + 0.6 * t);
  let x = (R + v_eff * cosU2) * Math.cos(u);
  let y = (R + v_eff * cosU2) * Math.sin(u);
  let z = v_eff * sinU2;
  const curl = 1.4 * t;
  z += curl * Math.sin(u) * (v_eff / width0);
  x += 0.3 * t * Math.cos(u * 2) * (v_eff / width0);
  return [x, y, z];
}

function buildPositions(t) {
  const pos = new Float32Array(numPoints * 3);
  let k = 0;
  for (let i = 0; i <= uSteps; i++) {
    const u = (i / uSteps) * Math.PI * 2;
    for (let j = 0; j <= vSteps; j++) {
      const v = (j / vSteps) * 2 * width0 - width0;
      const [x, y, z] = deform(u, v, t);
      pos[k++] = x; pos[k++] = y; pos[k++] = z;
    }
  }
  return pos;
}

// === Hex edges — points & lines already in u-order, so drawRange just works
const lineIndices = [];
for (let i = 0; i <= uSteps; i++) {
  for (let j = 0; j <= vSteps; j++) {
    if (i < uSteps) {
      const cur = i * (vSteps + 1) + j;
      lineIndices.push(cur, cur + (vSteps + 1));
    }
    if (j < vSteps && ((i + j) % 2 === 0)) {
      const cur = i * (vSteps + 1) + j;
      lineIndices.push(cur, cur + 1);
    }
  }
}
const totalLines = lineIndices.length;

const group = new THREE.Group();
scene.add(group);

const initialPos = buildPositions(0);
const pointGeo = new THREE.BufferGeometry();
pointGeo.setAttribute('position', new THREE.BufferAttribute(initialPos.slice(), 3));
const points = new THREE.Points(pointGeo, new THREE.PointsMaterial({
  size: 0.028, color: 0xccd1e0, transparent:true, opacity:0.75
}));
group.add(points);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(initialPos.slice(), 3));
lineGeo.setIndex(lineIndices);
const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0x6a7a90, transparent:true, opacity:0.55
}));
group.add(lines);

// === Leading-edge marker: a bright bar across the strip at u_front
// Lives during assembly, showing where new hexagons are being born
const frontMarkerGeo = new THREE.BufferGeometry();
const frontMarkerPos = new Float32Array((vSteps + 1) * 3);
frontMarkerGeo.setAttribute('position', new THREE.BufferAttribute(frontMarkerPos, 3));
const frontMarker = new THREE.Line(frontMarkerGeo, new THREE.LineBasicMaterial({
  color: 0x00d4ff, transparent:true, opacity:0.9
}));
group.add(frontMarker);

function updateFrontMarker(uFront, visible, closureT) {
  if (!visible) {
    frontMarker.visible = false;
    return;
  }
  frontMarker.visible = true;
  const arr = frontMarkerGeo.attributes.position.array;
  let k = 0;
  for (let j = 0; j <= vSteps; j++) {
    const v = (j / vSteps) * 2 * width0 - width0;
    const [x, y, z] = deform(uFront, v, closureT);
    arr[k++] = x; arr[k++] = y; arr[k++] = z;
  }
  frontMarkerGeo.attributes.position.needsUpdate = true;
}

// === Master update
function update(p) {
  const build = buildProgress(p);
  const t = closureT(p);
  const phase = currentPhase(p);

  // 1. Update positions if we're in closure phase
  const pos = buildPositions(t);
  pointGeo.attributes.position.array.set(pos);
  pointGeo.attributes.position.needsUpdate = true;
  lineGeo.attributes.position.array.set(pos);
  lineGeo.attributes.position.needsUpdate = true;

  // 2. Update drawRange for assembly effect
  const pointsShown = Math.floor(numPoints * build);
  const linesShown = Math.floor(totalLines * build);
  pointGeo.setDrawRange(0, pointsShown);
  lineGeo.setDrawRange(0, linesShown);

  // 3. Leading edge marker (only during assembly)
  const showFront = (phase === 1) && (build > 0) && (build < 1);
  const uFront = build * Math.PI * 2;
  updateFrontMarker(uFront, showFront, t);

  // 4. Color shift based on closure stress
  const r = 0.42 + t * 0.55;
  const g = 0.48 - t * 0.30;
  const b = 0.56 - t * 0.40;
  lines.material.color.setRGB(r, g, b);
  lines.material.opacity = 0.55 + t * 0.25;

  // 5. Phase label
  const phaseEl = document.getElementById('phaseText');
  if (phase === 1) {
    phaseEl.textContent = `PHASE 1 — assembly  (${(build*100).toFixed(0)}%)`;
    phaseEl.style.color = '#7fffa0';
  } else if (phase === 2) {
    phaseEl.textContent = `PHASE 2 — stable`;
    phaseEl.style.color = '#00d4ff';
  } else {
    phaseEl.textContent = `PHASE 3 — forcing closure  (t=${t.toFixed(2)})`;
    phaseEl.style.color = '#ff9090';
  }
}

// === Controls
let p = 0;
let playing = false;
let speed = 0.002;

const slider = document.getElementById('slider');
const pval = document.getElementById('pval');
const playpause = document.getElementById('playpause');
const stepBack = document.getElementById('stepBack');
const stepFwd = document.getElementById('stepFwd');
const reset = document.getElementById('reset');
const spinBtn = document.getElementById('spin');
let autoSpin = true;
spinBtn.addEventListener('click', () => {
  autoSpin = !autoSpin;
  spinBtn.classList.toggle('spinOn', autoSpin);
});

function setP(newP) {
  p = Math.max(0, Math.min(1, newP));
  slider.value = p;
  pval.textContent = `p=${p.toFixed(3)}`;
  update(p);
}

slider.addEventListener('input', () => setP(parseFloat(slider.value)));
playpause.addEventListener('click', () => {
  playing = !playing;
  playpause.textContent = playing ? '❚❚' : '▶';
});
stepBack.addEventListener('click', () => { playing=false; playpause.textContent='▶'; setP(p - 0.01); });
stepFwd.addEventListener('click', () => { playing=false; playpause.textContent='▶'; setP(p + 0.01); });
reset.addEventListener('click', () => { playing=false; playpause.textContent='▶'; setP(0); });
document.querySelectorAll('.speed button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.speed button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    speed = parseFloat(b.dataset.speed);
  });
});

// === Interaction
let dragging = false, prevX = 0, prevY = 0;
renderer.domElement.addEventListener('mousedown', e => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => {
  if (!dragging) return;
  group.rotation.y += (e.clientX - prevX) * 0.0035;
  group.rotation.x += (e.clientY - prevY) * 0.0035;
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('wheel', e => {
  camera.position.z = Math.max(3, Math.min(16, camera.position.z + e.deltaY * 0.01));
});

// === Initial state and loop
setP(0);

function animate() {
  requestAnimationFrame(animate);
  if (playing) {
    let next = p + speed;
    if (next >= 1) { next = 1; playing = false; playpause.textContent = '▶'; }
    setP(next);
  }
  group.rotation.y += autoSpin ? 0.0005 : 0;
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
