<script type="module">
import * as THREE from 'three';

// ===== Scene =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c12);
// v14.1: Fog blends distant geometry into the background instead of just clipping.
// At extreme zoom-out the strip & wisps dissolve into the void; the tesseract at
// origin stays bright until very far. This is Vlad's "render in background color
// when compute is limited" — graceful fade rather than crash.
scene.fog = new THREE.Fog(0x0a0c12, 22, 75);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ===== The ephemeral center — Wavy Cube =====
// REVERSED FOCUS: instead of a bright cube blinking on, a faint square wave-form is
// always drawn around the center. The cube only EMERGES into visibility during the
// peaks of the Solfeggio resonance — like a watermark revealed by amplitude.

const CUBE_HALF = 0.038;  // pixel-cluster scale — blends with the lattice
const FACE_GRID = 6;      // fewer ripples for the tinier cube

// (1) Faint background wave-form — closed-loop oscilloscope trace around the cube
const WAVE_SEGMENTS = 48;
const waveGeo = new THREE.BufferGeometry();
const wavePositions = new Float32Array(WAVE_SEGMENTS * 2 * 3);
const waveColors = new Float32Array(WAVE_SEGMENTS * 2 * 3);
waveGeo.setAttribute('position', new THREE.BufferAttribute(wavePositions, 3));
waveGeo.setAttribute('color', new THREE.BufferAttribute(waveColors, 3));
const waveLines = new THREE.LineSegments(waveGeo, new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 1.0,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(waveLines);

// (2) The six faces of the cube — each is a small NxN grid that RIPPLES.
//     The face's surface position is offset along the face normal by sin waves —
//     so each face becomes a tiny standing-wave interference pattern.
//     6 faces × FACE_GRID × (FACE_GRID-1) × 2 (horiz + vert lines) × 2 (segment endpoints) × 3 (xyz)
const FACE_LINES_PER_FACE = FACE_GRID * (FACE_GRID - 1) * 2;  // grid lines per face
const TOTAL_FACE_LINES = 6 * FACE_LINES_PER_FACE;
const faceGeo = new THREE.BufferGeometry();
const facePositions = new Float32Array(TOTAL_FACE_LINES * 2 * 3);
const faceColors = new Float32Array(TOTAL_FACE_LINES * 2 * 3);
faceGeo.setAttribute('position', new THREE.BufferAttribute(facePositions, 3));
faceGeo.setAttribute('color', new THREE.BufferAttribute(faceColors, 3));
const faceLines = new THREE.LineSegments(faceGeo, new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 1.0,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(faceLines);

// The 6 faces of a cube: each has a normal axis (which axis is "up off the face")
// and two tangent axes (which two axes span the face's 2D surface).
// nIdx = which axis is the normal (0=x, 1=y, 2=z), nSign = +1 or -1
const CUBE_FACES = [
  { nIdx: 0, nSign:  1, tIdx: 1, bIdx: 2 },  // +X face
  { nIdx: 0, nSign: -1, tIdx: 1, bIdx: 2 },  // -X face
  { nIdx: 1, nSign:  1, tIdx: 0, bIdx: 2 },  // +Y face
  { nIdx: 1, nSign: -1, tIdx: 0, bIdx: 2 },  // -Y face
  { nIdx: 2, nSign:  1, tIdx: 0, bIdx: 1 },  // +Z face
  { nIdx: 2, nSign: -1, tIdx: 0, bIdx: 1 }   // -Z face
];

// =====================================================================
// CHANGE 1 (v14): TESSERACT CENTER — pure-math procedural blue spectral cube
// Palette: icy white-cyan core → tesseract cyan mid → deep cobalt outer
// All procedural: inner core (icosahedron, additive blend), radial haze wisps
// (sparse LineSegments), recolored wave + face grid.
// =====================================================================
const TESSERACT_CORE  = { r: 0.78, g: 0.94, b: 1.00 };  // #c7f0ff — icy white-cyan, hottest
const TESSERACT_MID   = { r: 0.31, g: 0.72, b: 1.00 };  // #4fb8ff — classic tesseract cyan
const TESSERACT_OUTER = { r: 0.10, g: 0.31, b: 0.72 };  // #1a4fb8 — deep cobalt at edges

// (3a) Inner brilliant core — tiny icosahedron at origin, additive-blended.
// Smaller than CUBE_HALF so it reads as a contained bright point of light,
// not a competing shape. Pure math: THREE generates the icosahedron vertices
// from φ (golden ratio); we just position + animate.
const CORE_RADIUS = CUBE_HALF * 0.42;
const coreGeo = new THREE.IcosahedronGeometry(CORE_RADIUS, 1);
const coreMat = new THREE.MeshBasicMaterial({
  color: new THREE.Color(TESSERACT_CORE.r, TESSERACT_CORE.g, TESSERACT_CORE.b),
  transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
scene.add(coreMesh);

// (3b) Radial haze wisps — sparse line segments radiating from origin,
// pure procedural (sin/cos sweep + per-wisp phase offset). Gives the "contained
// luminous energy" haze without textures. Wisps live in a small sphere of
// radius ~CUBE_HALF * 2.2 and fade with distance from center.
const NUM_WISPS = 14;
const WISP_SEGMENTS = 6;  // each wisp = 6 short segments (12 endpoints)
const wispGeo = new THREE.BufferGeometry();
const wispPositions = new Float32Array(NUM_WISPS * WISP_SEGMENTS * 2 * 3);
const wispColors = new Float32Array(NUM_WISPS * WISP_SEGMENTS * 2 * 3);
wispGeo.setAttribute('position', new THREE.BufferAttribute(wispPositions, 3));
wispGeo.setAttribute('color', new THREE.BufferAttribute(wispColors, 3));
const wispLines = new THREE.LineSegments(wispGeo, new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 1.0,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(wispLines);

// Pre-randomized wisp directions on the unit sphere (Fibonacci-ish distribution
// so they spread evenly, no clustering). Stored as unit vectors; per-frame we
// modulate length + phase via sin(t) so they breathe.
const WISP_DIRS = [];
for (let i = 0; i < NUM_WISPS; i++) {
  const golden = Math.PI * (3 - Math.sqrt(5));  // golden angle
  const phi = Math.acos(1 - 2 * (i + 0.5) / NUM_WISPS);
  const theta = golden * i;
  WISP_DIRS.push([
    Math.sin(phi) * Math.cos(theta),
    Math.sin(phi) * Math.sin(theta),
    Math.cos(phi)
  ]);
}

// =====================================================================
// CHANGE A (v15): TESSERACT CLICK BURSTS
// Every click spawns a tiny icy-wireframe icosahedron at the click point.
// It scales up fast, peaks, then collapses — like a quantum-tesseract pop.
// InstancedMesh lets us have many bursts at once with one draw call.
// =====================================================================
const MAX_BURSTS = 24;
const BURST_DURATION_MS = 380;
const BURST_PEAK_SCALE = 0.42;        // peak radius — slightly bigger than a pentagon
const burstGeo = new THREE.IcosahedronGeometry(1, 1);  // unit, instance-scaled
const burstMat = new THREE.MeshBasicMaterial({
  color: new THREE.Color(TESSERACT_CORE.r, TESSERACT_CORE.g, TESSERACT_CORE.b),
  transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false,
  wireframe: true   // wireframe makes it read as tesseract, not flash
});
const burstMesh = new THREE.InstancedMesh(burstGeo, burstMat, MAX_BURSTS);
burstMesh.count = 0;
scene.add(burstMesh);

const clickBursts = [];   // { x, y, z, startTime }
const _burstMat4 = new THREE.Matrix4();
const _burstEuler = new THREE.Euler();
const _burstScale = new THREE.Vector3();

function spawnClickBurst(x, y, z) {
  if (clickBursts.length >= MAX_BURSTS) clickBursts.shift();
  clickBursts.push({ x, y, z, startTime: performance.now() });
}

function updateClickBursts(now) {
  let active = 0;
  for (let i = clickBursts.length - 1; i >= 0; i--) {
    const b = clickBursts[i];
    const t = (now - b.startTime) / BURST_DURATION_MS;
    if (t >= 1.0) { clickBursts.splice(i, 1); continue; }
    // Scale curve: fast rise (0 -> peak in first 25%), slow decay (75% remaining)
    let scale;
    if (t < 0.25) {
      const u = t / 0.25;
      scale = BURST_PEAK_SCALE * (1 - (1 - u) * (1 - u));  // ease-out
    } else {
      const u = (t - 0.25) / 0.75;
      scale = BURST_PEAK_SCALE * (1 - u) * (1 - u);  // ease-in to zero
    }
    // Tumble: gives the icosahedron some character as it pops
    const elapsed = now - b.startTime;
    _burstEuler.set(elapsed * 0.006, elapsed * 0.008, elapsed * 0.004);
    _burstMat4.makeRotationFromEuler(_burstEuler);
    _burstMat4.setPosition(b.x, b.y, b.z);
    _burstScale.set(scale, scale, scale);
    _burstMat4.scale(_burstScale);
    burstMesh.setMatrixAt(active, _burstMat4);
    active++;
  }
  burstMesh.count = active;
  if (active > 0) burstMesh.instanceMatrix.needsUpdate = true;
}

let solfeggioIndex = 5;  // start at 528 Hz MIRA

function updateCenter(now, dt) {
  // Solfeggio drives everything
  const hz = SOLFEGGIO[solfeggioIndex].hz;
  const omega = (hz / VISIBLE_DIVISOR) * 2 * Math.PI;
  const t = now * 0.001;
  // The full sine carries sign — we use it to drive the WAVE shape
  // The rectified (positive-only) part drives the cube's resonance reveal
  const wave = Math.sin(omega * t);
  // Sharper flicker — steeper curve so the cube SNAPS in/out instead of fading.
  // Math.pow(x, 0.25) lifts the curve toward 1 fast (most of the cycle is fully bright)
  // and crashes to 0 fast at the edges. Quantum-collapse vibe.
  const resonance = Math.pow(Math.max(0, wave), 0.25);

  // Sub-pixel jitter — always present so even the wave-form trembles
  const jx = 0.008 * Math.sin(t * 17 + 1.3);
  const jy = 0.008 * Math.sin(t * 22 + 2.7);
  const jz = 0.008 * Math.sin(t * 25 + 0.9);

  // --- (1) Continuous oscilloscope trace ---
  // Path: trace the square cube outline as a closed loop, but perturb each point
  // perpendicularly by sin(phase + ωt) so it looks like a vibrating beam.
  // When wave>0 the beam pushes outward, when wave<0 it pulls inward.
  // This makes the cube outline ALWAYS visibly oscillating, never static.
  const beamOffset = 0.025 * wave;  // how far the beam bows from the cube outline
  let widx = 0;
  for (let i = 0; i < WAVE_SEGMENTS; i++) {
    const phase0 = (i     / WAVE_SEGMENTS) * Math.PI * 2;
    const phase1 = ((i+1) / WAVE_SEGMENTS) * Math.PI * 2;
    // Sample two points on the cube's silhouette circle, perturbed radially by the wave
    const r0 = CUBE_HALF * Math.SQRT2 + beamOffset * Math.sin(phase0 * 4 + omega*t*3);
    const r1 = CUBE_HALF * Math.SQRT2 + beamOffset * Math.sin(phase1 * 4 + omega*t*3);
    // 3D rotating view plane — rotate around Y so the trace is always angled
    const tilt = t * 0.4;
    const a0 = phase0 + tilt, a1 = phase1 + tilt;
    const x0 = jx + r0 * Math.cos(a0), y0 = jy + r0 * Math.sin(a0) * 0.6, z0 = jz + r0 * Math.sin(a0) * 0.8;
    const x1 = jx + r1 * Math.cos(a1), y1 = jy + r1 * Math.sin(a1) * 0.6, z1 = jz + r1 * Math.sin(a1) * 0.8;
    wavePositions[widx*3 + 0] = x0; wavePositions[widx*3 + 1] = y0; wavePositions[widx*3 + 2] = z0; widx++;
    wavePositions[widx*3 + 0] = x1; wavePositions[widx*3 + 1] = y1; wavePositions[widx*3 + 2] = z1; widx++;
  }
  // Wave brightness — faint baseline matching lattice, slight pop on resonance.
  // v14: now in TESSERACT BLUE — interpolate core (hot) → mid (cool) by resonance.
  const waveBright = 0.22 + 0.45 * resonance;
  const wMix = resonance;  // 0 = cool mid, 1 = hot core
  const wR = waveBright * (TESSERACT_MID.r + (TESSERACT_CORE.r - TESSERACT_MID.r) * wMix);
  const wG = waveBright * (TESSERACT_MID.g + (TESSERACT_CORE.g - TESSERACT_MID.g) * wMix);
  const wB = waveBright * (TESSERACT_MID.b + (TESSERACT_CORE.b - TESSERACT_MID.b) * wMix);
  for (let i = 0; i < WAVE_SEGMENTS * 2; i++) {
    waveColors[i*3]     = wR;
    waveColors[i*3 + 1] = wG;
    waveColors[i*3 + 2] = wB;
  }
  waveGeo.attributes.position.needsUpdate = true;
  waveGeo.attributes.color.needsUpdate = true;

  // --- (2) Wavy cube faces — each face is a small NxN lattice that ripples in/out ---
  // For each face, parameterize a 2D grid in tangent/bitangent space.
  // Each grid point is offset along the face NORMAL by sin(kx + ky + ωt) — a 2D standing wave.
  // Draw the grid as horizontal + vertical line segments between adjacent points.
  // When wave is positive, faces bulge outward; when negative, dimple inward. The cube *breathes*.
  let fidx = 0;
  const waveAmpFace = 0.018 * (0.5 + 0.5 * resonance);  // ripple amplitude grows with resonance
  const waveK = 5.5;  // spatial frequency on each face
  // Precompute jitter-offset center
  const cx = jx, cy = jy, cz = jz;

  // Each face's surface-grid samples. Reuse a small 2D array.
  const gridPts = new Array(FACE_GRID * FACE_GRID);

  for (let f = 0; f < 6; f++) {
    const face = CUBE_FACES[f];
    // Build the grid in 3D
    for (let i = 0; i < FACE_GRID; i++) {
      for (let j = 0; j < FACE_GRID; j++) {
        // u, v in [-1, 1] over the face
        const u = (i / (FACE_GRID - 1)) * 2 - 1;
        const v = (j / (FACE_GRID - 1)) * 2 - 1;
        // Base point on face: normal axis at ±CUBE_HALF, tangent/bitangent at u/v × CUBE_HALF
        const pt = [0, 0, 0];
        pt[face.nIdx] = face.nSign * CUBE_HALF;
        pt[face.tIdx] = u * CUBE_HALF;
        pt[face.bIdx] = v * CUBE_HALF;
        // Ripple: displacement ALONG the face normal, driven by 2D standing wave
        const ripple = waveAmpFace * Math.sin(waveK * u + waveK * v + omega * t * 2);
        pt[face.nIdx] += face.nSign * ripple;
        // Cube rotation (apply same rotation as before so all 6 faces rotate together)
        const rx = t * 0.35, ry = t * 0.27;
        // Rotate around X then Y
        const cosrx = Math.cos(rx), sinrx = Math.sin(rx);
        const cosry = Math.cos(ry), sinry = Math.sin(ry);
        let x = pt[0], y = pt[1], z = pt[2];
        // X-rotation: y, z change
        let y1 = y * cosrx - z * sinrx;
        let z1 = y * sinrx + z * cosrx;
        // Y-rotation: x, z change
        let x2 = x * cosry + z1 * sinry;
        let z2 = -x * sinry + z1 * cosry;
        gridPts[i * FACE_GRID + j] = [cx + x2, cy + y1, cz + z2];
      }
    }
    // Connect horizontal neighbors (i, j) - (i+1, j)
    for (let i = 0; i < FACE_GRID - 1; i++) {
      for (let j = 0; j < FACE_GRID; j++) {
        const a = gridPts[i * FACE_GRID + j];
        const b = gridPts[(i + 1) * FACE_GRID + j];
        facePositions[fidx*3+0] = a[0]; facePositions[fidx*3+1] = a[1]; facePositions[fidx*3+2] = a[2]; fidx++;
        facePositions[fidx*3+0] = b[0]; facePositions[fidx*3+1] = b[1]; facePositions[fidx*3+2] = b[2]; fidx++;
      }
    }
    // Connect vertical neighbors (i, j) - (i, j+1)
    for (let i = 0; i < FACE_GRID; i++) {
      for (let j = 0; j < FACE_GRID - 1; j++) {
        const a = gridPts[i * FACE_GRID + j];
        const b = gridPts[i * FACE_GRID + j + 1];
        facePositions[fidx*3+0] = a[0]; facePositions[fidx*3+1] = a[1]; facePositions[fidx*3+2] = a[2]; fidx++;
        facePositions[fidx*3+0] = b[0]; facePositions[fidx*3+1] = b[1]; facePositions[fidx*3+2] = b[2]; fidx++;
      }
    }
  }
  // Cube face brightness — drops to 0 when wave is negative, so the cube genuinely
  // flickers OUT of existence on the negative half of each cycle. Real flicker at any Hz.
  // v14: tesseract palette — cool MID base, hot CORE on resonance peaks.
  const faceBright = 0.95 * resonance;
  const fMix = resonance;
  const fcR = faceBright * (TESSERACT_MID.r + (TESSERACT_CORE.r - TESSERACT_MID.r) * fMix);
  const fcG = faceBright * (TESSERACT_MID.g + (TESSERACT_CORE.g - TESSERACT_MID.g) * fMix);
  const fcB = faceBright * (TESSERACT_MID.b + (TESSERACT_CORE.b - TESSERACT_MID.b) * fMix);
  for (let i = 0; i < fidx; i++) {
    faceColors[i*3]     = fcR;
    faceColors[i*3 + 1] = fcG;
    faceColors[i*3 + 2] = fcB;
  }
  faceGeo.attributes.position.needsUpdate = true;
  faceGeo.attributes.color.needsUpdate = true;
  faceGeo.setDrawRange(0, fidx);

  // --- (3a) Inner brilliant core — position + pulse ---
  // Stays at the cube's center (jitter-offset), scales with resonance so it
  // brightens on peaks. Slow tumble independent of cube rotation.
  coreMesh.position.set(jx, jy, jz);
  const coreScale = 0.55 + 0.55 * resonance;  // 0.55 quiet, 1.1 at peak
  coreMesh.scale.setScalar(coreScale);
  coreMesh.rotation.x = t * 0.7;
  coreMesh.rotation.y = t * 0.5;
  // Core brightness rides the resonance — additive blend on a dark scene
  // means opacity is the brightness knob.
  coreMat.opacity = 0.55 + 0.40 * resonance;

  // --- (3b) Haze wisps — sparse radial lines, breathing in/out ---
  // Each wisp is WISP_SEGMENTS short segments along its direction, fading from
  // bright at the cube surface to dark at the outer reach. Length modulated
  // by per-wisp phase + global resonance — gives the "contained energy" haze.
  let widx2 = 0;
  const wispOuterMax = CUBE_HALF * 3.2;
  for (let wi = 0; wi < NUM_WISPS; wi++) {
    const dir = WISP_DIRS[wi];
    // Per-wisp phase so they don't all breathe in sync (chaotic looks alive)
    const wPhase = wi * 0.7;
    const breath = 0.5 + 0.5 * Math.sin(t * 1.4 + wPhase);
    // Length scales with resonance — on peaks the wisps push out further
    const wispLen = wispOuterMax * (0.45 + 0.55 * breath) * (0.7 + 0.4 * resonance);
    // Inner endpoint sits just outside the cube core surface, outer trails away
    const rInner = CUBE_HALF * 1.05;
    for (let s = 0; s < WISP_SEGMENTS; s++) {
      const tA = s / WISP_SEGMENTS;
      const tB = (s + 1) / WISP_SEGMENTS;
      const rA = rInner + (wispLen - rInner) * tA;
      const rB = rInner + (wispLen - rInner) * tB;
      const xA = jx + dir[0] * rA, yA = jy + dir[1] * rA, zA = jz + dir[2] * rA;
      const xB = jx + dir[0] * rB, yB = jy + dir[1] * rB, zB = jz + dir[2] * rB;
      wispPositions[widx2*3+0] = xA; wispPositions[widx2*3+1] = yA; wispPositions[widx2*3+2] = zA; widx2++;
      wispPositions[widx2*3+0] = xB; wispPositions[widx2*3+1] = yB; wispPositions[widx2*3+2] = zB; widx2++;
    }
    // Color: hot at inner end (CORE), cool at outer end (OUTER), all multiplied
    // by a brightness that fades with distance from cube and rides resonance.
    // We just wrote 2*WISP_SEGMENTS endpoints; color them index by index.
    const startEndpoint = widx2 - WISP_SEGMENTS * 2;
    for (let s = 0; s < WISP_SEGMENTS; s++) {
      const tA = s / WISP_SEGMENTS;
      const tB = (s + 1) / WISP_SEGMENTS;
      // Brightness falls off cubically along the wisp; resonance lifts the curve
      const brA = (1 - tA) * (1 - tA) * (0.30 + 0.55 * resonance);
      const brB = (1 - tB) * (1 - tB) * (0.30 + 0.55 * resonance);
      // Color: blend CORE → MID → OUTER as we travel outward
      const cA = tA < 0.5
        ? mixColor(TESSERACT_CORE, TESSERACT_MID, tA * 2)
        : mixColor(TESSERACT_MID, TESSERACT_OUTER, (tA - 0.5) * 2);
      const cB = tB < 0.5
        ? mixColor(TESSERACT_CORE, TESSERACT_MID, tB * 2)
        : mixColor(TESSERACT_MID, TESSERACT_OUTER, (tB - 0.5) * 2);
      const idxA = (startEndpoint + s * 2) * 3;
      const idxB = (startEndpoint + s * 2 + 1) * 3;
      wispColors[idxA + 0] = cA.r * brA;
      wispColors[idxA + 1] = cA.g * brA;
      wispColors[idxA + 2] = cA.b * brA;
      wispColors[idxB + 0] = cB.r * brB;
      wispColors[idxB + 1] = cB.g * brB;
      wispColors[idxB + 2] = cB.b * brB;
    }
  }
  wispGeo.attributes.position.needsUpdate = true;
  wispGeo.attributes.color.needsUpdate = true;
}

// Small helper: linear color mix, returns {r,g,b}. Used by the wisp shader.
function mixColor(a, b, t) {
  return {
    r: a.r + (b.r - a.r) * t,
    g: a.g + (b.g - a.g) * t,
    b: a.b + (b.b - a.b) * t
  };
}

// These are the "guru frequencies" — believed in sound healing to do everything from
// repair DNA (528 Hz) to align you with the Earth's heartbeat (7.83 Hz Schumann).
// We scale them down by VISIBLE_DIVISOR so the cube pulses at a watchable rate.

const SOLFEGGIO = [
  { hz:   7.83, code: "GAEA",   name: "Schumann", meaning: "Earth's heartbeat" },
  { hz: 174,    code: "NOXA",   name: "UT₋₂",     meaning: "Pain & stress relief" },

];
// ===== Möbius parameters =====
const R = 3.0;
const WIDTH = 1.25;
let U_STEPS = 120;
let V_STEPS = 18;
const AMPLITUDE = 0.55;   // height of pentagon bump (along normal)
const SIGMA = 0.45;       // bump falloff in parameter space

// ===== Parameterization =====
function paramToWorld(u, v) {
  const cosU2 = Math.cos(u/2);
  const sinU2 = Math.sin(u/2);
  return [
    (R + v * cosU2) * Math.cos(u),
    (R + v * cosU2) * Math.sin(u),
    v * sinU2
  ];
}

// ===== Surface normal — numerical, force outward =====
function getNormal(u, v) {
  const h = 0.001;
  const p0 = paramToWorld(u, v);
  const p1 = paramToWorld(u + h, v);
  const p2 = paramToWorld(u, v + h);
  const tux = (p1[0]-p0[0])/h, tuy = (p1[1]-p0[1])/h, tuz = (p1[2]-p0[2])/h;
  const tvx = (p2[0]-p0[0])/h, tvy = (p2[1]-p0[1])/h, tvz = (p2[2]-p0[2])/h;
  let nx = tuy*tvz - tuz*tvy;
  let ny = tuz*tvx - tux*tvz;
  let nz = tux*tvy - tuy*tvx;
  const mag = Math.hypot(nx, ny, nz);
  if (mag < 1e-6) return [0, 0, 1];
  nx /= mag; ny /= mag; nz /= mag;
  // Force "outward" — flip if normal points back at origin
  // (this is what makes both sides bend in the SAME direction)
  const dot = nx*p0[0] + ny*p0[1] + nz*p0[2];
  if (dot < 0) return [-nx, -ny, -nz];
  return [nx, ny, nz];
}

// ===== State =====
const pentagons = []; // {u, v, activation, target}

function getLift(u, v) {
  let total = 0;
  for (const p of pentagons) {
    if (p.activation <= 0) continue;
    // Periodic distance in u
    let du = u - p.u;
    while (du > Math.PI) du -= 2*Math.PI;
    while (du < -Math.PI) du += 2*Math.PI;
    const dv = v - p.v;
    const d2 = du*du + dv*dv*0.8;  // anisotropic falloff
    total += AMPLITUDE * p.activation * Math.exp(-d2 / (SIGMA*SIGMA));
  }
  return total;
}

// ===== Central attractor — F = k/r² gravity pulling toward origin =====
// v14: allow pullFrac to exceed 1.0 so the surface can fold through the origin
//      symmetrically, revealing the χ=0 self-intersection structure.
let GRAVITY_K = 0;  // strength, controlled by slider (0..7.0 for 0..200%)
const GRAVITY_EPS = 0.4;       // softening — keeps r² from going to zero
const GRAVITY_MAX_PULL = 1.85; // raised cap — at 200% slider, fully invert through origin

function applyGravity(x, y, z) {
  if (GRAVITY_K === 0) return [x, y, z];
  const r2 = x*x + y*y + z*z;
  const r = Math.sqrt(r2);
  if (r < 0.001) return [x, y, z];
  let pullFrac = GRAVITY_K / (r2 + GRAVITY_EPS);
  if (pullFrac > GRAVITY_MAX_PULL) pullFrac = GRAVITY_MAX_PULL;
  // scale ∈ [1 - GRAVITY_MAX_PULL, 1] — at 200% slider, scale crosses zero and
  // becomes negative, flipping points through origin to the opposite side at
  // a reduced distance. The Möbius then folds symmetrically into itself.
  const scale = 1 - pullFrac;
  return [x * scale, y * scale, z * scale];
}

// ===== Quantum flux — fBm shimmer on every lattice point =====
// Perlin-style hash → smooth pseudo-random gradient per integer lattice point
function hash3(i, j, k) {
  const s = Math.sin(i * 127.1 + j * 311.7 + k * 74.7) * 43758.5453;
  return s - Math.floor(s);  // [0,1)
}
// 3D value-noise (cheaper than full Perlin, still smooth) — trilinear interpolation between 8 cube corners
function smoothNoise3(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  // smoothstep for fade
  const u = fx*fx*(3-2*fx), v = fy*fy*(3-2*fy), w = fz*fz*(3-2*fz);
  const c000 = hash3(ix, iy, iz),     c100 = hash3(ix+1, iy, iz);
  const c010 = hash3(ix, iy+1, iz),   c110 = hash3(ix+1, iy+1, iz);
  const c001 = hash3(ix, iy, iz+1),   c101 = hash3(ix+1, iy, iz+1);
  const c011 = hash3(ix, iy+1, iz+1), c111 = hash3(ix+1, iy+1, iz+1);
  const x00 = c000 + u*(c100 - c000), x10 = c010 + u*(c110 - c010);
  const x01 = c001 + u*(c101 - c001), x11 = c011 + u*(c111 - c011);
  const y0 = x00 + v*(x10 - x00), y1 = x01 + v*(x11 - x01);
  return (y0 + w*(y1 - y0)) * 2 - 1;  // → [-1, 1]
}
// Fractional Brownian Motion = stacked octaves of noise
function fbm(x, y, z) {
  let sum = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 3; i++) {
    sum += amp * smoothNoise3(x*freq, y*freq, z*freq);
    freq *= 2; amp *= 0.5;
  }
  return sum;  // ≈ [-0.875, 0.875]
}

let SHIMMER_K = 0;  // intensity, controlled by slider
let shimmerTime = 0;  // advances per frame so noise field "flows"

function applyShimmer(x, y, z, u, v) {
  if (SHIMMER_K === 0) return [x, y, z];
  // Use (u, v) as spatial coords for noise — neighboring lattice points get correlated noise
  // Three independent fBm samples (one per axis), offset in time-space, so each point wobbles in 3D
  const t = shimmerTime;
  const dx = fbm(u * 0.8, v * 1.2, t)         * SHIMMER_K;
  const dy = fbm(u * 0.8 + 13, v * 1.2 + 7, t) * SHIMMER_K;
  const dz = fbm(u * 0.8 + 5, v * 1.2 + 31, t) * SHIMMER_K;
  return [x + dx, y + dy, z + dz];
}

function vertexPos(u, v) {
  const [x0, y0, z0] = paramToWorld(u, v);
  const lift = getLift(u, v);
  let x = x0, y = y0, z = z0;
  if (lift !== 0) {
    const [nx, ny, nz] = getNormal(u, v);
    x += nx*lift; y += ny*lift; z += nz*lift;
  }
  [x, y, z] = applyGravity(x, y, z);
  [x, y, z] = applyShimmer(x, y, z, u, v);
  return [x, y, z];
}

function rebuildLattice() {
  gridPoints = [];
  for (let i = 0; i <= U_STEPS; i++) {
    const u = (i / U_STEPS) * Math.PI * 2;
    for (let j = 0; j <= V_STEPS; j++) {
      const v = (j / V_STEPS) * 2 * WIDTH - WIDTH;
      gridPoints.push([u, v]);
    }
  }
  lineIndices = [];
  for (let i = 0; i <= U_STEPS; i++) {
    for (let j = 0; j <= V_STEPS; j++) {
      if (i < U_STEPS) {
        const cur = i * (V_STEPS + 1) + j;
        lineIndices.push(cur, cur + (V_STEPS + 1));
      }
      if (j < V_STEPS && ((i + j) % 2 === 0)) {
        const cur = i * (V_STEPS + 1) + j;
        lineIndices.push(cur, cur + 1);
      }
    }
  }
  positions = new Float32Array(gridPoints.length * 3);
  lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  lineGeo.setIndex(lineIndices);
}

// the dodecahedron's edge graph drawn on a one-sided surface.
// Pure math: nearest-neighbor pairs in 3D world space, arcs sampled via vertexPos.
// =====================================================================
const ECHO_ARC_SAMPLES = 14;        // segments per arc — smoother at higher
const ECHO_MAX_NEIGHBORS = 3;       // each pentagon connects to its 3 nearest
                                    // (dodecahedron is 3-regular: 3 edges/vertex)
const ECHO_BUFFER_SIZE = 50 * ECHO_MAX_NEIGHBORS * 2 * ECHO_ARC_SAMPLES * 2 * 3;

const ECHO_COLOR_NEAR = { r: 0.00, g: 0.83, b: 1.00 };  // #00d4ff cyan hot
const ECHO_COLOR_FAR  = { r: 0.10, g: 0.31, b: 0.72 };  // #1a4fb8 deep blue tail

function updateDodecahedralEcho() {
  let widx = 0;
  // Snapshot active pentagons (those past activation threshold) with their world pos
  const active = [];
  for (let i = 0; i < pentagons.length; i++) {
    const p = pentagons[i];
    if (p.target === 0 || p.activation <= 0.15) continue;
    const pos = vertexPos(p.u, p.v);
    active.push({ idx: i, u: p.u, v: p.v, pos, act: p.activation, selected: !!p.selected });
  }
  // Skip drawing if too few — echo only meaningful with 4+ active vertices
  if (active.length < 4) {
    echoGeo.setDrawRange(0, 0);
    return;
  }
  // For each active pentagon, find its K nearest neighbors in 3D world space.
  // Deduplicate pairs (a→b and b→a are the same edge).
  const seen = new Set();
  for (let i = 0; i < active.length; i++) {
    const a = active[i];
    const dists = [];
    for (let j = 0; j < active.length; j++) {
      if (i === j) continue;
      const b = active[j];
      const d = Math.hypot(a.pos[0]-b.pos[0], a.pos[1]-b.pos[1], a.pos[2]-b.pos[2]);
      dists.push({ j, d });
    }
    dists.sort((x, y) => x.d - y.d);
    const k = Math.min(ECHO_MAX_NEIGHBORS, dists.length);
    for (let n = 0; n < k; n++) {
      const j = dists[n].j;
      const key = i < j ? `${i}_${j}` : `${j}_${i}`;
      if (seen.has(key)) continue;
      seen.add(key);
      const b = active[j];
      // Route arc through parameter space — interpolate (u,v) linearly, but
      // handle the Möbius wrap in u (shortest-path mod 2π).
      let du = b.u - a.u;
      if (du > Math.PI) du -= 2 * Math.PI;
      if (du < -Math.PI) du += 2 * Math.PI;
      const dv = b.v - a.v;
      // Edge brightness scales with both pentagons' activation
      const edgeAct = Math.min(a.act, b.act);
      // v15: edges between two SELECTED pentagons glow brighter — the
      // "chosen ones connect to each other" signal in the dodecahedral graph.
      const selectionBoost = (a.selected && b.selected) ? 1.8 : 1.0;
      for (let s = 0; s < ECHO_ARC_SAMPLES; s++) {
        const tA = s / ECHO_ARC_SAMPLES;
        const tB = (s + 1) / ECHO_ARC_SAMPLES;
        const uA = a.u + du * tA, vA = a.v + dv * tA;
        const uB = a.u + du * tB, vB = a.v + dv * tB;
        const pA = vertexPos((uA + 2*Math.PI) % (2*Math.PI), vA);
        const pB = vertexPos((uB + 2*Math.PI) % (2*Math.PI), vB);
        echoPositions[widx*3+0] = pA[0]; echoPositions[widx*3+1] = pA[1]; echoPositions[widx*3+2] = pA[2];
        // Color: hot cyan near the endpoints, deeper blue mid-arc
        // (Bell curve: max brightness at the ends, dimmer in middle —
        // gives the "edge implies vertex" reading)
        const fadeA = Math.abs(tA - 0.5) * 2;  // 0 in middle, 1 at ends
        const fadeB = Math.abs(tB - 0.5) * 2;
        const cA = mixColor(ECHO_COLOR_FAR, ECHO_COLOR_NEAR, fadeA);
        const cB = mixColor(ECHO_COLOR_FAR, ECHO_COLOR_NEAR, fadeB);
        const brA = (0.35 + 0.55 * fadeA) * edgeAct * selectionBoost;
        const brB = (0.35 + 0.55 * fadeB) * edgeAct * selectionBoost;
        echoColors[widx*3+0] = cA.r * brA;
        echoColors[widx*3+1] = cA.g * brA;
        echoColors[widx*3+2] = cA.b * brA;
        widx++;
        echoPositions[widx*3+0] = pB[0]; echoPositions[widx*3+1] = pB[1]; echoPositions[widx*3+2] = pB[2];
        echoColors[widx*3+0] = cB.r * brB;
        echoColors[widx*3+1] = cB.g * brB;
        echoColors[widx*3+2] = cB.b * brB;
        widx++;
      }
    }
  }
  echoGeo.attributes.position.needsUpdate = true;
  echoGeo.attributes.color.needsUpdate = true;
  echoGeo.setDrawRange(0, widx);
}


// Palette
const COLOR_PENT_DEFAULT  = [1.0, 0.565, 0.565];   // #ff9090 — curvature stress
const COLOR_PENT_HOVER    = [0.498, 1.0, 0.667];   // #7fffaa — interaction state
// v15: selection ring uses bright tesseract cyan, pulses with time
const COLOR_PENT_SELECTED = [0.00, 0.83, 1.00];    // #00d4ff — locked-in cyan

let hoveredPentIdx = -1;  // index in pentagons array of the one under the mouse, or -1

function updatePentagonMarkers() {
  const now = performance.now() * 0.001;
  // Subtle pulse for selection rings — sin curve in [0.65, 1.0]
  const selPulse = 0.65 + 0.35 * (0.5 + 0.5 * Math.sin(now * 2.4));
  let idx = 0;
  for (let pi = 0; pi < pentagons.length; pi++) {
    const p = pentagons[pi];
    if (p.activation <= 0.05) continue;
    const center = vertexPos(p.u, p.v);
    const h = 0.001;
    const p0 = paramToWorld(p.u, p.v);
    const p1 = paramToWorld(p.u + h, p.v);
    let tx = (p1[0]-p0[0])/h, ty = (p1[1]-p0[1])/h, tz = (p1[2]-p0[2])/h;
    const tmag = Math.hypot(tx, ty, tz);
    tx /= tmag; ty /= tmag; tz /= tmag;
    const n = getNormal(p.u, p.v);
    const bx = n[1]*tz - n[2]*ty;
    const by = n[2]*tx - n[0]*tz;
    const bz = n[0]*ty - n[1]*tx;
    const size = 0.18 * p.activation;
    const col = (pi === hoveredPentIdx) ? COLOR_PENT_HOVER : COLOR_PENT_DEFAULT;

    // Inner pentagon outline (existing visual)
    const corners = [];
    for (let i = 0; i < 5; i++) {
      const a = Math.PI * 2 * i / 5 - Math.PI / 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      corners.push([
        center[0] + size * (ca*tx + sa*bx),
        center[1] + size * (ca*ty + sa*by),
        center[2] + size * (ca*tz + sa*bz)
      ]);
    }
    for (let i = 0; i < 5; i++) {
      const c1 = corners[i], c2 = corners[(i+1)%5];
      pentPositions[idx++] = c1[0]; pentPositions[idx++] = c1[1]; pentPositions[idx++] = c1[2];
      pentColors[idx-3] = col[0]; pentColors[idx-2] = col[1]; pentColors[idx-1] = col[2];
      pentPositions[idx++] = c2[0]; pentPositions[idx++] = c2[1]; pentPositions[idx++] = c2[2];
      pentColors[idx-3] = col[0]; pentColors[idx-2] = col[1]; pentColors[idx-1] = col[2];
    }

    // v15: selection ring — outer pentagon at 1.55× size, in pulsing cyan
    if (p.selected) {
      const ringSize = size * 1.55;
      const ringCorners = [];
      // Rotate 36° (π/5) so the ring's vertices land between the inner ones
      const ringOffset = Math.PI / 5;
      for (let i = 0; i < 5; i++) {
        const a = Math.PI * 2 * i / 5 - Math.PI / 2 + ringOffset;
        const ca = Math.cos(a), sa = Math.sin(a);
        ringCorners.push([
          center[0] + ringSize * (ca*tx + sa*bx),
          center[1] + ringSize * (ca*ty + sa*by),
          center[2] + ringSize * (ca*tz + sa*bz)
        ]);
      }
      const rR = COLOR_PENT_SELECTED[0] * selPulse;
      const rG = COLOR_PENT_SELECTED[1] * selPulse;
      const rB = COLOR_PENT_SELECTED[2] * selPulse;
      for (let i = 0; i < 5; i++) {
        const c1 = ringCorners[i], c2 = ringCorners[(i+1)%5];
        pentPositions[idx++] = c1[0]; pentPositions[idx++] = c1[1]; pentPositions[idx++] = c1[2];
        pentColors[idx-3] = rR; pentColors[idx-2] = rG; pentColors[idx-1] = rB;
        pentPositions[idx++] = c2[0]; pentPositions[idx++] = c2[1]; pentPositions[idx++] = c2[2];
        pentColors[idx-3] = rR; pentColors[idx-2] = rG; pentColors[idx-1] = rB;
      }
    }
  }
  pentGeo.attributes.position.needsUpdate = true;
  pentGeo.attributes.color.needsUpdate = true;
  pentGeo.setDrawRange(0, idx / 3);
}

}
function removePentagonNear(u, v, threshold = 0.22) {
  // Tighter: must click visually close to the pentagon
  let bestIdx = -1, bestD = Infinity;
  for (let i = pentagons.length - 1; i >= 0; i--) {
    const p = pentagons[i];
    if (p.target === 0) continue;
    let du = u - p.u;
    while (du > Math.PI) du -= 2*Math.PI;
    while (du < -Math.PI) du += 2*Math.PI;
    const d = Math.hypot(du, (v - p.v) * 0.7);
    if (d < bestD && d < threshold) { bestD = d; bestIdx = i; }
  }
  if (bestIdx >= 0) { pentagons[bestIdx].target = 0; return true; }
  return false;
}

function place12() {
  for (const p of pentagons) p.target = 0;
  // Icosahedral-ish: 12 evenly spaced in u, alternating v
  for (let i = 0; i < 12; i++) {
    const u = (i / 12) * Math.PI * 2;
    const v = (i % 2 === 0) ? 0.5 : -0.5;
    placePentagon(u, v);
  }
}

function clearAll() {
  for (const p of pentagons) p.target = 0;
}

// =====================================================================
// CHANGE 3 (v14): GREEN-CLICK PATH PREVIEW
// When the user clicks the strip, before the pentagon lift begins, we briefly
// "stop time" on that placement and fan out N ghost rays from the click point
// along the surface — the "possible paths forward from this if-space choice."
// Rays fade over PREVIEW_DURATION_MS, then the pentagon commits and the
// existing lift animation handles "joining surfaces."
// =====================================================================
const PREVIEW_DURATION_MS = 520;   // v15.1: longer so rays are clearly seen
const PREVIEW_NUM_RAYS = 7;
const PREVIEW_RAY_SAMPLES = 10;
const PREVIEW_RAY_REACH = 0.95;    // v15.1: slightly longer reach

// Ghost-ray geometry buffer (capacity: 1 preview at a time × N rays × samples × 2 endpoints × 3)
const PREVIEW_BUFFER_SIZE = PREVIEW_NUM_RAYS * PREVIEW_RAY_SAMPLES * 2 * 3;
const previewPositions = new Float32Array(PREVIEW_BUFFER_SIZE);
const previewColors = new Float32Array(PREVIEW_BUFFER_SIZE);
const previewGeo = new THREE.BufferGeometry();
previewGeo.setAttribute('position', new THREE.BufferAttribute(previewPositions, 3));
previewGeo.setAttribute('color', new THREE.BufferAttribute(previewColors, 3));
const previewLines = new THREE.LineSegments(previewGeo, new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 1.0,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(previewLines);
previewGeo.setDrawRange(0, 0);

// Preview state machine. Null = idle. Active = currently rendering ghost rays.
let activePreview = null;
// shape: { u, v, startTime, committed: bool }

function startPathPreview(u, v) {
  activePreview = { u, v, startTime: performance.now(), committed: false };
}

function updatePathPreview(now) {
  if (!activePreview) {
    previewGeo.setDrawRange(0, 0);
    return false;
  }
  const elapsed = now - activePreview.startTime;
  const tNorm = elapsed / PREVIEW_DURATION_MS;
  // Commit the pentagon at 55% through the preview — so lift begins as rays
  // are still fading. Feels like "the choice was made, surfaces now join."
  if (!activePreview.committed && tNorm >= 0.55) {
    placePentagon(activePreview.u, activePreview.v);
    activePreview.committed = true;
  }
  if (tNorm >= 1.0) {
    activePreview = null;
    previewGeo.setDrawRange(0, 0);
    return false;
  }
  // v15.1: rays were getting drowned by the burst at click moment. Separate
  // EXTENT and BRIGHTNESS curves so rays grow fast, hold extended, then
  // retract — and stay bright through most of the cycle, not just at start.
  // Extent: smoothstep up in first 18%, hold to 72%, smoothstep down to 100%
  let reach;
  if (tNorm < 0.18) {
    const u = tNorm / 0.18;
    reach = u * u * (3 - 2 * u);      // smoothstep ease-in
  } else if (tNorm < 0.72) {
    reach = 1.0;                       // hold at full extent
  } else {
    const u = (tNorm - 0.72) / 0.28;
    reach = 1.0 - u * u * (3 - 2 * u); // smoothstep ease-out
  }
  // Brightness: quick ramp-in over first 12%, slow linear fade across the rest.
  // Boost factor punches through additive blending against the burst.
  let brightnessBase;
  if (tNorm < 0.12) {
    brightnessBase = tNorm / 0.12;
  } else {
    brightnessBase = Math.max(0, 1.0 - (tNorm - 0.12) / 0.88);
  }
  const BRIGHTNESS_BOOST = 1.85;
  // Draw N ghost rays in N angular directions in the local (u,v) plane
  let widx = 0;
  for (let r = 0; r < PREVIEW_NUM_RAYS; r++) {
    const angle = (r / PREVIEW_NUM_RAYS) * Math.PI * 2;
    // Direction in (u,v) — convert to non-degenerate stretch (u wraps, v capped)
    const dirU = Math.cos(angle) * PREVIEW_RAY_REACH;
    const dirV = Math.sin(angle) * PREVIEW_RAY_REACH * 0.45;  // v has tighter range
    for (let s = 0; s < PREVIEW_RAY_SAMPLES; s++) {
      const sA = (s / PREVIEW_RAY_SAMPLES) * reach;
      const sB = ((s + 1) / PREVIEW_RAY_SAMPLES) * reach;
      const uA = activePreview.u + dirU * sA;
      const vA = Math.max(-WIDTH, Math.min(WIDTH, activePreview.v + dirV * sA));
      const uB = activePreview.u + dirU * sB;
      const vB = Math.max(-WIDTH, Math.min(WIDTH, activePreview.v + dirV * sB));
      const pA = vertexPos((uA + 2*Math.PI) % (2*Math.PI), vA);
      const pB = vertexPos((uB + 2*Math.PI) % (2*Math.PI), vB);
      previewPositions[widx*3+0] = pA[0]; previewPositions[widx*3+1] = pA[1]; previewPositions[widx*3+2] = pA[2];
      // Color: green at base of ray (interaction color), fading to deep cyan tip
      const tEdge = s / PREVIEW_RAY_SAMPLES;
      const baseGreen = { r: 0.498, g: 1.0, b: 0.667 };  // #7fffaa — same as hover
      const tipCyan   = { r: 0.00,  g: 0.83, b: 1.00 };  // #00d4ff
      const cA = mixColor(baseGreen, tipCyan, tEdge);
      const cB = mixColor(baseGreen, tipCyan, (s + 1) / PREVIEW_RAY_SAMPLES);
      // v15.1: brighter at base (×1.0), modest taper toward tip (×0.7), boosted overall
      const brA = brightnessBase * (1 - tEdge * 0.30) * BRIGHTNESS_BOOST;
      const brB = brightnessBase * (1 - (s+1)/PREVIEW_RAY_SAMPLES * 0.30) * BRIGHTNESS_BOOST;
      previewColors[widx*3+0] = cA.r * brA;
      previewColors[widx*3+1] = cA.g * brA;
      previewColors[widx*3+2] = cA.b * brA;
      widx++;
      previewPositions[widx*3+0] = pB[0]; previewPositions[widx*3+1] = pB[1]; previewPositions[widx*3+2] = pB[2];
      previewColors[widx*3+0] = cB.r * brB;
      previewColors[widx*3+1] = cB.g * brB;
      previewColors[widx*3+2] = cB.b * brB;
      widx++;
    }
  }
  previewGeo.attributes.position.needsUpdate = true;
  previewGeo.attributes.color.needsUpdate = true;
  previewGeo.setDrawRange(0, widx);
  return true;  // signal that a refresh is needed (lattice may have been touched)
}

// ===== Animation tick =====
function tickLifts(dt) {
  let any = false;
  const speed = 3;
  for (let i = pentagons.length - 1; i >= 0; i--) {
    const p = pentagons[i];
    const diff = p.target - p.activation;
    if (Math.abs(diff) < 0.001) {
      if (p.target === 0) pentagons.splice(i, 1);
      continue;
    }
    const step = Math.sign(diff) * Math.min(Math.abs(diff), dt * speed);
    p.activation += step;
    any = true;
  }
  return any;
}

function updateStatus() {
  const active = pentagons.filter(p => p.target === 1).length;
  document.getElementById('pentN').textContent = active;
  // v15: selected counter, only visible when at least one is selected
  const selCount = pentagons.filter(p => p.target === 1 && p.selected).length;
  const selStat = document.getElementById('selStat');
  document.getElementById('selN').textContent = selCount;
  selStat.style.display = (selCount > 0) ? 'block' : 'none';
  const msg = document.getElementById('msg');
  if (active === 12) {
    msg.textContent = '✓ 12 pentagons on Möbius (χ=0)·curvature woven into the twist';
    msg.className = 'msg closed';
  } else if (active > 12) {
    msg.textContent = `${active} pentagons — over budget · Möbius can\'t hold this`;
    msg.className = 'msg over';
  } else {
    msg.textContent = `${active}/12 · click strip → toggle · shift+click → select · drag · scroll`;
    msg.className = 'msg';
  }
}

// ===== Click detection — raycast against the LIFTED surface =====
const meshUSteps = 80, meshVSteps = 12;
const meshIndices = [];
const meshVertCount = (meshUSteps + 1) * (meshVSteps + 1);
const meshVerts = new Float32Array(meshVertCount * 3);
for (let i = 0; i <= meshUSteps; i++) {
  for (let j = 0; j <= meshVSteps; j++) {
    if (i < meshUSteps && j < meshVSteps) {
      const a = i*(meshVSteps+1)+j;
      const b = (i+1)*(meshVSteps+1)+j;
      const c = (i+1)*(meshVSteps+1)+j+1;
      const d = i*(meshVSteps+1)+j+1;
      meshIndices.push(a,b,c, a,c,d);
    }
  }
}
const mobiusMeshGeo = new THREE.BufferGeometry();
mobiusMeshGeo.setAttribute('position', new THREE.BufferAttribute(meshVerts, 3));
mobiusMeshGeo.setIndex(meshIndices);
const mobiusMesh = new THREE.Mesh(
  mobiusMeshGeo,
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.0, side: THREE.DoubleSide, depthWrite: false })
);
scene.add(mobiusMesh);

function rebuildRaycastMesh() {
  let k = 0;
  for (let i = 0; i <= meshUSteps; i++) {
    const u = (i / meshUSteps) * Math.PI * 2;
    for (let j = 0; j <= meshVSteps; j++) {
      const v = (j / meshVSteps) * 2 * WIDTH - WIDTH;
      const [x, y, z] = vertexPos(u, v);
      meshVerts[k++] = x; meshVerts[k++] = y; meshVerts[k++] = z;
    }
  }
  mobiusMeshGeo.attributes.position.needsUpdate = true;
  mobiusMeshGeo.computeBoundingSphere();
}

function findUVFromHit(x, y, z) {
  // Search the LIFTED surface (vertexPos), not the flat one — clicks match what you see
  let bestU = 0, bestV = 0, bestD = Infinity;
  for (let i = 0; i < 36; i++) {
    for (let j = 0; j < 18; j++) {
      const u = (i / 36) * Math.PI * 2;
      const v = (j / 17) * 2 * WIDTH - WIDTH;
      const [px, py, pz] = vertexPos(u, v);
      const d = (x-px)**2 + (y-py)**2 + (z-pz)**2;
      if (d < bestD) { bestD = d; bestU = u; bestV = v; }
    }
  }
  for (let pass = 0; pass < 3; pass++) {
    const range = 0.3 / (pass + 1);
    for (let i = -5; i <= 5; i++) {
      for (let j = -5; j <= 5; j++) {
        const u = bestU + (i / 5) * range;
        const v = Math.max(-WIDTH, Math.min(WIDTH, bestV + (j / 5) * range));
        const uu = (u + 2*Math.PI) % (2*Math.PI);
        const [px, py, pz] = vertexPos(uu, v);
        const d = (x-px)**2 + (y-py)**2 + (z-pz)**2;
        if (d < bestD) { bestD = d; bestU = uu; bestV = v; }
      }
    }
  }
  return [bestU, bestV];
}

const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();

// =====================================================================
// CHANGE (v14.2): SCREEN-PRECISE CLICKS
// Hover + click detection switched from world-space distance (0.45 units)
// to screen-pixel distance. The pixel threshold scales naturally with zoom,
// and the hover highlight becomes the canonical "click here = remove"
// indicator. Click anywhere NOT highlighted = place, regardless of how
// close it is to another pentagon. Pentagons can sit right next to each
// other now without one click eating two.
// =====================================================================
const PENTAGON_HIT_PX = 22;  // pixel radius around pentagon center counts as "on it"

// Reusable scratch vector to avoid GC churn in the hover loop
const _projectScratch = new THREE.Vector3();
const _camForward = new THREE.Vector3();

function isInFrontOfCamera(wx, wy, wz) {
  // Cheap dot-product test: vector from camera to point, dotted with camera's
  // forward direction. Positive means in front. Avoids weird projection
  // artifacts for points behind the camera.
  camera.getWorldDirection(_camForward);
  const dx = wx - camera.position.x;
  const dy = wy - camera.position.y;
  const dz = wz - camera.position.z;
  return (dx * _camForward.x + dy * _camForward.y + dz * _camForward.z) > 0;
}

function projectWorldToScreenPixels(wx, wy, wz) {
  _projectScratch.set(wx, wy, wz);
  _projectScratch.project(camera);  // -> NDC [-1, 1]
  const rect = renderer.domElement.getBoundingClientRect();
  return {
    x: (_projectScratch.x * 0.5 + 0.5) * rect.width,
    y: (1 - (_projectScratch.y * 0.5 + 0.5)) * rect.height
  };
}

function findHoveredPentagon(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const cx = clientX - rect.left;
  const cy = clientY - rect.top;
  let bestIdx = -1, bestD = Infinity;
  for (let i = 0; i < pentagons.length; i++) {
    const p = pentagons[i];
    if (p.target === 0 || p.activation <= 0.15) continue;
    const wp = vertexPos(p.u, p.v);
    if (!isInFrontOfCamera(wp[0], wp[1], wp[2])) continue;
    const sp = projectWorldToScreenPixels(wp[0], wp[1], wp[2]);
    const d = Math.hypot(sp.x - cx, sp.y - cy);
    if (d < bestD && d < PENTAGON_HIT_PX) { bestD = d; bestIdx = i; }
  }
  return bestIdx;
}

function handleClick(e) {
  // v15: every click spawns a tesseract burst at the click point.
  // Shift+click on a hovered pentagon TOGGLES persistent selection (green).
  // Normal click on hovered pentagon removes (v14.2 behavior).
  // Normal click on surface places (existing flow with preview rays).
  if (hoveredPentIdx >= 0) {
    const p = pentagons[hoveredPentIdx];
    const wp = vertexPos(p.u, p.v);
    spawnClickBurst(wp[0], wp[1], wp[2]);
    if (e.shiftKey) {
      // v15: persistent selection toggle, do NOT remove
      p.selected = !p.selected;
      updatePentagonMarkers();
      return;
    }
    p.target = 0;
    hoveredPentIdx = -1;
    renderer.domElement.style.cursor = 'default';
    return;
  }

  const rect = renderer.domElement.getBoundingClientRect();
  mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObject(mobiusMesh);
  if (hits.length === 0) return;
  const hp = hits[0].point;

  // v15: burst at click point on surface
  spawnClickBurst(hp.x, hp.y, hp.z);

  // Snap to nearest (u,v) on the lifted surface, route through preview rays
  const [u, v] = findUVFromHit(hp.x, hp.y, hp.z);
  startPathPreview(u, v);
}

// ===== Orbit camera =====
let yaw = 0.5, pitch = 0.35, dist = 8.2;
function updateCamera() {
  camera.position.x = dist * Math.cos(pitch) * Math.sin(yaw);
  camera.position.y = dist * Math.sin(pitch);
  camera.position.z = dist * Math.cos(pitch) * Math.cos(yaw);
  camera.lookAt(0, 0, 0);
}
updateCamera();

function updateHover(e) {
  // v14.2: screen-space pixel distance, consistent with click logic above.
  const newHover = findHoveredPentagon(e.clientX, e.clientY);
  if (newHover !== hoveredPentIdx) {
    hoveredPentIdx = newHover;
    renderer.domElement.style.cursor = (newHover >= 0) ? 'pointer' : 'default';
    updatePentagonMarkers();  // repaint colors
  }
}

let mouseDown = null, dragged = false;
renderer.domElement.addEventListener('mousedown', e => {
  mouseDown = { x: e.clientX, y: e.clientY };
  dragged = false;
  document.body.classList.add('dragging');
});
renderer.domElement.addEventListener('mousemove', e => {
  if (mouseDown) {
    const dx = e.clientX - mouseDown.x, dy = e.clientY - mouseDown.y;
    if (!dragged && Math.hypot(dx, dy) > 5) dragged = true;
    if (dragged) {
      yaw -= dx * 0.006;
      pitch += dy * 0.006;
      pitch = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, pitch));
      mouseDown = { x: e.clientX, y: e.clientY };
      updateCamera();
    }
  } else {
    updateHover(e);
  }
});
renderer.domElement.addEventListener('mouseup', e => {
  document.body.classList.remove('dragging');
  if (!dragged && mouseDown) handleClick(e);
  mouseDown = null; dragged = false;
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  // v14.1: scroll still works, but it also updates the zoom slider so the two
  // controls stay in sync. Wider range than before (2.5..80) since fog handles
  // the "things vanish into bg" failure mode gracefully now.
  dist = Math.max(2.5, Math.min(80, dist + e.deltaY * 0.01 * Math.max(1, dist * 0.15)));
  document.getElementById('zoom').value = Math.round(dist * 10);
  document.getElementById('zoomVal').textContent = dist.toFixed(1);
  updateCamera();
}, { passive: false });

// ===== UI =====
document.getElementById('place12').addEventListener('click', place12);
document.getElementById('clear').addEventListener('click', clearAll);
document.getElementById('resetView').addEventListener('click', () => {
  yaw = 0.5; pitch = 0.35; dist = 8.2; updateCamera();
});
document.getElementById('density').addEventListener('input', e => {
  const val = parseInt(e.target.value);
  U_STEPS = val;
  V_STEPS = Math.max(3, Math.round(val * 0.15));
  document.getElementById('densityVal').textContent = val;
  rebuildLattice();
  refreshAll();
});
document.getElementById('gravity').addEventListener('input', e => {
  const val = parseInt(e.target.value);
  // v14: 0..200 slider → 0..7.0 K. Slider=100 → K=3.5 (legacy "100%" behavior).
  // Slider=200 → K=7.0, which combined with raised GRAVITY_MAX_PULL=1.85 causes
  // the Möbius to fold symmetrically through its own origin.
  GRAVITY_K = (val / 100) * 3.5;
  document.getElementById('gravityVal').textContent = val;
  refreshAll();
});
document.getElementById('shimmer').addEventListener('input', e => {
  const val = parseInt(e.target.value);
  SHIMMER_K = (val / 100) * 0.18;
  document.getElementById('shimmerVal').textContent = val;
});
document.getElementById('solfeggio').addEventListener('input', e => {
  solfeggioIndex = parseInt(e.target.value);
  const s = SOLFEGGIO[solfeggioIndex];
  document.getElementById('solfeggioCode').textContent = s.code;
  document.getElementById('solfeggioHz').textContent = `${s.hz} Hz · ${s.name}`;
  document.getElementById('solfeggioMeaning').textContent = s.meaning;
});

// v14.1: zoom slider — slider value / 10 = camera dist. Synced with wheel.
document.getElementById('zoom').addEventListener('input', e => {
  const val = parseInt(e.target.value);
  dist = val / 10;
  document.getElementById('zoomVal').textContent = dist.toFixed(1);
  updateCamera();
});

// v14.1: HUD auto-hide. The top-left label fades out after a couple seconds of
// idle. Any control interaction (slider drag, button press, scroll-zoom) brings
// it back briefly so you can read the state, then it fades again. The strip
// stays the focus, the chrome only shows when needed.
const hudLabel = document.querySelector('.label');
let hudHideTimer = null;
const HUD_VISIBLE_MS = 2200;
function pingHUD() {
  hudLabel.classList.remove('hidden');
  clearTimeout(hudHideTimer);
  hudHideTimer = setTimeout(() => hudLabel.classList.add('hidden'), HUD_VISIBLE_MS);
}
// Trigger on every control + the canvas wheel/click (so click-to-place also reveals)
document.querySelectorAll('.controls input, .controls button').forEach(el => {
  el.addEventListener('input', pingHUD);
  el.addEventListener('mousedown', pingHUD);
  el.addEventListener('click', pingHUD);
});
renderer.domElement.addEventListener('wheel', pingHUD, { passive: true });
renderer.domElement.addEventListener('mousedown', pingHUD);
// Initial show, then fade
pingHUD();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ===== Initial state: place 12 on load =====
place12();
refreshAll();

// ===== Loop =====
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  let needsRefresh = tickLifts(dt);
  if (SHIMMER_K > 0) {
    shimmerTime += dt * 0.4;  // gentle flow
    needsRefresh = true;
  }
  // v15: if any pentagons are selected, refresh every frame so the selection
  // ring pulse animates smoothly. Cheap — just re-skinning existing geometry.
  if (!needsRefresh) {
    for (let i = 0; i < pentagons.length; i++) {
      if (pentagons[i].selected) { needsRefresh = true; break; }
    }
  }
  // v14: path preview runs per-frame while active, may itself trigger refresh
  if (updatePathPreview(now)) needsRefresh = true;
  if (needsRefresh) refreshAll();
  updateCenter(now, dt);
  updateClickBursts(now);  // v15: tesseract burst pool
  renderer.render(scene, camera);
}
animate();
</script>
</body>
