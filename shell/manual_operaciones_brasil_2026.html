const INT={transit:['tránsito','#1de5b0',25],rest:['descanso','#00ff88',15],low:['baja','#00ff88',32],med:['media','#00d4ff',58],high:['alta','#ffb454',82],max:['MÁXIMA','#ff5470',100]};
const TABS=[['agenda','Agenda'],['objetivos','Objetivos'],['alertas','Alertas'],['descanso','Descanso']];
let cur=0, tab='agenda';
const $=id=>document.getElementById(id);

function alClass(s){const c=s.trim()[0];return c==='⚠'?'warn':c==='✔'?'ok':'info';}
function renderPanel(){
  const d=STOPS[cur];let h='';
  if(tab==='agenda'){h=d.agenda.map(a=>'<div class="li"><span class="tm">'+a[0]+'</span>'+a[1]+'</div>').join('');}
  else if(tab==='objetivos'){h=d.targets.length?d.targets.map(t=>'<div class="li"><span class="onm">'+t[0]+'</span> — '+t[1]+'</div>').join(''):'<div class="empty">— sin objetivos arquitectónicos (día de tránsito / descanso)</div>';}
  else if(tab==='alertas'){h=d.alerts.map(a=>'<div class="al '+alClass(a)+'">'+a+'</div>').join('');}
  else{h=d.rest.map(r=>'<div class="rest"><div class="rnm">☾ '+r[0]+'</div><div class="rwhy">'+r[1]+'</div><div class="rmeta">'+(r[2]||'')+'</div></div>').join('');}
  $('pbody').innerHTML=h;
}
function renderTabs(){const d=STOPS[cur];$('tabs').innerHTML=TABS.map(t=>{
  let c={agenda:d.agenda.length,objetivos:d.targets.length,alertas:d.alerts.length,descanso:d.rest.length}[t[0]];
  return '<div class="tab'+(tab===t[0]?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'<span class="c">'+c+'</span></div>';}).join('');
  $('tabs').querySelectorAll('.tab').forEach(el=>el.onclick=()=>{tab=el.dataset.t;renderTabs();renderPanel();});}
function render(){
  const d=STOPS[cur];
  $('dnum').textContent=d.day;
  $('dttl').innerHTML=d.title+'<small>'+d.date+'</small>';
  $('s-phase').textContent=d.phase;$('s-base').textContent=d.base;$('s-mob').textContent=d.mob;
  const it=INT[d.intensity];$('ibar').style.width=it[2]+'%';$('ibar').style.background=it[1];$('ival').textContent=it[0];$('ival').style.color=it[1];
  $('sl').value=cur;
  const pct=(cur+1)/STOPS.length*100;document.querySelector('#pbar>div').style.width=pct+'%';$('pnum').textContent=(cur+1)+' / '+STOPS.length;
  // phase buttons
  const phases=[];STOPS.forEach((s,i)=>{const key=s.phase.split('·')[0].trim();if(!phases.find(p=>p.key===key))phases.push({key,i,label:s.phase});});
  $('phbtns').innerHTML=phases.map(p=>'<div class="ph'+(STOPS[cur].phase.split('·')[0].trim()===p.key?' on':'')+'" data-i="'+p.i+'">'+p.label+'</div>').join('');
  $('phbtns').querySelectorAll('.ph').forEach(el=>el.onclick=()=>{cur=+el.dataset.i;render();});
  renderTabs();renderPanel();
}
$('sl').addEventListener('input',e=>{cur=+e.target.value;render();});
$('prev').onclick=()=>{cur=Math.max(0,cur-1);render();};
$('next').onclick=()=>{cur=Math.min(STOPS.length-1,cur+1);render();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){cur=Math.max(0,cur-1);render();}if(e.key==='ArrowRight'){cur=Math.min(STOPS.length-1,cur+1);render();}});

render();
