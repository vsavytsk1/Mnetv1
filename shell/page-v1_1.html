<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOBLINS v1.1 — packed, projected, trapped</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050508;--bg2:#0a0a12;--gold:#ffd700;--cyan:#00d4ff;--pink:#ff69b4;--green:#00ffd5;
 --purple:#cc44ff;--red:#ff5470;--dim:#6a6a82;--txt:#e8e0d0;--rule:#20202e;--rule2:#2a2a3a;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--serif:'EB Garamond',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--mono)}
/* width/height:100% is NOT redundant with inset:0. A <canvas> is a REPLACED
   element: with no CSS size, inset:0 resolves to the INTRINSIC bitmap size --
   300x150 -- and getBoundingClientRect() then reports 300x150 inside a 1500x900
   viewport, and every circle scales to a dot you cannot see. This is smithium
   v1.0's bug, exactly, which I verified against the frozen v1.0 an hour ago and
   wrote into a law. I then reintroduced it from scratch in a new file, because
   knowing a rule and having a habit are different organs. The law does not
   protect you. The MEASUREMENT protects you: "canvas region ink: 0.00%" is what
   caught it, not my memory of my own K-list. */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.top{position:fixed;top:0;left:0;right:0;z-index:10;background:linear-gradient(#0a0a12ee,#0a0a1200);
 padding:8px 12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ttl{font-size:11px;color:var(--gold);letter-spacing:.08em;flex:0 0 auto}
.ttl i{font-style:normal;color:var(--dim)}
.dm{background:var(--red);color:#050508;font-size:9px;font-weight:bold;padding:2px 7px;border-radius:9px;letter-spacing:.1em}
.cell{flex:0 0 auto;padding-right:14px;border-right:1px solid var(--rule);margin-right:4px}
.cell:last-child{border:none}
.cell .l{font-size:7.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.cell .v{font-size:14px;font-weight:bold;color:var(--cyan);line-height:1.2}
.cell .v.go{color:var(--gold)} .cell .v.gr{color:var(--green)} .cell .v.n{color:var(--red)}
.cell .v small{font-size:9px;color:var(--dim);font-weight:normal}
.btn{background:transparent;border:1px solid var(--rule2);border-radius:13px;color:var(--dim);
 font:9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:0 11px;height:28px;cursor:pointer}
.btn.on{color:var(--purple);border-color:#5a2a72;background:#160a1e}
.side{position:fixed;right:0;top:64px;bottom:0;width:330px;z-index:9;overflow-y:auto;
 background:linear-gradient(90deg,#0a0a1200,#0a0a12dd 22px);padding:8px 12px 40px 22px;font-size:10px}
.side.hide{display:none}
h5{font-size:8px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin:12px 0 5px;
 border-bottom:1px solid var(--rule);padding-bottom:3px}
h5:first-child{margin-top:0}
.li{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;border-bottom:1px solid #14141f;color:var(--dim)}
.li b{color:var(--gold);font-weight:bold} .li b.gr{color:var(--green)} .li b.n{color:var(--red)} .li b.cy{color:var(--cyan)}
.gl{display:flex;gap:7px;align-items:baseline;padding:3px 0;border-bottom:1px solid #14141f}
.gl .c{flex:0 0 auto;background:#1d1a0a;border:1px solid #4a3f0a;color:var(--gold);border-radius:8px;
 padding:0 5px;font-size:9px;font-weight:bold}
.gl .n{flex:1 1 auto;min-width:0;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.gl .t{flex:0 0 auto;color:var(--green);font-size:9px}
.note{font-family:var(--serif);font-size:13px;line-height:1.4;color:#7a7a92;margin-top:6px}
.note b{color:var(--gold);font-weight:400} .note i{color:var(--cyan);font-style:normal}
.err{background:#2a0a12;border:1px solid var(--red);color:var(--red);padding:7px;border-radius:5px;
 font-size:9px;line-height:1.4;margin-bottom:8px;word-break:break-word}
#tip{position:fixed;pointer-events:none;z-index:20;background:#0a0a12f2;border:1px solid var(--rule2);
 border-radius:6px;padding:6px 9px;font-size:10px;line-height:1.5;display:none;max-width:300px}
#tip b{color:var(--gold)} #tip .s{color:var(--purple)} #tip .d{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:820px){.side{display:none}}
</style></head><body>
<canvas id="cv"></canvas>
<div class="top">
  <div class="ttl">GOBLINS <i>v1.1 · packed · projected · trapped</i></div>
  <span class="dm" id="dm" style="display:none">SYNTHETIC</span>
  <div class="cell"><div class="l">processes</div><div class="v" id="v-n">—</div></div>
  <div class="cell"><div class="l">Σ working set <small>(the lie)</small></div><div class="v n" id="v-sum">—</div></div>
  <div class="cell"><div class="l">RAM actually in use</div><div class="v gr" id="v-use">—</div></div>
  <div class="cell"><div class="l">counted twice</div><div class="v go" id="v-gap">—</div></div>
  <div class="cell"><div class="l">respawns seen</div><div class="v go" id="v-gob">0</div></div>
  <button class="btn" id="b-flat">flat</button>
  <button class="btn" id="b-sph">sphere</button>
  <button class="btn" id="b-spin">spin</button>
  <button class="btn on" id="b-side">receipts</button>
</div>
<div class="side" id="side"><div id="body"></div></div>
<div id="tip"></div>
<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d",{alpha:false});
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W=0,H=0,DPR=1,S=null,rot=0,spin=false,hover=null,mx=-1,my=-1,SPH=false,tilt=0.42;
let flash=new Map();   // pid -> {t, kind}
const CY=[0,212,255],GO=[255,215,0],PU=[204,68,255],GR=[0,255,213],RD=[255,84,112],PK=[255,105,180];
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);
 W=r.width;H=r.height;cv.style.width=W+"px";cv.style.height=H+"px";
 const bw=Math.round(W*DPR),bh=Math.round(H*DPR);cv.width=bw;cv.height=bh;ctx.setTransform(bw/W,0,0,bh/H,0,0);}
new ResizeObserver(resize).observe(document.body);resize();
const K=n=>n>=1<<30?(n/(1<<30)).toFixed(1)+" GB":n>=1<<20?(n/(1<<20)).toFixed(0)+" MB":(n/1024|0)+" K";
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

new EventSource("/s").onmessage=e=>{
  const s=JSON.parse(e.data);
  if(S) for(const n of s.nodes){ if(n.g) flash.set(n.p,{t:performance.now(),k:"g"});
                                 else if(n.b) flash.set(n.p,{t:performance.now(),k:"b"}); }
  S=s; paint();
};
function paint(){
  if(!S)return;
  document.getElementById("dm").style.display=S.demo?"":"none";
  document.getElementById("v-n").textContent=S.n;
  document.getElementById("v-sum").textContent=K(S.sumWS);
  document.getElementById("v-use").textContent=K(S.inUse);
  const gap=S.sumWS-S.inUse;
  document.getElementById("v-gap").innerHTML=K(Math.abs(gap))+" <small>"+(S.inUse?(S.sumWS/S.inUse).toFixed(2)+"×</small>":"</small>");
  const tot=S.ledger.reduce((a,b)=>a+b.c,0);
  document.getElementById("v-gob").textContent=tot;
  const ok=S.maxOverlap<0.01&&S.maxEscape<0.01;
  document.getElementById("body").innerHTML=
   (S.err?'<div class="err"><b>the poll failed, so nothing below is current:</b><br>'+S.err+'</div>':'')+
   '<h5>G1 · is the picture true?</h5>'+
   li("max sibling overlap",S.maxOverlap.toFixed(4)+" px",ok?"gr":"n")+
   li("max escape from parent",S.maxEscape.toFixed(4)+" px",ok?"gr":"n")+
   '<div class="note">'+(ok?'the packing is <i>checked</i>, not admired. every frame, every parent.'
     :'<b>the packing is WRONG.</b> circles overlap. this picture is lying to you and that is why the number is here.')+'</div>'+
   '<h5>G5 · what the watching costs</h5>'+
   li("poll (measured)",S.pollMs+" ms","cy")+li("every",POLLTXT,"cy")+
   '<div class="note">Taskmgr.exe sat at <b>7% CPU</b> while the machine it watched was <b>95% idle</b>. a monitor that hides its own price is the joke told twice.</div>'+
   '<h5>the RAM receipt</h5>'+
   li("Σ working set, all "+S.n+" procs",K(S.sumWS),"n")+
   li("RAM actually in use",K(S.inUse),"gr")+
   li("installed",K(S.totalRAM),"cy")+
   li("the sum overcounts by",(S.inUse?(S.sumWS/S.inUse).toFixed(2):"—")+"×","go")+
   '<div class="note">not a leak. working set counts <b>shared</b> pages once <i>per process</i> — so ntdll.dll is charged to all '+S.n+' of them. your own Task Manager proves it: <b>private + shared = working set</b>, exactly, every row.</div>'+
   '<h5>the goblin ledger · G3</h5>'+
   (S.ledger.length?S.ledger.map(L=>'<div class="gl"><span class="c">'+L.c+'×</span>'+
      '<span class="n">'+esc(L.n)+' <span style="color:#4a4a5e">← ppid '+L.pp+'</span></span>'+
      '<span class="t">'+(L.m/1000).toFixed(2)+'s</span></div>').join("")
    :'<div class="note">nothing has come back yet. go kill a <b>svchost.exe</b> and watch this fill.</div>')+
   '<div class="note"><b>inferred, not proven.</b> "same name + same parent reappeared within 15s of one dying." it cannot see <i>why</i>. it will false-positive on parents that spawn workers constantly — conhost, RuntimeBroker. that is the honest limit of a differ.</div>'+
   '<div class="note">but the number is real: that is <i>how long the SCM took</i> to notice and restart it, per that service\'s configured recovery action. run <b>sc qfailure &lt;name&gt;</b> and you will find the latency written down. the goblin has an address.</div>'+
   polyHTML()+distHTML()+
   '<h5>G2 · what this cannot see</h5>'+
   '<div class="note">ws here is <b>total</b> working set. Task Manager\'s <i>private working set</i> column is a perf counter, not a Win32_Process field — so it is not shown rather than faked.</div>';
}
const POLLTXT="1000 ms";
function polyHTML(){
  const P=S.poly; if(!P) return "";
  if(P.err) return '<h5>the trap · G7</h5><div class="err">hull failed: '+esc(P.err)+'</div>';
  const ok=P.chi===2, tri=P.tri, twelve=P.twelve===12;
  return '<h5>the trap · G7 · Σ(6−deg)=12</h5>'+
   '<div class="note"><b>the tree refuses.</b> Steinitz: a graph is a convex polyhedron\u2019s edge graph <i>iff</i> planar <b>and 3-connected</b>. a process tree is 1-connected \u2014 every edge is a bridge. K5 again: the obstruction is <b>combinatorial</b>, and no lerping of vertices adds connectivity. (it does satisfy Euler, \u03c7=2, trivially. Euler is necessary and nowhere near sufficient.)</div>'+
   '<div class="note">so the <b>packing</b> is projected to a sphere instead, and the <i>convex hull</i> of those points is a real polyhedron \u2014 points on a sphere are in convex position, the hull is a triangulation of S\u00b2: planar, 3-connected, Steinitz satisfied.</div>'+
   li("V · circles on the sphere",P.V,"cy")+li("E · hull edges",P.E,"cy")+li("F · triangles",P.F,"cy")+
   li("χ = V − E + F",P.chi+(ok?" ✓":" ✗"),ok?"gr":"n")+
   li("E vs 3V−6",P.E+" vs "+P.pred+(tri?" ✓":" ✗"),tri?"gr":"n")+
   li("Σ(6−deg) over vertices",P.twelve+(twelve?" ✓":" ✗"),twelve?"gr":"n")+
   li("hull build (measured)",P.ms+" ms","cy")+
   '<div class="note"><b>that 12 is GENESIS\u2019s P=12.</b> the dual of a sphere triangulation is 3-valent; its faces are these vertices, with k=deg. Euler gives Σ(6−k)f<sub>k</sub> = 6F−2E = <b>12</b>, one line. genesis tracks 12 <i>pentagons</i> on a fullerene \u2014 that is the special case where every face is a 5- or 6-gon, so 1·(#pent)+0·(#hex)=12. <b>you cannot build one with eleven.</b></div>'+
   '<div class="note">open Chrome. kill a svchost. the shape churns every second. <b>it is still 12.</b> the shape is yours; the number is not negotiable.</div>'+
   '<div class="note"><b>G7:</b> this polyhedron is built from the <i>packing</i>, not the tree. different object. said, not blurred.</div>';
}
function distHTML(){
  const D=S.dist; if(!D) return '<h5>G6 · is it a power law?</h5><div class="note">first fit pending\u2026 (the bootstrap is slow, so it runs every 20 polls)</div>';
  const one=(a)=>{
    if(!a||!a.ok) return '<div class="note">'+esc(a?a.verdict:"—")+'</div>';
    const bad=a.ruled;
    return '<div class="li"><span>'+esc(a.label)+'</span><b class="cy">n='+a.n+'</b></div>'+
      li("&nbsp;&nbsp;α̂ (MLE, no bins)",a.alpha.toFixed(3),"go")+
      li("&nbsp;&nbsp;x<sub>min</sub> (by KS)",(a.xmin>1e5?(a.xmin/2**20).toFixed(1)+" MB":a.xmin.toFixed(1)),"cy")+
      li("&nbsp;&nbsp;tail used",a.nTail+" of "+a.n,"cy")+
      li("&nbsp;&nbsp;KS distance",a.D.toFixed(4),"cy")+
      li("&nbsp;&nbsp;p (bootstrap ×"+a.reps+")",a.p.toFixed(3)+(a.p<0.1?" ✗":""),a.p<0.1?"n":"gr")+
      li("&nbsp;&nbsp;vs log-normal (Vuong)",a.vuong.winner,a.vuong.winner==="log-normal"?"n":"gr")+
      '<div class="note" style="color:'+(bad?"#ff5470":"#00ffd5")+'">'+esc(a.verdict)+'</div>';
  };
  return '<h5>G6 · is it a power law? (usually: no)</h5>'+
    '<div class="note">the log-log ruler \u2014 histogram, log-log, fit a line, read the slope \u2014 reports a power law with <b>R²=0.96</b> on data generated from a <b>log-normal</b>. it is not a weak test, it is a broken one, and it is how most published power laws were found.</div>'+
    one(D.ws)+one(D.deg)+
    '<div class="note"><b>read p backwards.</b> it is a <i>rejection</i> probability. small p kills the model. big p only means <b>not ruled out</b> \u2014 never "confirmed". and D<sub>f</sub>=2−α is a dimension for a self-similar <b>set</b>; a list of memory sizes is not a set in a space, so it is <b>not reported here</b>. the gasket\u2019s 1.3057 is a real dimension. this would not be.</div>'+
    '<div class="note" style="color:#585870">taken '+((Date.now()-D.at)/1000|0)+'s ago · refits every 20 polls</div>';
}
const esc=s=>String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const li=(k,v,c)=>'<div class="li"><span>'+k+'</span><b class="'+(c||"")+'">'+v+'</b></div>';

function col(n){
  if(n.n==="svchost.exe") return n.s?PU:[120,90,160];
  if(n.ss>0) return GO;                       // your session
  if(/^(System|Secure System|Registry|smss|csrss|wininit|services)/.test(n.n)) return CY;
  return [90,110,150];
}
// ===================================================================
// THE SPHERE.  K1, verbatim, in a new file: NO CIRCLE IS HARDCODED.
// Stereographic projection sends circles to circles -- but it does NOT send
// centres to centres. So "project the centre, draw a circle of radius f(r)"
// is WRONG, and it is the obvious thing to write. Instead every circle on
// the sphere is its plane circle, SAMPLED at RIM points and each one pushed
// through the map. Exactly how smithium draws the Smith chart. The circle
// is a consequence, never an assertion.
// And the rotation is not decoration: SO(3) sits inside the Mobius group as
// the sphere-preserving maps, so SPINNING THIS IS A MOBIUS TRANSFORMATION
// OF THE PLANE. You are watching smithium's map from the outside.
const RIM=22;
function rot3(p,a,b){
  const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);
  const x=p[0]*ca-p[1]*sa, y=p[0]*sa+p[1]*ca, z=p[2];
  return [x, y*cb-z*sb, y*sb+z*cb];
}
function drawSphere(){
  const R=Math.min(W,H-90)*0.42, ox=W/2-(document.getElementById("side").classList.contains("hide")?0:150), oy=H/2+34;
  // the cage
  ctx.strokeStyle="rgba(106,106,130,0.22)";ctx.lineWidth=0.7;
  for(let k=-2;k<=2;k++){ const la=k*Math.PI/6; ctx.beginPath();
    for(let i=0;i<=64;i++){ const lo=i/64*2*Math.PI;
      const p=rot3([Math.cos(la)*Math.cos(lo),Math.cos(la)*Math.sin(lo),Math.sin(la)],rot,tilt);
      const X=ox+p[0]*R,Y=oy-p[2]*R; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);} ctx.stroke(); }
  ctx.strokeStyle="rgba(106,106,130,0.30)";ctx.beginPath();ctx.arc(ox,oy,R,0,6.2832);ctx.stroke();
  // the polyhedron: the hull edges, on the sphere
  if(S.poly&&S.poly.faces&&document.getElementById("b-sph").classList.contains("on")){
    const seen=new Set(); ctx.strokeStyle="rgba(0,255,213,0.20)";ctx.lineWidth=0.6;ctx.beginPath();
    for(const f of S.poly.faces) for(let k=0;k<3;k++){
      const a=f[k],b=f[(k+1)%3],key=a<b?a+","+b:b+","+a; if(seen.has(key))continue; seen.add(key);
      const pa=rot3(S.sphere[a],rot,tilt), pb=rot3(S.sphere[b],rot,tilt);
      if(pa[1]<-0.15&&pb[1]<-0.15) continue;                       // cull the far side
      ctx.moveTo(ox+pa[0]*R,oy-pa[2]*R); ctx.lineTo(ox+pb[0]*R,oy-pb[2]*R);}
    ctx.stroke();
  }
  // every process circle: SAMPLED in the plane, MAPPED to the sphere.
  const list=S.nodes.map((n,i)=>({n,i,z:rot3(S.sphere[i],rot,tilt)[1]})).sort((a,b)=>a.z-b.z);
  for(const {n,i,z} of list){
    const c=col(n), depth=(z+1)/2, a=(n.r>6?0.55:0.32)*(0.18+0.82*depth);
    const cx=n.x/S.R, cy=n.y/S.R, rr=n.r/S.R;
    ctx.beginPath(); let on=false;
    for(let k=0;k<=RIM;k++){
      const th=k/RIM*2*Math.PI;
      const p=rot3(stereo(cx+rr*Math.cos(th), cy+rr*Math.sin(th)),rot,tilt);
      const X=ox+p[0]*R, Y=oy-p[2]*R;
      on?ctx.lineTo(X,Y):(ctx.moveTo(X,Y),on=true);
    }
    ctx.closePath();
    ctx.strokeStyle=rgba(c,a); ctx.lineWidth=Math.max(0.4,1.1*depth); ctx.stroke();
    if(rr*R>4){ctx.fillStyle=rgba(c,0.05*depth);ctx.fill();}
    const f=flash.get(n.p);
    if(f){const age=(performance.now()-f.t)/900;
      if(age>1) flash.delete(n.p); else {const kk=1-age;
        const p=rot3(stereo(cx,cy),rot,tilt);
        ctx.beginPath();ctx.arc(ox+p[0]*R,oy-p[2]*R,rr*R+kk*9,0,6.2832);
        ctx.strokeStyle=rgba(f.k==="g"?GO:GR,kk*0.9);ctx.lineWidth=1+kk*2;ctx.stroke();}}
  }
}
function stereo(X,Y){const d=X*X+Y*Y+1;return [2*X/d,2*Y/d,(X*X+Y*Y-1)/d];}

function draw(t){
  requestAnimationFrame(draw);
  ctx.fillStyle="#050508";ctx.fillRect(0,0,W,H);
  if(!S){ctx.fillStyle="#6a6a82";ctx.font="12px ui-monospace";ctx.textAlign="center";
    ctx.fillText("waiting for the first poll…",W/2,H/2);return;}
  if(spin&&!RM) rot+=0.0013;
  if(SPH){ drawSphere(); tipOff(); return; }
  const s=Math.min(W,H-90)*0.46/S.R, ox=W/2-(document.getElementById("side").classList.contains("hide")?0:150), oy=H/2+34;
  const cs=Math.cos(rot),sn=Math.sin(rot);
  hover=null;
  ctx.lineCap="round";
  for(const n of S.nodes){
    const X=ox+(n.x*cs-n.y*sn)*s, Y=oy+(n.x*sn+n.y*cs)*s, R=n.r*s;
    if(X+R<0||X-R>W||Y+R<0||Y-R>H||R<0.35) continue;
    const c=col(n); let a=n.r>6?0.5:0.30, lw=Math.max(0.4,Math.min(1.5,R*0.05));
    const f=flash.get(n.p);
    if(f){const age=(performance.now()-f.t)/900;
      if(age>1) flash.delete(n.p);
      else {const k=1-age;
        ctx.beginPath();ctx.arc(X,Y,R+k*9,0,6.2832);
        ctx.strokeStyle=rgba(f.k==="g"?GO:GR,k*0.9);ctx.lineWidth=1+k*2;ctx.stroke();
        a=Math.min(1,a+k*0.7);}}
    ctx.beginPath();ctx.arc(X,Y,R,0,6.2832);
    ctx.strokeStyle=rgba(c,a);ctx.lineWidth=lw;ctx.stroke();
    if(R>3){ctx.fillStyle=rgba(c,0.055);ctx.fill();}
    if(mx>=0&&Math.hypot(mx-X,my-Y)<R&&(!hover||R<hover.R)) hover={n,X,Y,R};
    if(R>26){ctx.fillStyle=rgba(c,0.85);ctx.font=Math.min(13,R*0.3)+"px ui-monospace";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(n.n.replace(/\.exe$/,""),X,Y-R*0.62);}
  }
  // the dead, still warm
  for(const d of (S.dead||[])){ }
  if(hover){
    const T=document.getElementById("tip"),n=hover.n;
    T.style.display="block";T.style.left=Math.min(W-310,hover.X+14)+"px";T.style.top=(hover.Y+14)+"px";
    T.innerHTML="<b>"+esc(n.n)+"</b>  <span class='d'>pid "+n.p+"</span><br>"+
      (n.s?"<span class='s'>service: "+esc(n.s)+"</span><br>":"")+
      "<span class='d'>ws</span> "+K(n.w)+"  <span class='d'>threads</span> "+n.th+
      "  <span class='d'>session</span> "+n.ss;
    ctx.beginPath();ctx.arc(hover.X,hover.Y,hover.R+3,0,6.2832);
    ctx.strokeStyle="#fff";ctx.lineWidth=1.2;ctx.stroke();
  } else tipOff();
}
function tipOff(){document.getElementById("tip").style.display="none";}
cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
cv.addEventListener("pointerleave",()=>{mx=my=-1;});
document.getElementById("b-spin").onclick=function(){spin=!spin;this.classList.toggle("on",spin);};
document.getElementById("b-flat").classList.add("on");
document.getElementById("b-flat").onclick=function(){SPH=false;this.classList.add("on");
  document.getElementById("b-sph").classList.remove("on");};
document.getElementById("b-sph").onclick=function(){SPH=true;this.classList.add("on");
  document.getElementById("b-flat").classList.remove("on");};
cv.addEventListener("wheel",e=>{if(SPH){tilt=Math.max(-1.4,Math.min(1.4,tilt+e.deltaY*0.0015));e.preventDefault();}},{passive:false});
document.getElementById("b-side").onclick=function(){
  document.getElementById("side").classList.toggle("hide");
  this.classList.toggle("on",!document.getElementById("side").classList.contains("hide"));};
requestAnimationFrame(draw);
