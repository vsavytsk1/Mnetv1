<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="data/es_words.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#05080a;color:#e0e0e0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;overflow:hidden}
  @keyframes tgr{0%,100%{transform:scale(1.35);box-shadow:0 0 22px 4px rgba(255,90,30,.85)}50%{transform:scale(1.7);box-shadow:0 0 40px 10px rgba(255,60,20,.95)}}
  #vf-plane{position:absolute;transform-origin:0 0;will-change:transform}
  .wnode{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;
    color:#bfe9c8;background:rgba(10,18,14,.55);border:1px solid rgba(70,150,90,.10);border-radius:4px;
    font-family:'Spectral',serif;font-weight:600;cursor:pointer;overflow:hidden;line-height:1.05;user-select:none}
  body.live .wnode{transition:color .15s,background .15s,border-color .15s,transform .12s}
  body.live .wnode:hover{color:#fff;background:rgba(30,60,40,.85);border-color:rgba(120,220,150,.5);z-index:5}
  .wnode.flip{color:#ffd700;background:rgba(40,34,10,.9);border-color:rgba(255,215,0,.5)}
  .wnode.lit{color:#0a0a0a!important;background:#ffd700!important;border-color:#fff!important;z-index:6}
  .wnode.tiger{color:#fff!important;background:linear-gradient(135deg,#ff6a2a,#c81e0a)!important;border-color:#fff!important;
    z-index:30;animation:tgr .55s ease-in-out infinite;font-weight:600}
  #vf-bite{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 55%,transparent 40%,rgba(200,20,10,.55) 100%);opacity:0;transition:opacity .5s;z-index:40}
  .vfbtn{background:#0a120e;border:1px solid #1d3326;color:#7d9a87;border-radius:4px;padding:5px 11px;font-family:'IBM Plex Mono',monospace;font-size:9px;cursor:pointer;text-transform:uppercase;letter-spacing:.09em;white-space:nowrap;transition:all .15s}
  .vfbtn:hover{color:#eafff0;border-color:#3f6a4e}
  .vfbtn.on{color:#ff7a4a;border-color:rgba(255,120,70,.55);background:rgba(255,90,40,.08)}
  input[type=range]{-webkit-appearance:none;height:4px;border-radius:3px;background:linear-gradient(90deg,#2c6a40,#ff6a2a);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#ffd700;border:2px solid #05080a;cursor:pointer;box-shadow:0 0 8px rgba(255,215,0,.6)}
</style>
</helmet>
<div style="height:100vh;display:flex;flex-direction:column">

  <!-- HEADER / CONTROLS -->
  <div style="flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid #112018;background:rgba(3,6,4,.92);flex-wrap:wrap">
    <div style="display:flex;align-items:baseline;gap:8px">
      <span style="font:600 15px/1 'Spectral',serif;color:#cfe9d6">🐅 La Selva</span>
      <span style="font:500 8px/1 'IBM Plex Mono',monospace;color:#4f6b59;letter-spacing:.16em;text-transform:uppercase">vladTree · ES saturation</span>
    </div>
    <div style="width:1px;height:22px;background:#173124"></div>

    <!-- SATURATION SLIDER -->
    <div style="display:flex;align-items:center;gap:9px">
      <span style="font:500 8px/1 'IBM Plex Mono',monospace;color:#5a7866;letter-spacing:.14em;text-transform:uppercase">saturation</span>
      <input id="vf-sat" type="range" min="40" max="4000" step="20" value="600" style="width:200px">
      <span id="vf-satval" style="font:600 12px/1 'Spectral',serif;color:#ffd700;min-width:46px">600</span>
    </div>

    <button class="vfbtn" id="vf-hunt" onClick="{{ onHunt }}">🐅 hunt: off</button>
    <button class="vfbtn" id="vf-reveal" onClick="{{ onRevealAll }}">reveal EN</button>

    <div style="flex:1 1 120px"></div>

    <div style="display:flex;align-items:center;gap:7px">
      <input id="vf-input" type="text" placeholder="type es / en — flush the bush" style="width:190px;background:#0a120e;border:1px solid #1d3326;border-radius:4px;padding:6px 10px;font-family:'Spectral',serif;font-size:13px;color:#eafff0;outline:none">
      <button class="vfbtn" onClick="{{ onMatch }}">find</button>
      <button class="vfbtn" onClick="{{ onClear }}">clear</button>
    </div>
    <span id="vf-fps" style="font:500 8px/1 'IBM Plex Mono',monospace;color:#3f5a48;letter-spacing:.1em;min-width:74px;text-align:right">— fps</span>
  </div>

  <!-- FOREST -->
  <div id="vf-grid" style="flex:1 1 auto;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0a140d 0%,#05080a 70%)">
    <div id="vf-plane"></div>
    <div id="vf-bite"></div>
    <!-- HUNT HUD -->
    <div id="vf-hud" style="display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(5,8,6,.82);border:1px solid rgba(255,120,70,.3);border-radius:8px;padding:7px 16px;display:none;gap:18px;align-items:center;backdrop-filter:blur(4px)">
      <div style="display:flex;flex-direction:column;align-items:center"><span id="vf-caught" style="font:600 17px/1 'Spectral',serif;color:#7fff7f">0</span><span style="font:500 7px/1 'IBM Plex Mono',monospace;color:#4f6b59;letter-spacing:.12em;text-transform:uppercase">caught</span></div>
      <div style="display:flex;flex-direction:column;align-items:center"><span id="vf-bitten" style="font:600 17px/1 'Spectral',serif;color:#ff7a6b">0</span><span style="font:500 7px/1 'IBM Plex Mono',monospace;color:#4f6b59;letter-spacing:.12em;text-transform:uppercase">bitten</span></div>
      <div style="display:flex;flex-direction:column;align-items:center"><span id="vf-streak" style="font:600 17px/1 'Spectral',serif;color:#ffd700">0</span><span style="font:500 7px/1 'IBM Plex Mono',monospace;color:#4f6b59;letter-spacing:.12em;text-transform:uppercase">streak</span></div>
    </div>
    <div id="vf-hint" style="position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:500 8px/1.5 'IBM Plex Mono',monospace;color:#28392f;letter-spacing:.12em;text-transform:uppercase;text-align:center;pointer-events:none">drag to pan · scroll to zoom · click a word to flip it · dial saturation till the bush is alive</div>
  </div>

  <!-- STATUS -->
  <div style="flex:0 0 auto;background:rgba(3,6,4,.98);border-top:1px solid #112018;padding:7px 16px">
    <span id="vf-status" style="font:500 8px/1.4 'IBM Plex Mono',monospace;color:#3f5a48;letter-spacing:.09em;text-transform:uppercase">the monkey learns when it believes there's a tiger in the bush — turn on the hunt, dial the saturation, drown in español</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 800 }
}">
class Component extends DCLogic {
  componentDidMount(){
    if(!window.ES_WORDS || !window.ES_WORDS.length){ // data script not ready yet — poll
      this._waits=(this._waits||0)+1;
      if(this._waits<60){ setTimeout(()=>this.componentDidMount(), 50); return; }
    }
    this.WORDS = (window.ES_WORDS||[{es:"español",en:"loading…"}]).slice();
    this.UNIQ = this.WORDS.length;
    this.pan={x:0,y:0,z:1}; this.drag=false; this.lm={x:0,y:0};
    this.nodeEls=[]; this.POS=[];
    this.hunting=false; this.revealAll=false;
    this.caught=0; this.bitten=0; this.streak=0;
    this.tigerEl=null; this.tigerTimer=null; this.spawnTimer=null;

    const saved = parseInt(localStorage.getItem('vt_es_sat')||'600',10);
    this.count = isNaN(saved)?600:Math.max(40,Math.min(4000,saved));
    const sat=document.getElementById('vf-sat'); sat.value=this.count;
    document.getElementById('vf-satval').textContent=this.count;

    document.body.classList.add('live');
    this._build();
    this._wire();
    this._fpsLoop();

    sat.addEventListener('input', e=>{ document.getElementById('vf-satval').textContent=e.target.value; });
    sat.addEventListener('change', e=>{ this.count=parseInt(e.target.value,10); localStorage.setItem('vt_es_sat',this.count); this._build(); });
    const inp=document.getElementById('vf-input'); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') this.match(); });
  }

  // size presets: denser cells as the forest saturates
  _sizeFor(C){
    if(C<=100) return {w:96,h:46,f:15};
    if(C<=300) return {w:78,h:40,f:13};
    if(C<=700) return {w:60,h:32,f:11};
    if(C<=1400) return {w:46,h:26,f:9.5};
    if(C<=2500) return {w:36,h:21,f:8};
    return {w:29,h:17,f:7};
  }

  _build(){
    const plane=document.getElementById('vf-plane');
    this._stopHunt(true);
    plane.innerHTML=''; this.nodeEls=[]; this.POS=[];
    const C=this.count;
    document.body.classList.toggle('live', C<=700); // drop transitions when dense
    const sz=this._sizeFor(C);
    const cols=Math.max(1,Math.round(Math.sqrt(C*1.9)));
    const gap=Math.max(2, Math.round(sz.w*0.06));
    for(let i=0;i<C;i++){
      const wd=this.WORDS[i % this.UNIQ];
      const col=i%cols, row=Math.floor(i/cols);
      const x=col*(sz.w+gap), y=row*(sz.h+gap);
      const d=document.createElement('div');
      d.className='wnode';
      d.style.cssText='left:'+x+'px;top:'+y+'px;width:'+sz.w+'px;height:'+sz.h+'px;font-size:'+sz.f+'px;padding:0 2px';
      d.textContent=wd.es; d.dataset.es=wd.es; d.dataset.en=wd.en;
      d.onclick=(ev)=>this._clickNode(d,ev);
      plane.appendChild(d); this.nodeEls.push(d);
      this.POS.push({x,y,w:sz.w,h:sz.h});
    }
    this.planeW=cols*(sz.w+gap); this.planeH=Math.ceil(C/cols)*(sz.h+gap);
    // center & fit so the whole wall is visible (the saturation hit)
    const g=document.getElementById('vf-grid').getBoundingClientRect();
    this.pan.z=Math.min(1.2, Math.max(0.18, Math.min(g.width/this.planeW, g.height/this.planeH)*0.98));
    this.pan.x=(g.width-this.planeW*this.pan.z)/2;
    this.pan.y=(g.height-this.planeH*this.pan.z)/2;
    this._applyT();
    if(this.revealAll) this._setRevealAll(true);
    this._status(C+' words in the bush · '+this.UNIQ+' unique · '+(C>this.UNIQ?('×'+(C/this.UNIQ).toFixed(1)+' immersion repeats'):'')+' — drag, zoom, drown');
  }

  _applyT(){ document.getElementById('vf-plane').style.transform='translate('+this.pan.x+'px,'+this.pan.y+'px) scale('+this.pan.z+')'; }

  _wire(){
    const grid=document.getElementById('vf-grid');
    grid.addEventListener('pointerdown',e=>{ if(e.target.classList.contains('wnode'))return; this.drag=true; this.lm={x:e.clientX,y:e.clientY}; });
    document.addEventListener('pointermove',e=>{ if(!this.drag)return; this.pan.x+=(e.clientX-this.lm.x); this.pan.y+=(e.clientY-this.lm.y); this.lm={x:e.clientX,y:e.clientY}; this._applyT(); });
    document.addEventListener('pointerup',()=>{ this.drag=false; });
    grid.addEventListener('wheel',e=>{ e.preventDefault(); const oz=this.pan.z; this.pan.z=Math.max(.1,Math.min(3,this.pan.z*(e.deltaY>0?.9:1.11)));
      const r=grid.getBoundingClientRect(); const cx=e.clientX-r.left, cy=e.clientY-r.top;
      this.pan.x=cx-(cx-this.pan.x)*(this.pan.z/oz); this.pan.y=cy-(cy-this.pan.y)*(this.pan.z/oz); this._applyT(); },{passive:false});
  }

  _clickNode(d,ev){
    if(this.hunting && d.classList.contains('tiger')){ this._catch(d); if(ev)ev.stopPropagation(); return; }
    d.classList.toggle('flip');
    d.textContent = d.classList.contains('flip') ? d.dataset.en : d.dataset.es;
  }

  // ---------- match ----------
  match(){
    const raw=(document.getElementById('vf-input').value||'').toLowerCase().trim();
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    let n=0;
    this.nodeEls.forEach(d=>{
      d.classList.remove('lit');
      if(!raw) return;
      const es=norm(d.dataset.es), en=norm(d.dataset.en), q=norm(raw);
      if(es===q||en===q||es.indexOf(q)>=0||en.split(/[ /]+/).indexOf(q)>=0){ d.classList.add('lit'); n++; }
    });
    if(raw && n){ this._status('“'+raw+'” lights up '+n+' time(s) in the bush — that is saturation: the word is everywhere'); }
    else if(raw){ this._status('“'+raw+'” not in this pack yet'); }
  }
  clearMatch(){ const i=document.getElementById('vf-input'); if(i)i.value=''; this.nodeEls.forEach(d=>d.classList.remove('lit')); this._status(this.count+' words in the bush'); }

  // ---------- reveal all ----------
  toggleRevealAll(){ this._setRevealAll(!this.revealAll); }
  _setRevealAll(v){
    this.revealAll=v;
    document.getElementById('vf-reveal').classList.toggle('on',v);
    document.getElementById('vf-reveal').textContent = v?'reveal ES':'reveal EN';
    this.nodeEls.forEach(d=>{ d.classList.toggle('flip',v); d.textContent=v?d.dataset.en:d.dataset.es; });
  }

  // ---------- the tiger ----------
  toggleHunt(){ this.hunting?this._stopHunt():this._startHunt(); }
  _startHunt(){
    this.hunting=true; this.caught=0; this.bitten=0; this.streak=0; this._hud();
    document.getElementById('vf-hunt').classList.add('on');
    document.getElementById('vf-hunt').textContent='🐅 hunt: ON';
    document.getElementById('vf-hud').style.display='flex';
    this._status('a tiger moves in the bush. catch the burning word before it bites. survive.');
    this._spawn();
  }
  _stopHunt(silent){
    this.hunting=false;
    if(this.spawnTimer){clearTimeout(this.spawnTimer);this.spawnTimer=null;}
    if(this.tigerTimer){clearTimeout(this.tigerTimer);this.tigerTimer=null;}
    if(this.tigerEl){ this.tigerEl.classList.remove('tiger'); this.tigerEl.textContent=this.tigerEl.dataset.es; this.tigerEl=null; }
    const b=document.getElementById('vf-hunt'); if(b){ b.classList.remove('on'); b.textContent='🐅 hunt: off'; }
    const h=document.getElementById('vf-hud'); if(h) h.style.display='none';
    if(!silent) this._status('hunt over — caught '+this.caught+', bitten '+this.bitten);
  }
  _visibleNodes(){
    const g=document.getElementById('vf-grid').getBoundingClientRect();
    const out=[];
    for(let i=0;i<this.nodeEls.length;i++){
      const p=this.POS[i];
      const sx=this.pan.x+p.x*this.pan.z, sy=this.pan.y+p.y*this.pan.z;
      if(sx>10 && sy>10 && sx<g.width-10 && sy<g.height-10) out.push(this.nodeEls[i]);
    }
    return out.length?out:this.nodeEls;
  }
  _spawn(){
    if(!this.hunting) return;
    const vis=this._visibleNodes();
    const el=vis[Math.floor(Math.random()*vis.length)];
    this.tigerEl=el; el.classList.add('tiger'); el.classList.remove('flip'); el.textContent=el.dataset.es;
    // life of the tiger shrinks as you get better (pressure ramps)
    const life=Math.max(900, 2100 - this.caught*45);
    this.tigerTimer=setTimeout(()=>this._bite(), life);
  }
  _catch(el){
    if(this.tigerTimer){clearTimeout(this.tigerTimer);this.tigerTimer=null;}
    el.classList.remove('tiger');
    el.classList.add('flip'); el.textContent=el.dataset.en; // reward = you SEE the meaning
    setTimeout(()=>{ el.classList.remove('flip'); el.textContent=el.dataset.es; },650);
    this.caught++; this.streak++; this.tigerEl=null; this._hud();
    this._status('caught “'+el.dataset.es+'” = '+el.dataset.en+' · streak '+this.streak);
    this.spawnTimer=setTimeout(()=>this._spawn(), 420);
  }
  _bite(){
    if(this.tigerEl){ this.tigerEl.classList.remove('tiger'); this.tigerEl.textContent=this.tigerEl.dataset.es; this.tigerEl=null; }
    this.bitten++; this.streak=0; this._hud();
    const b=document.getElementById('vf-bite'); b.style.opacity='1'; setTimeout(()=>b.style.opacity='0',60);
    this._status('bitten. the bush had a word you didn’t know. that is why you learn it.');
    this.spawnTimer=setTimeout(()=>this._spawn(), 700);
  }
  _hud(){ const c=document.getElementById('vf-caught'),bi=document.getElementById('vf-bitten'),s=document.getElementById('vf-streak'); if(c)c.textContent=this.caught; if(bi)bi.textContent=this.bitten; if(s)s.textContent=this.streak; }

  // ---------- fps guard ----------
  _fpsLoop(){
    let last=performance.now(), frames=0, acc=0;
    const tick=now=>{ frames++; acc+=now-last; last=now;
      if(acc>=500){ const fps=Math.round(frames/(acc/1000)); frames=0; acc=0;
        const el=document.getElementById('vf-fps');
        if(el){ el.textContent=fps+' fps'; el.style.color = fps<28?'#ff7a6b':(fps<50?'#ffd700':'#3f5a48');
          if(fps<24 && this.count>200 && !this._warned){ this._warned=true; this._status('⚠ chromium is choking ('+fps+' fps) — dial saturation back with the slider'); setTimeout(()=>this._warned=false,4000); } }
      }
      this._raf=requestAnimationFrame(tick); };
    this._raf=requestAnimationFrame(tick);
  }
  componentWillUnmount(){ if(this._raf)cancelAnimationFrame(this._raf); this._stopHunt(true); }

  _status(t){ const s=document.getElementById('vf-status'); if(s) s.textContent=t; }

  renderVals(){
    return {
      onHunt:()=>this.toggleHunt(),
      onRevealAll:()=>this.toggleRevealAll(),
      onMatch:()=>this.match(),
      onClear:()=>this.clearMatch(),
    };
  }
}
</script>
</body>
</html>
