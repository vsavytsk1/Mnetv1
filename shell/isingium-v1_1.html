  ISINGIUM v1.1
  =================================================================
  ## CURSE 32 — The Silent Typed Array (deadIndex)
  Found by Vlad, in a screenshot, FROM THE PICTURE. Third time this week.
  =================================================================

  SYMPTOM:
    T = 3.500, far above T_c. The lattice should be TV STATIC — salt and
    pepper. Instead: enormous smooth frozen blobs and dead straight stripes.
    At T = 1.54, deep in the ordered phase, |m| should be ~0.99. It read 0.238.
    And every readout looked FINE: T 3.500 ✓ · |m| 0.043 ✓ · 2948k flips/s ✓.

  ROOT CAUSE:
      var expTab = new Float64Array(9);        // ← NINE
      expTab[dE + 8] = ...                     // dE = +8 → index 16
    dE ∈ {−8,−4,0,+4,+8} → indices {0,4,8,12,16}. THE ARRAY HAS NINE SLOTS.
    Indices 12 and 16 do not exist.

    And here is what makes it a curse rather than a bug:
      · an OUT-OF-BOUNDS WRITE to a TypedArray IS A SILENT NO-OP. No error.
        The value simply evaporates. (A plain Array would have GROWN and worked.)
      · the read then returns `undefined`.
      · and `Math.random() < undefined` is `false` — because every comparison
        with NaN is false. NOT an error. NOT a warning. Just `false`. Forever.

    So EVERY ENERGY-RAISING MOVE WAS REJECTED, at every temperature.
    That is not Metropolis. THAT IS T = 0, EXACTLY. A greedy quench.
    The slider was decorative.

  AND THE ARTIFACT WAS PHYSICS, WHICH IS WHY IT LOOKED PLAUSIBLE:
    a T=0 Ising quench falls into the nearest local minimum and freezes. On a
    periodic lattice it very often lands in a famous METASTABLE STRIPE state —
    flat domain walls where every single flip costs ΔE ≥ 0, so nothing can ever
    move again. Those vertical bars in the screenshots are a real, known,
    published object. THE BUG PRODUCED CORRECT PHYSICS OF THE WRONG MODEL.

  I USED A TYPED ARRAY FOR SPEED AND IT SILENTLY ATE MY WRITES.
  THE OPTIMISATION INTRODUCED THE BUG.

  FAMILY: cousin of CURSE 31 (the orphan node) — both are TOTAL CONFIDENCE:
  every number present, formatted, plausible, and wrong. But 32 is worse in one
  specific way: 31 was my typo. 32 was JAVASCRIPT HELPING. The language chose
  silence twice — once on the write, once on the NaN compare — and neither
  choice is a mistake in the spec.
    CURSE 30: total silence. Loud, obvious, findable.
    CURSE 31: total confidence. A green ✓ on a poisoned graph.
    CURSE 32: total confidence, AND the wrong answer was real physics.
  THE ONLY WITNESS WAS THE RENDER. Every scalar lied. The picture did not.
  That is why you draw the thing.

  THE FIX (and the three checks that should have existed from line one):
    K0a · expTab is Float64Array(17), and BUILD-TIME VERIFIED: after buildExp(),
          assert expTab[12] and expTab[16] are finite and in (0,1]. Red if not.
    K0b · ACCEPTANCE RATE is measured and shown. At T→∞ it converges to a known
          value; a rate pinned near the dE≤0 fraction means uphill moves are
          being eaten. This alone would have caught it in one second.
    K0c · at T ≫ T_c, |m| MUST be O(1/√(N²)) = O(1/N). For N=128 that is ~0.008.
          The broken build showed 0.043–0.094 — five to twelve times too big.
          The check is live and goes RED. The physics has a floor and now the
          file knows it.

  Everything else is unchanged from v1.0 and still true:
  two rules, a random walk, symmetry condensing out of a coin — and at exactly
  T_c = 2/ln(1+√2) = 2.2691853, and NOWHERE ELSE, a genuine fractal with the
  exact dimension d_f = 187/96 = 1.9479. The real one. Not put in. Emergent.

  Pure Canvas 2D. No deps. chi=2 · always. 2026-07-17.

<body>
<canvas id="lat"></canvas>
<canvas id="plot"></canvas>

<div id="top">
  <div id="brand"><div class="t">ISINGIUM v1.1</div><div class="s">CURSE 32 slain · the render was the only witness</div></div>
  <div id="verdict" class="dis"><div class="vt" id="v-t">—</div><div class="vs" id="v-s">thermalising…</div></div>
  <div class="chips">
    <div class="mc"><div class="lab">kernel</div><div class="val green" id="m-k">—</div></div>
    <div class="mc"><div class="lab">T</div><div class="val" id="m-t">—</div></div>

  </div>
</div>

<div id="dossier">

</div>

<script>
"use strict";
var N=128, J=1, T=3.50, s=new Int8Array(N*N), run=true, showClu=false, dTab="c32";
var TC_EXACT=2/Math.log(1+Math.SQRT2);   // Onsager 1944 · 2.2691853…
var DF_EXACT=187/96;                     // 1.9479… exact
// ═════════════════════════════════════════════════════════════════════════
// CURSE 32, SLAIN. dE ∈ {−8,−4,0,+4,+8} → index dE+8 ∈ {0,4,8,12,16}.
// v1.0 allocated NINE slots. Writes to 12 and 16 were SILENTLY DROPPED —
// a TypedArray out-of-bounds write is a no-op, the read gives undefined, and
// Math.random() < undefined is FALSE, not an error. Every uphill move was
// rejected. That is T=0, exactly, at every slider position.
// SEVENTEEN. And then VERIFIED, below, every time it is built.
// ═════════════════════════════════════════════════════════════════════════
var expTab=new Float64Array(17), expOK=false;
function buildExp(){
  for(var d=-8;d<=8;d+=4) expTab[d+8] = d<=0 ? 1 : Math.exp(-d/T);
  // K0a — the check that should have existed on line one.
  expOK = isFinite(expTab[12]) && expTab[12]>0 && expTab[12]<=1 &&
          isFinite(expTab[16]) && expTab[16]>0 && expTab[16]<=1;
}
var flips=0, acc=0, att=0, accRate=0, fps=0, lastT=performance.now();
var mAcc=0, m2Acc=0, nAcc=0, chi=0, dfMeas=0, sweepData=null, tcMeas=0;

function idx(x,y){ return ((y+N)%N)*N + ((x+N)%N); }
function randomize(){ for(var i=0;i<N*N;i++) s[i]= Math.random()<0.5?-1:1; mAcc=m2Acc=nAcc=0; acc=att=0; }
function sweep(n){
  for(var k=0;k<n;k++){
    var x=(Math.random()*N)|0, y=(Math.random()*N)|0, i=idx(x,y);
    var nb = s[idx(x+1,y)]+s[idx(x-1,y)]+s[idx(x,y+1)]+s[idx(x,y-1)];
    var dE = 2*J*s[i]*nb;
    att++;
    if(dE<=0 || Math.random()<expTab[dE+8]){ s[i]=-s[i]; acc++; }
  }
  flips+=n;
}
function magnet(){ var t=0; for(var i=0;i<N*N;i++) t+=s[i]; return t/(N*N); }

var cluMask=null;
function largestCluster(){
  var n=N*N, lab=new Int32Array(n).fill(-1), best=[], stack=new Int32Array(n);
  for(var st=0;st<n;st++){
    if(lab[st]!==-1) continue;
    var sp=0, cur=[], sv=s[st];
    stack[sp++]=st; lab[st]=st;
    while(sp>0){
      var p=stack[--sp]; cur.push(p);
      var x=p%N, y=(p/N)|0, nbs=[idx(x+1,y),idx(x-1,y),idx(x,y+1),idx(x,y-1)];
      for(var q=0;q<4;q++){ var v=nbs[q]; if(lab[v]===-1 && s[v]===sv){ lab[v]=st; stack[sp++]=v; } }
    }
    if(cur.length>best.length) best=cur;
  }
  var mask=new Uint8Array(n);
  for(var b=0;b<best.length;b++) mask[best[b]]=1;
  return mask;
}
function boxCount(mask){
  var xs=[], ys=[];
  for(var box=1;box<=32;box*=2){
    var seen={}, c=0, g=Math.ceil(N/box);
    for(var y=0;y<N;y++) for(var x=0;x<N;x++){
      if(!mask[y*N+x]) continue;
      var k=((y/box)|0)*g+((x/box)|0);
      if(!seen[k]){ seen[k]=1; c++; }
    }
    if(c>0){ xs.push(Math.log(1/box)); ys.push(Math.log(c)); }
  }
  if(xs.length<3) return 0;
  var n2=xs.length, sx=0,sy=0,sxx=0,sxy=0;
  for(var i=0;i<n2;i++){ sx+=xs[i]; sy+=ys[i]; sxx+=xs[i]*xs[i]; sxy+=xs[i]*ys[i]; }
  return (n2*sxy-sx*sy)/((n2*sxx-sx*sx)||1);
}
function measure(){ if(showClu){ cluMask=largestCluster(); dfMeas=boxCount(cluMask); } else cluMask=null; }

function sweepTc(){
  var save=T, out=[], best=-1, bt=0;
  for(var t=1.6;t<=3.2;t+=0.04){
    T=t; buildExp(); randomize(); sweep(N*N*60);
    var ma=0, m2=0, K=40;
    for(var k=0;k<K;k++){ sweep(N*N*2); var m=Math.abs(magnet()); ma+=m; m2+=m*m; }
    ma/=K; m2/=K;
    var x=(N*N)*(m2-ma*ma)/t;
    out.push({t:t, m:ma, x:x});
    if(x>best){ best=x; bt=t; }
  }
  sweepData=out; tcMeas=bt; T=save; buildExp(); randomize(); drawPlot(); render();
}

var lc=document.getElementById("lat"), lx=lc.getContext("2d");
var pc=document.getElementById("plot"), px=pc.getContext("2d");
var img=null;
function layout(){
  var side=Math.min(innerWidth-380, innerHeight-260); side=Math.max(200,side);
  lc.width=N; lc.height=N; lc.style.width=side+"px"; lc.style.height=side+"px";
  pc.width=side*2; pc.height=280; pc.style.width=side+"px"; pc.style.height="140px";
  pc.style.top=(100+side)+"px";
  px.setTransform(2,0,0,2,0,0);
  img=lx.createImageData(N,N);
}
addEventListener("resize",layout);
function drawLat(){
  var d=img.data;
  for(var i=0;i<N*N;i++){
    var o=i*4;
    if(cluMask && cluMask[i]){ d[o]=255; d[o+1]=215; d[o+2]=0; }
    else if(s[i]>0){ d[o]=0; d[o+1]=212; d[o+2]=255; }
    else { d[o]=14; d[o+1]=14; d[o+2]=26; }
    d[o+3]=255;
  }
  lx.putImageData(img,0,0);
}
function drawPlot(){
  var w=pc.width/2, h=pc.height/2;
  px.clearRect(0,0,w,h);
  px.fillStyle="rgba(255,215,0,0.5)"; px.font="8px ui-monospace,monospace"; px.textAlign="left";
  px.fillText(sweepData? "χ and |m| vs T · the peak IS T_c" : "press ⚡ find T_c", 8, 12);
  if(!sweepData) return;
  var x0=26,x1=w-8,y0=20,y1=h-16, mx=0, mm=0;
  for(var i=0;i<sweepData.length;i++){ mx=Math.max(mx,sweepData[i].x); mm=Math.max(mm,sweepData[i].m); }
  function PX(t){ return x0+((t-1.6)/1.6)*(x1-x0); }
  function PY(v,M){ return y1-(v/(M||1))*(y1-y0); }
  px.strokeStyle="rgba(0,255,213,0.75)"; px.lineWidth=1.4; px.setLineDash([4,3]);
  px.beginPath(); px.moveTo(PX(TC_EXACT),y0); px.lineTo(PX(TC_EXACT),y1); px.stroke(); px.setLineDash([]);
  px.fillStyle="rgba(0,255,213,0.9)"; px.fillText("Onsager "+TC_EXACT.toFixed(4), PX(TC_EXACT)+4, y0+9);
  px.strokeStyle="rgba(255,51,85,0.8)"; px.lineWidth=1.2;
  px.beginPath(); px.moveTo(PX(tcMeas),y0); px.lineTo(PX(tcMeas),y1); px.stroke();
  px.fillStyle="rgba(255,51,85,0.9)"; px.textAlign="right";
  px.fillText("measured "+tcMeas.toFixed(3), PX(tcMeas)-4, y1-4);
  px.strokeStyle="rgba(255,215,0,0.95)"; px.lineWidth=1.6; px.beginPath();
  for(var j=0;j<sweepData.length;j++){ var a=PX(sweepData[j].t), b=PY(sweepData[j].x,mx); j?px.lineTo(a,b):px.moveTo(a,b); }
  px.stroke();
  px.strokeStyle="rgba(0,212,255,0.7)"; px.lineWidth=1.2; px.beginPath();
  for(var k=0;k<sweepData.length;k++){ var a2=PX(sweepData[k].t), b2=PY(sweepData[k].m,mm); k?px.lineTo(a2,b2):px.moveTo(a2,b2); }
  px.stroke();
  px.fillStyle="rgba(255,215,0,0.8)"; px.textAlign="left"; px.fillText("χ",8,26);
  px.fillStyle="rgba(0,212,255,0.7)"; px.fillText("|m|",8,38);
}
function judge(){
  var m=Math.abs(magnet()), ve=document.getElementById("verdict");
  var mFloor=1/N;                       // K0c · |m| ~ 1/√(N²) = 1/N at high T
  var deadPhysics = (!expOK) || (T>3.2 && m>6*mFloor);
  var near=Math.abs(T-TC_EXACT)<0.06;
  if(deadPhysics){
    ve.className="bad"; set("v-t","☠ PHYSICS DEAD");
    set("v-s", !expOK ? "the Boltzmann table is not populated — uphill moves are being silently rejected. that is CURSE 32."
      : "at T="+T.toFixed(2)+" ≫ T_c, |m| should be ~"+mFloor.toFixed(4)+" (=1/√N²). it is "+m.toFixed(4)+", "+(m/mFloor).toFixed(1)+"× too big. the lattice is frozen. the slider is decorative. something is eating the uphill moves.");
  }
  else if(near){ ve.className="crit"; set("v-t","★ CRITICAL");
    set("v-s","T = T_c. the correlation length has DIVERGED. this picture looks the same at every zoom — clusters inside clusters inside clusters. a REAL fractal, d_f = 187/96 = 1.948, and nobody put it there."); }
  else if(T<TC_EXACT){ ve.className="ord"; set("v-t","ORDERED · |m| = "+m.toFixed(3));
    set("v-s","below T_c. the lattice CHOSE a direction and nobody told it which. the Z₂ symmetry is still in the Hamiltonian and the state broke it anyway — spontaneous symmetry breaking, the same mechanism that gives the W and Z their mass."); }
  else { ve.className="dis"; set("v-t","DISORDERED · |m| ≈ "+m.toFixed(4));
    set("v-s","above T_c. TV static, as it must be. |m| ≈ "+mFloor.toFixed(4)+" = 1/√N² — the finite-size floor, not order. the Z₂ symmetry is intact."); }
  var ke=document.getElementById("m-k");
  ke.textContent = deadPhysics? "FAIL" : "OK"; ke.style.color = deadPhysics? "#ff3355":"#00ffd5";
  set("m-t",T.toFixed(3)); set("m-m",m.toFixed(4));
  set("m-a",(accRate*100).toFixed(1)+"%");
  document.getElementById("m-a").style.color = accRate<0.505? "#ff3355":"#ffd700";
  set("m-df", showClu? (dfMeas>0?dfMeas.toFixed(3):"—") : "off");
  document.getElementById("m-df").style.color=(showClu&&Math.abs(dfMeas-DF_EXACT)<0.12)?"#00ffd5":"#ffd700";
}
function set(id,v){ var e=document.getElementById(id); if(e)e.textContent=v; }

function setTab(t){
  dTab=t;
  var tabs=document.querySelectorAll("#dossier .tab");
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle("active",tabs[i].getAttribute("data-t")===t);
  render();
}
function render(){
  var h="";
  if(dTab==="c32"){
