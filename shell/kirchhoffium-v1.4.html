  KIRCHHOFFIUM v1.4 — THE DOSSIER BUILD
  =================================================================
  Conventions folded in from apollonium / AgeOfLenguages / bersha:
    · DOSSIER      — apollonium tabbed receipts (Cut / Choke / Own / Fleet / K)
    · COST METER   — AgeOfLenguages: you field only what you PAY for
    · VERDICT      — bersha-style honest outcome, no fake prize
    · BADGE        — grey → gold only when EARNED (Path III: target ≠ result)

  =================================================================
  ## CURSE 31 -- The Orphan Node (phantomVertex)
  =================================================================
  Found by Vlad, in a screenshot, from the NUMBERS.

  SYMPTOM:
    λ₂ = 0.0000. Naive min-cut = SPLIT. Every global metric flat on the floor.
    No console error. No red. The KERNEL CHECK said "✓ 176 hops from 47 cables,
    0 silent drops" — cheerfully, and truthfully.

  ROOT CAUSE:
    `Muscat` was in the HUBS array. No cable path ever touched it. One isolated
    vertex. And a disconnected graph GENUINELY has λ₂ = 0 and min-cut = 0.

    THE ALGORITHMS WERE ALL CORRECT. Stoer-Wagner correctly reported the graph
    was already split. Fiedler correctly reported λ₂ = 0 for a disconnected
    graph. Nothing was broken. They were faithfully reporting a TYPO as if it
    were a FINDING, and every downstream number inherited the lie.

  THE DEEPER FAILURE — and this is the lesson:
    v1.1's kernel check validated that every EDGE resolves to a NODE.
    It never checked that every NODE resolves to an EDGE.
    VALIDATION ONLY RAN ONE WAY.
    A check that only runs one direction is not a check. It is a comfort.

  FAMILY:
    Cousin of CURSE 26 (lockLie) — the screen disagreeing with the truth.
    Cousin of CURSE 30 (corpseParse) — but INVERTED, and worse:
      CURSE 30: total silence. Everything blank. Loud, obvious, findable.
      CURSE 31: total CONFIDENCE. Every number present, formatted, plausible,
                and wrong. A green ✓ sitting on top of a poisoned graph.
    The silent failure is kinder than the confident one.

  THE FIX:
    buildGraph() now walks BOTH directions and reports ORPHANS by name in the
    KERNEL chip, in red. And Muscat got the cable it always had in reality —
    Blue-Raman lands in Oman; Omantel is a partner on it.

  Curse count: 31. Validate both directions or you have not validated.
  A confident wrong number is worse than a blank one. Always.
  =================================================================

  THE THESIS (unchanged, and now provable on a connected graph):
    GRAPH THEORY ASSUMES EDGES FAIL INDEPENDENTLY. THE OCEAN DOES NOT CARE.
    Fifteen cables drawn as fifteen lines are ONE cable if they lie in the same
    26 km strait. The naive min-cut and the SRG truth are printed side by side,
    and the gap between them is the whole file.

  HONESTY (K1-K8): see the K tab. ~47 real cables is a SAMPLE of ~570. Route
  geometry simplified. City-level landings by choice. Motter-Lai is a model.
  Baltic/Taiwan attribution officially UNRESOLVED. 95-99% is of INTERCONTINENTAL
  traffic, not "the internet". Repair-fleet and cost figures are estimates.

  Pure Canvas 2D. No deps. chi=2 · always. Built 2026-07-16.
-->

function idx(n){ for(var i=0;i<HUBS.length;i++){ if(HUBS[i][0]===n) return i; } return -1; }
function buildGraph(){

  for(var c=0;c<CABLES.length;c++){
    var cab=CABLES[c];
    for(var i=0;i<cab.p.length-1;i++){
      var a=idx(cab.p[i]), b=idx(cab.p[i+1]);
      if(a<0){ BUILD_ERRORS.push(cab.n+": no hub \""+cab.p[i]+"\""); continue; }
      if(b<0){ BUILD_ERRORS.push(cab.n+": no hub \""+cab.p[i+1]+"\""); continue; }
      if(a===b){ BUILD_ERRORS.push(cab.n+": self-loop at "+cab.p[i]); continue; }
      used[a]=true; used[b]=true;
      EDGES.push({a:a,b:b,cable:c,srg:cab.srg,owner:cab.o,cut:false});

  for(var h=0;h<HUBS.length;h++){ if(!used[h]) ORPHANS.push(HUBS[h][0]); }

// ---------- projection: TRUE 2:1, centred (v1.3 stretched it) ----------
function project(){
  var top=76, bot=52, pad=14;
  var aw=W-2*pad, ah=H-top-bot;
  var w=Math.min(aw, ah*2), h=w/2;
  var ox=(W-w)/2, oy=top+(ah-h)/2;
  return { toX:function(lg){ return ox+(lg+180)/360*w; },
           toY:function(lt){ return oy+(90-lt)/180*h; } };
}
function hubXY(i){ var p=project(); return {x:p.toX(HUBS[i][1]), y:p.toY(HUBS[i][2])}; }
function haversine(a,b){
  var R=6371, la1=HUBS[a][2]*Math.PI/180, la2=HUBS[b][2]*Math.PI/180;
  var dLa=la2-la1, dLo=(HUBS[b][1]-HUBS[a][1])*Math.PI/180;
  var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ---------- algorithms (K2) ----------
function activeEdges(){ var o=[]; for(var i=0;i<EDGES.length;i++){ if(!EDGES[i].cut) o.push(EDGES[i]); } return o; }
function adjAlive(alive){
  var n=HUBS.length, adj=[];
  for(var i=0;i<n;i++) adj.push([]);
  var e=activeEdges();
  for(var k=0;k<e.length;k++){
    if(alive&&(!alive[e[k].a]||!alive[e[k].b])) continue;
    adj[e[k].a].push(e[k].b); adj[e[k].b].push(e[k].a);
  }
  return adj;
}
function componentsOf(adj,alive){
  var n=adj.length, comp=new Array(n).fill(-1), c=0;
  for(var s=0;s<n;s++){
    if(comp[s]!==-1) continue; if(alive&&!alive[s]) continue;
    var st=[s]; comp[s]=c;
    while(st.length){ var u=st.pop();
      for(var i=0;i<adj[u].length;i++){ var v=adj[u][i];
        if(alive&&!alive[v]) continue;
        if(comp[v]===-1){ comp[v]=c; st.push(v); } } }
    c++;
  }
  return {comp:comp,count:c};
}
function artPoints(adj){
  var n=adj.length, disc=new Array(n).fill(-1), low=new Array(n).fill(0),
      isArt=new Array(n).fill(false), timer=0;
  function dfs(u,par){
    disc[u]=low[u]=timer++; var ch=0;
    for(var i=0;i<adj[u].length;i++){
      var v=adj[u][i]; if(v===par) continue;
      if(disc[v]===-1){ ch++; dfs(v,u); if(low[v]<low[u]) low[u]=low[v];
        if(par!==-1&&low[v]>=disc[u]) isArt[u]=true; }
      else if(disc[v]<low[u]) low[u]=disc[v];
    }
    if(par===-1&&ch>1) isArt[u]=true;
  }
  for(var s=0;s<n;s++){ if(disc[s]===-1) dfs(s,-1); }
  return isArt;
}
function stoerWagner(){
  var n=HUBS.length;
  if(componentsOf(adjAlive(null),null).count>1) return 0;
  var w=[]; for(var i=0;i<n;i++) w.push(new Array(n).fill(0));
  var e=activeEdges();
  for(var k=0;k<e.length;k++){ w[e[k].a][e[k].b]+=1; w[e[k].b][e[k].a]+=1; }
  var pres=[]; for(var v=0;v<n;v++) pres.push(v);
  var best=Infinity;
  while(pres.length>1){
    var inA=new Array(n).fill(false), ws=new Array(n).fill(0);
    var a0=pres[0]; inA[a0]=true;
    for(var i2=0;i2<pres.length;i2++) ws[pres[i2]]=w[a0][pres[i2]];
    var prev=a0, last=a0, cop=0;
    for(var ad=1;ad<pres.length;ad++){
      var sel=-1, mx=-1;
      for(var j=0;j<pres.length;j++){ var vv=pres[j]; if(!inA[vv]&&ws[vv]>mx){ mx=ws[vv]; sel=vv; } }
      if(sel<0) break;
      inA[sel]=true; prev=last; last=sel; cop=mx;
      for(var j2=0;j2<pres.length;j2++){ var v2=pres[j2]; if(!inA[v2]) ws[v2]+=w[sel][v2]; }
    }
    if(cop<best) best=cop;
    for(var t=0;t<pres.length;t++){ var vt=pres[t]; if(vt===last||vt===prev) continue;
      w[prev][vt]+=w[last][vt]; w[vt][prev]=w[prev][vt]; }
    pres=pres.filter(function(x){ return x!==last; });
  }
  return best===Infinity?0:best;
}
function fiedler(){
  var n=HUBS.length;
  if(componentsOf(adjAlive(null),null).count>1) return 0;
  var L=[]; for(var i=0;i<n;i++) L.push(new Array(n).fill(0));
  var e=activeEdges();
  for(var k=0;k<e.length;k++){ L[e[k].a][e[k].a]++; L[e[k].b][e[k].b]++; L[e[k].a][e[k].b]--; L[e[k].b][e[k].a]--; }
  var kap=3*n, x=new Array(n);
  for(var i2=0;i2<n;i2++) x[i2]=Math.sin(i2*1.7)+0.3*Math.cos(i2*0.9);
  function defl(v){ var m=0; for(var i=0;i<n;i++) m+=v[i]; m/=n; for(var i=0;i<n;i++) v[i]-=m; }
  function nrm(v){ var s=0; for(var i=0;i<n;i++) s+=v[i]*v[i]; s=Math.sqrt(s)||1; for(var i=0;i<n;i++) v[i]/=s; }
  defl(x); nrm(x);
  for(var it=0;it<350;it++){
    var y=new Array(n);
    for(var i3=0;i3<n;i3++){ var s2=kap*x[i3]; for(var j=0;j<n;j++) s2-=L[i3][j]*x[j]; y[i3]=s2; }
    defl(y); nrm(y); x=y;
  }
  var lam=0;
  for(var i4=0;i4<n;i4++){ var s3=0; for(var j2=0;j2<n;j2++) s3+=L[i4][j2]*x[j2]; lam+=x[i4]*s3; }
  return Math.max(0,lam);
}
function betweenness(adj,alive){
  var n=adj.length, CB=new Array(n).fill(0);
  for(var s=0;s<n;s++){
    if(alive&&!alive[s]) continue;
    var S=[], P=[], sig=new Array(n).fill(0), d=new Array(n).fill(-1);
    for(var i=0;i<n;i++) P.push([]);
    sig[s]=1; d[s]=0;
    var Q=[s], head=0;
    while(head<Q.length){
      var v=Q[head++]; S.push(v);
      for(var k=0;k<adj[v].length;k++){
        var w=adj[v][k]; if(alive&&!alive[w]) continue;
        if(d[w]<0){ Q.push(w); d[w]=d[v]+1; }
        if(d[w]===d[v]+1){ sig[w]+=sig[v]; P[w].push(v); }
      }
    }
    var del=new Array(n).fill(0);
    while(S.length){
      var w2=S.pop();
      for(var j=0;j<P[w2].length;j++){ var v2=P[w2][j]; del[v2]+=(sig[v2]/sig[w2])*(1+del[w2]); }
      if(w2!==s) CB[w2]+=del[w2];
    }
  }
  for(var i2=0;i2<n;i2++) CB[i2]/=2;
  return CB;
}

// ---------- SRG kill ----------
var activeSRG=null, srgResult=null;
function killSRG(key){
  for(var i=0;i<EDGES.length;i++) EDGES[i].cut=false;
  var lost={};
  for(var e=0;e<EDGES.length;e++){
    for(var j=0;j<EDGES[e].srg.length;j++){
      if(EDGES[e].srg[j]===key){ EDGES[e].cut=true; lost[EDGES[e].cable]=1; break; }
    }
  }
  var cablesLost=Object.keys(lost).length;
  var comp=componentsOf(adjAlive(null),null), sizes={}, mxs=0;
  for(var k=0;k<HUBS.length;k++){ var c=comp.comp[k]; if(c<0) continue; sizes[c]=(sizes[c]||0)+1; if(sizes[c]>mxs) mxs=sizes[c]; }
  var adj=adjAlive(null), iso=[];
  for(var h=0;h<HUBS.length;h++){ if(adj[h].length===0) iso.push(HUBS[h][0]); }
  srgResult={ key:key, cablesLost:cablesLost, comps:comp.count, survival:mxs/HUBS.length,
              isolated:iso, repairDays:Math.ceil(cablesLost/Math.max(1,ships))*40 };
  activeSRG=key; recompute();
}
function clearSRG(){ for(var i=0;i<EDGES.length;i++) EDGES[i].cut=false; activeSRG=null; srgResult=null; recompute(); }

// ---------- cascade ----------
var alpha=0.20, ships=4, L0=null, activeCascade=null;
function cascade(seed){
  var n=HUBS.length, alive=new Array(n).fill(true);
  alive[seed]=false;
  var C=[]; for(var i=0;i<n;i++) C.push((1+alpha)*L0[i]);
  var killed=[seed], rounds=0;
  while(rounds++<20){
    var L=betweenness(adjAlive(alive),alive), fail=[];
    for(var i2=0;i2<n;i2++){ if(alive[i2]&&L[i2]>C[i2]) fail.push(i2); }
    if(!fail.length) break;
    for(var j=0;j<fail.length;j++){ alive[fail[j]]=false; killed.push(fail[j]); }
  }
  var comp=componentsOf(adjAlive(alive),alive), sizes={}, mxs=0;
  for(var k=0;k<n;k++){ if(!alive[k]) continue; var c=comp.comp[k]; sizes[c]=(sizes[c]||0)+1; if(sizes[c]>mxs) mxs=sizes[c]; }
  return {alive:alive,killed:killed,survival:mxs/n,rounds:rounds-1,seed:seed};
}

var KM_COST=30000;   // ~$30k/km · 2Africa ≈ $1B / 45,000 km ≈ $22k/km; TAT-8 ≈ $50k/km
var SHIP_COST=80e6;  // a converted repair vessel, order-of-magnitude
var cache={};
function totalSpent(){ return spentCable+spentShips; }
function usd(v){ return v>=1e9? "$"+(v/1e9).toFixed(2)+"B" : v>=1e6? "$"+Math.round(v/1e6)+"M" : "$"+Math.round(v/1e3)+"k"; }
function hyperPct(){ var h=0; for(var i=0;i<CABLES.length;i++){ if(CABLES[i].o!=="c"&&CABLES[i].o!=="h") h++; } return Math.round(100*h/CABLES.length); }

// ---------- VERDICT + BADGE (bersha · Path III: earned, never faked) ----------
function judge(){
  var conn=(cache.comp.count===1), arts=0;
  for(var i=0;i<cache.isArt.length;i++){ if(cache.isArt[i]) arts++; }
  var worstSurv=1;
  for(var k in SRGS){
    for(var e=0;e<EDGES.length;e++) EDGES[e].cut=false;
    var lost={};
    for(var e2=0;e2<EDGES.length;e2++){
      for(var j=0;j<EDGES[e2].srg.length;j++){ if(EDGES[e2].srg[j]===k){ EDGES[e2].cut=true; lost[EDGES[e2].cable]=1; break; } }
    }
    var cp=componentsOf(adjAlive(null),null), sz={}, mx=0;
    for(var h=0;h<HUBS.length;h++){ var c=cp.comp[h]; if(c<0) continue; sz[c]=(sz[c]||0)+1; if(sz[c]>mx) mx=sz[c]; }
    if(mx/HUBS.length<worstSurv) worstSurv=mx/HUBS.length;
  }
  for(var e3=0;e3<EDGES.length;e3++) EDGES[e3].cut=false;
  if(activeSRG) killSRGQuiet(activeSRG);
  var lam=cache.fied;
  var pass=[conn, arts===0, worstSurv>0.75, lam>0.12];
  var earned=pass[0]&&pass[1]&&pass[2]&&pass[3];
  var cls, t, s;
  if(!conn){ cls="bad"; t="SPLIT"; s="the graph is in "+cache.comp.count+" pieces. some region is dark right now."; }
  else if(worstSurv<0.6){ cls="bad"; t="CHOKED"; s="one strait takes "+(100-Math.round(worstSurv*100))+"% of the network with it. the min-cut never saw this coming."; }
  else if(arts>0){ cls="warn"; t="BRITTLE"; s=arts+" hub"+(arts>1?"s":"")+" whose loss splits the graph. no backup path exists for "+(arts>1?"them":"it")+"."; }
  else if(lam<=0.12){ cls="warn"; t="THIN"; s="connected, but λ₂="+lam.toFixed(3)+". easy to cut in two. lay a cable across a gap and watch it climb."; }
  else { cls="good"; t="RESILIENT"; s="connected · no articulation points · worst strait leaves "+Math.round(worstSurv*100)+"% standing · λ₂="+lam.toFixed(3)+". earned."; }
  cache.worstSurv=worstSurv; cache.arts=arts;
  var ve=document.getElementById("verdict");
  ve.className=cls; set("v-t",t); set("v-s",s);
  var be=document.getElementById("badge");
  be.classList.toggle("earned",earned);
  be.textContent = earned? "★ resilient" : "resilient "+pass.filter(Boolean).length+"/4";
}
function killSRGQuiet(key){
  for(var e=0;e<EDGES.length;e++){
    for(var j=0;j<EDGES[e].srg.length;j++){ if(EDGES[e].srg[j]===key){ EDGES[e].cut=true; break; } }
  }
}

function recompute(){
  var adj=adjAlive(null);
  cache.comp=componentsOf(adj,null);
  cache.isArt=artPoints(adj);
  cache.cut=stoerWagner();
  cache.fied=fiedler();
  L0=betweenness(adj,null); cache.L0=L0;
  var mx=0; for(var i=0;i<L0.length;i++){ if(L0[i]>mx) mx=L0[i]; }
  cache.Lmax=mx||1;
  var worst=0, wk=null;
  for(var k in SRGS){
    var cnt={};
    for(var e=0;e<EDGES.length;e++){ for(var j=0;j<EDGES[e].srg.length;j++){ if(EDGES[e].srg[j]===k) cnt[EDGES[e].cable]=1; } }
    var c2=Object.keys(cnt).length;
    if(c2>worst){ worst=c2; wk=k; }
  }
  cache.srgWorst=worst; cache.srgWorstKey=wk;
  var ke=document.getElementById("m-kern");
  var bad=BUILD_ERRORS.length+ORPHANS.length;
  if(bad){ ke.textContent="FAIL "+bad; ke.style.color="#ff3355"; }
  else { ke.textContent="OK"; ke.style.color="#00ffd5"; }
  set("m-cut", cache.comp.count>1?"SPLIT":cache.cut);
  set("m-srg", worst);
  set("m-fied", cache.fied.toFixed(4));
  set("m-cost", usd(totalSpent()));
  judge();
  renderDossier();
}
function set(id,v){ var e=document.getElementById(id); if(e)e.textContent=v; }

// ---------- draw ----------
function draw(){
  requestAnimationFrame(draw);
  ctx.fillStyle="#050508"; ctx.fillRect(0,0,W,H);
  if(MODE==="titans"){ drawTitans(); return; }
  var p=project();
  ctx.fillStyle="#0d0d16"; ctx.strokeStyle="rgba(110,115,135,0.16)"; ctx.lineWidth=0.8;
  for(var L=0;L<LAND.length;L++){
    var poly=LAND[L]; ctx.beginPath();
    for(var q=0;q<poly.length;q++){ var x=p.toX(poly[q][0]), y=p.toY(poly[q][1]); q?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.lineCap="round";
  var ac=activeCascade;
  for(var i=0;i<EDGES.length;i++){
    var e=EDGES[i], A=hubXY(e.a), B=hubXY(e.b), cab=CABLES[e.cable];
    var col,al,lw=1;
    if(e.cut){ col=RED; al=0.5; lw=1.5; }
    else if(ac&&(!ac.alive[e.a]||!ac.alive[e.b])){ col=RED; al=0.08; lw=0.6; }
    else if(colorOwner){ col=OWNERS[e.owner].c; al=0.4; }
    else { col= e.srg.length? AMB:CYAN; al= e.srg.length?0.32:0.22; }
    ctx.strokeStyle=css(col,al); ctx.lineWidth=lw;
    if(cab.yr>2026) ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); ctx.setLineDash([]);
  }
  for(var d=0;d<laid.length;d++){
    var A2=hubXY(laid[d].a), B2=hubXY(laid[d].b);
    ctx.strokeStyle=css(GRN,0.7); ctx.lineWidth=1.6; ctx.setLineDash([6,3]);
    ctx.beginPath(); ctx.moveTo(A2.x,A2.y); ctx.lineTo(B2.x,B2.y); ctx.stroke(); ctx.setLineDash([]);
  }
  for(var k in SRGS){
    var s=SRGS[k], xy={x:p.toX(s.lng), y:p.toY(s.lat)}, on=(activeSRG===k);
    ctx.strokeStyle=css(on?RED:AMB, on?0.95:0.34); ctx.lineWidth=on?2.4:1.1;
    ctx.setLineDash(on?[]:[3,3]);
    ctx.beginPath(); ctx.arc(xy.x,xy.y,on?22:15,0,6.2832); ctx.stroke(); ctx.setLineDash([]);
    if(on){
      ctx.fillStyle=css(RED,0.95); ctx.font="9px ui-monospace,monospace";
      ctx.textAlign="center"; ctx.textBaseline="bottom";
      ctx.fillText(s.label, xy.x, xy.y-26);
    }
  }
  var adjNow=adjAlive(null);
  for(var i2=0;i2<HUBS.length;i2++){
    var xy2=hubXY(i2), hb=HUBS[i2];
    var load=cache.L0?cache.L0[i2]/cache.Lmax:0;
    var r=colorLoad? 2.2+load*5.5 : 3;
    var col2=WHT, a=0.7;
    if(colorLoad){ col2=mix(mix(CYAN,GOLD,Math.min(1,load*2)),RED,Math.max(0,load-0.5)*2); a=0.5+load*0.5; }
    if(hb[4]){ col2=AMB; a=0.9; }
    if(cache.isArt&&cache.isArt[i2]){ col2=RED; a=1; r=Math.max(r,4); }
    if(ac&&!ac.alive[i2]){ col2=RED; a=0.95; }
    if(ac&&i2===ac.seed){ col2=WHT; r=6; }
    if(i2===layFrom&&MODE==="lay"){ col2=GRN; r=6; }
    var dark=(adjNow[i2].length===0), orph=(ORPHANS.indexOf(hb[0])>=0);
    if(dark){ col2=RED; a=1; r=Math.max(r,4); }
    ctx.fillStyle=css(col2,a); ctx.shadowColor=css(col2,0.8);
    ctx.shadowBlur=(load>0.4||hb[4]||dark)?7:0;
    ctx.beginPath(); ctx.arc(xy2.x,xy2.y,r,0,6.2832); ctx.fill(); ctx.shadowBlur=0;
    if(dark||orph){ ctx.strokeStyle=css(RED,0.7); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(xy2.x,xy2.y,r+5,0,6.2832); ctx.stroke(); }
    // declutter: label only the ones that earn it
    if(i2===hoverHub || hb[3]>0 || load>0.62 || dark){
      ctx.fillStyle=css(col2,0.88); ctx.font="8px ui-monospace,monospace";
      ctx.textAlign="center"; ctx.textBaseline="bottom";
      ctx.fillText(hb[0]+(hb[3]>0?" ("+hb[3]+")":""), xy2.x, xy2.y-r-3);
    }
  }
}
function drawTitans(){
  var pad=70, x0=pad, x1=W-320, y=H*0.36;
  ctx.strokeStyle=css(GOLD,0.22); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  function tx(yr){ return x0+(yr-1840)/(2030-1840)*(x1-x0); }
  for(var d=1850;d<=2030;d+=20){
    var x=tx(d);
    ctx.strokeStyle=css(WHT,0.09); ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x,y+5); ctx.stroke();
    ctx.fillStyle=css(WHT,0.28); ctx.font="9px ui-monospace,monospace"; ctx.textAlign="center";
    ctx.fillText(d,x,y+18);
  }
  for(var i=0;i<TITANS.length;i++){
    var t=TITANS[i], x=tx(t[0]), sel=(i===titanSel);
    var up=(i%2===0), yy=up? y-16-(i%3)*13 : y+30+(i%3)*13;
    ctx.strokeStyle=css(sel?GOLD:GRY, sel?0.8:0.22); ctx.lineWidth=sel?1.6:1;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,yy); ctx.stroke();
    ctx.fillStyle=css(sel?GOLD:AMB, sel?1:0.55); ctx.shadowColor=css(GOLD,0.9); ctx.shadowBlur=sel?10:0;
    ctx.beginPath(); ctx.arc(x,y,sel?6:3.2,0,6.2832); ctx.fill(); ctx.shadowBlur=0;
    ctx.font=(sel?"9.5px":"8px")+" ui-monospace,monospace";
    ctx.textAlign="center"; ctx.textBaseline=up?"bottom":"top";
    ctx.fillStyle=css(sel?WHT:GRY, sel?0.95:0.45);
    ctx.fillText(t[1].split(" ")[0], x, yy);
  }
  var T=TITANS[titanSel];
  var bx=70, by=H*0.52, bw=x1-70;
  ctx.fillStyle="rgba(8,8,16,0.9)"; ctx.strokeStyle=css(GOLD,0.28); ctx.lineWidth=1;
  ctx.fillRect(bx,by,bw,H*0.34); ctx.strokeRect(bx,by,bw,H*0.34);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=css(GOLD,1); ctx.font="15px ui-monospace,monospace";
  ctx.fillText(T[0]+"  ·  "+T[1], bx+18, by+28);
  ctx.fillStyle=css(CYAN,0.9); ctx.font="11px ui-monospace,monospace";
  ctx.fillText(T[2], bx+18, by+46);
  ctx.fillStyle=css(WHT,0.72); ctx.font="11px ui-monospace,monospace";
  wrap(T[3], bx+18, by+68, bw-36, 16);
  ctx.fillStyle=css(GRY,0.45); ctx.font="9px ui-monospace,monospace"; ctx.textAlign="left";
  ctx.fillText("← →  ·  "+(titanSel+1)+" / "+TITANS.length, bx+18, by+H*0.34-12);
}
function wrap(text,x,y,maxw,lh){
  var words=text.split(" "), line="", yy=y;
  for(var i=0;i<words.length;i++){
    var test=line+words[i]+" ";
    if(ctx.measureText(test).width>maxw && line){ ctx.fillText(line,x,yy); line=words[i]+" "; yy+=lh; }
    else line=test;
  }
  ctx.fillText(line,x,yy);
}

function cond(ok,txt){ return '<div class="rank"><span>'+(ok?'<span class="g">✓</span>':'<span class="r">✗</span>')+' '+txt+'</span></div>'; }

// ---------- interaction ----------
function nearestHub(mx,my){
  var b=-1, bd=14;
  for(var i=0;i<HUBS.length;i++){ var xy=hubXY(i), d=Math.hypot(xy.x-mx,xy.y-my); if(d<bd){ bd=d; b=i; } }
  return b;
}
function nearestSRG(mx,my){
  var p=project();
  for(var k in SRGS){ var s=SRGS[k];
    if(Math.hypot(p.toX(s.lng)-mx, p.toY(s.lat)-my)<22) return k; }
  return null;
}
cv.addEventListener("mousemove",function(ev){ if(MODE!=="titans") hoverHub=nearestHub(ev.clientX,ev.clientY); });
cv.addEventListener("click",function(ev){
  if(MODE==="titans"){
    var x0=70, x1=W-320, best=0, bd=1e9;
    for(var i=0;i<TITANS.length;i++){
      var x=x0+(TITANS[i][0]-1840)/(2030-1840)*(x1-x0);
      var d=Math.abs(x-ev.clientX); if(d<bd){ bd=d; best=i; }
    }
    titanSel=best; renderDossier(); return;
  }
  var hi=nearestHub(ev.clientX,ev.clientY);
  if(MODE==="lay"){
    if(hi<0) return;
    if(layFrom<0){ layFrom=hi; return; }
    if(hi===layFrom){ layFrom=-1; return; }
    var km=haversine(layFrom,hi);
    EDGES.push({a:layFrom,b:hi,cable:CABLES.length-1,srg:[],owner:"c",cut:false});
    laid.push({a:layFrom,b:hi,km:km});
    spentCable+=km*KM_COST; layFrom=-1;
    if(activeSRG) killSRGQuiet(activeSRG);
    recompute(); return;
  }
  var sk=nearestSRG(ev.clientX,ev.clientY);
  if(sk){ if(activeSRG===sk) clearSRG(); else { killSRG(sk); setTab("choke"); } return; }
  if(hi<0) return;
  if(MODE==="casc"){ if(!L0) L0=betweenness(adjAlive(null),null); activeCascade=cascade(hi); recompute(); }
});
window.addEventListener("keydown",function(e){
  if(MODE!=="titans") return;
  if(e.code==="ArrowRight"){ titanSel=Math.min(TITANS.length-1,titanSel+1); renderDossier(); }
  if(e.code==="ArrowLeft"){ titanSel=Math.max(0,titanSel-1); renderDossier(); }
});
function setMode(m){
  MODE=m; layFrom=-1;
  ["b-net","b-srg","b-casc","b-lay","b-tit"].forEach(function(id,i){
    document.getElementById(id).classList.toggle("on", m===["net","srg","casc","lay","titans"][i]);
  });
  if(m!=="casc") activeCascade=null;
  set("b-sub", m==="srg"?"click a ring · they die together" : m==="casc"?"click a hub · Motter–Lai"
    : m==="lay"?"click two hubs · you pay for it" : m==="titans"?"175 years · ← →" : "the shared risk");
  if(m==="srg") setTab("choke");
  if(m==="lay") setTab("cut");
  if(m==="titans") renderDossier(); else recompute();
}
function setAlpha(v){ alpha=v; set("v-al",v.toFixed(2).slice(1)); if(activeCascade) activeCascade=cascade(activeCascade.seed); recompute(); }
function setShips(v){
  if(v>ships) spentShips+=(v-ships)*SHIP_COST;
  ships=v; set("v-sh",v);
  if(srgResult) srgResult.repairDays=Math.ceil(srgResult.cablesLost/Math.max(1,ships))*40;
  recompute();
}
function resetAll(){
  buildGraph(); laid=[]; spentCable=0; spentShips=0; ships=4;
  document.getElementById("sSh").value=4; set("v-sh",4);
  activeCascade=null; activeSRG=null; srgResult=null; layFrom=-1;
  recompute();
}

resize(); setMode("net");
requestAnimationFrame(draw);
</script>
</body></html>
