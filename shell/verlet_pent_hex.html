<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>verlet · pent + hex · pbd</title>
<style>
  :root{
    --bg:#050510;
    --pent:#ff6b35;
    --hex:#00d4ff;
    --text:#e0f0ff;
    --text2:#7090a0;
    --void:#ff3050;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);
    color:var(--text);font-family:'Share Tech Mono','Consolas','Menlo',monospace}
  #c{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  .hud{position:fixed;pointer-events:none;font-size:11px;letter-spacing:.05em;color:var(--text2)}
  .hud b{color:var(--text);font-weight:400}
  .tag{font-size:9px;letter-spacing:.18em;color:#506070;text-transform:uppercase;margin-bottom:6px}
  #tl{top:14px;left:14px;line-height:1.55}
  #br{bottom:14px;right:14px;text-align:right;line-height:1.55}
  #bl{bottom:14px;left:14px;font-size:10px;color:#506070}
  #bl b{color:var(--text2);font-weight:400}
  #vmode{position:fixed;top:14px;right:14px;font-size:10px;letter-spacing:.18em;
    color:#506070;transition:color .25s}
  #vmode.warm{color:#9a5040}
  #vmode.on{color:var(--void)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="tl" class="hud">
  <div class="tag">verlet · position-based dynamics · müller 2007</div>
  <div>particles  <b id="np">0</b></div>
  <div>sticks     <b id="ns">0</b></div>
  <div>iters      <b id="ni">8</b></div>
  <div>frame      <b id="ms">0.0</b> ms</div>
  <div>health     <b id="hp">ok</b></div>
</div>

<div id="bl">
  click · push the shape &nbsp;·&nbsp; <b>space</b> · break (test failsafe) &nbsp;·&nbsp; <b>r</b> · reset &nbsp;·&nbsp; <b>[ ]</b> · stiffness
</div>

<div id="br" class="hud">
  <div>stiffness encoded in iter count:</div>
  <div>1–2 · jelly  ·  4–6 · soft  ·  8+ · rigid</div>
</div>

<div id="vmode">VOID · ARMED</div>

<script>
// ─── §A canvas + DPR ───────────────────────────────────────────────────────
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let DPR = Math.min(devicePixelRatio || 1, 2);
let CW = 0, CH = 0;

function resize(){
  CW = innerWidth; CH = innerHeight;
  cvs.style.width = CW + 'px';
  cvs.style.height = CH + 'px';
  cvs.width  = Math.round(CW * DPR);
  cvs.height = Math.round(CH * DPR);
}
resize();
addEventListener('resize', resize);

// ─── §B Verlet primitives ──────────────────────────────────────────────────
//
// PBD core loop:
//   1. integrate: pos += (pos - prevpos) * friction        (implicit velocity)
//   2. relax: for each stick, snap |a-b| back to rest length
//   3. repeat relax N times — more iters = stiffer body
//
// Bulletproof: no force ever divides by mass or steps too far. Worst case,
// the body oscillates. It does not explode.
//
let particles = [];
let sticks    = [];
let ITERS     = 8;
const FRICTION = 0.985;

function P(x, y, pinned = false){
  const p = { x, y, px: x, py: y, pinned };
  particles.push(p);
  return p;
}
function S(a, b, len){
  const s = { a, b, len: len ?? Math.hypot(a.x - b.x, a.y - b.y) };
  sticks.push(s);
  return s;
}

function step(){
  for (const p of particles){
    if (p.pinned) continue;
    const vx = (p.x - p.px) * FRICTION;
    const vy = (p.y - p.py) * FRICTION;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy;
  }
}

function relax(iters){
  for (let k = 0; k < iters; k++){
    for (const s of sticks){
      const dx = s.b.x - s.a.x;
      const dy = s.b.y - s.a.y;
      const d  = Math.hypot(dx, dy);
      if (d < 1e-6) continue;
      const diff = (d - s.len) / d * 0.5;
      const cx = dx * diff, cy = dy * diff;
      if (!s.a.pinned){ s.a.x += cx; s.a.y += cy; }
      if (!s.b.pinned){ s.b.x -= cx; s.b.y -= cy; }
    }
  }
}

// ─── §C build: 1 pent + 1 hex sharing an edge ─────────────────────────────
let pent, hex, handle;

function buildShape(){
  particles = [];
  sticks    = [];

  const cx = CW / 2, cy = CH / 2;
  const R  = Math.min(CW, CH) * 0.09;   // pent circumradius

  // Pentagon: center + 5 corners, with 5 edges + 5 spokes (= rigid via triangulation)
  const pC = P(cx, cy);
  const pV = [];
  for (let i = 0; i < 5; i++){
    const a = -Math.PI/2 + i * 2*Math.PI/5;
    pV.push(P(cx + R * Math.cos(a), cy + R * Math.sin(a)));
  }
  for (let i = 0; i < 5; i++){
    S(pV[i], pV[(i + 1) % 5]);
    S(pC,    pV[i]);
  }
  pent = { center: pC, corners: pV };

  // Hexagon attached on the TOP edge (pent corners 0–1).
  // Two pent corners become hex corners 0,1; four new corners + hex center are spawned.
  const a = pV[0], b = pV[1];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const dx = b.x - a.x, dy = b.y - a.y;
  const L  = Math.hypot(dx, dy);
  // outward normal: perpendicular to edge, pointing away from pent center
  let nx = -dy / L, ny = dx / L;
  if ((mx - cx) * nx + (my - cy) * ny < 0){ nx = -nx; ny = -ny; }
  const apo = L * Math.sqrt(3) / 2;
  const hcx = mx + nx * apo, hcy = my + ny * apo;

  // 4 new corners at angles around hex center (corners 2..5 in CCW order from a→b)
  const a0 = Math.atan2(a.y - hcy, a.x - hcx);
  const hV = [a, b];
  for (let i = 2; i < 6; i++){
    const ang = a0 + i * Math.PI / 3;
    hV.push(P(hcx + L * Math.cos(ang), hcy + L * Math.sin(ang)));
  }
  const hC = P(hcx, hcy);
  // hex edges (the shared one a→b already exists as a pent edge stick — adding a
  // redundant one is fine; PBD eats it). hex spokes from center to each corner.
  for (let i = 0; i < 6; i++){
    S(hV[i], hV[(i + 1) % 6]);
    S(hC,    hV[i]);
  }
  hex = { center: hC, corners: hV };

  // The "handle": hex's far tip (corner opposite the shared edge).
  // Pulling this point translates+rotates the whole rigid assembly.
  handle = hV[3];
}
buildShape();

// ─── §D input: click sets target, spring pulls handle toward it ───────────
let target = null;

function setTargetFromEvent(e){
  target = { x: e.clientX, y: e.clientY };
}
cvs.addEventListener('pointerdown', e => { setTargetFromEvent(e); cvs.setPointerCapture(e.pointerId); });
cvs.addEventListener('pointermove', e => { if (e.buttons === 1) setTargetFromEvent(e); });

const PULL_K   = 0.08;                                          // spring softness
const MAX_STEP = () => Math.min(CW, CH) * 0.015;                // hard cap on handle move/frame

function applyAttraction(){
  if (!target) return;
  const dx = target.x - handle.x;
  const dy = target.y - handle.y;
  const d  = Math.hypot(dx, dy);
  if (d < 0.5) return;
  const stepSize = Math.min(d * PULL_K, MAX_STEP());
  handle.x += (dx / d) * stepSize;
  handle.y += (dy / d) * stepSize;
  // No velocity injection — verlet picks it up next frame as (pos - prevpos).
}

addEventListener('keydown', e => {
  if (e.code === 'Space'){
    e.preventDefault();
    // SABOTAGE: inject NaN into a particle to test the failsafe.
    particles[Math.floor(Math.random() * particles.length)].x = NaN;
  } else if (e.key === 'r' || e.key === 'R'){
    buildShape(); target = null;
  } else if (e.key === '['){
    ITERS = Math.max(1, ITERS - 1);
  } else if (e.key === ']'){
    ITERS = Math.min(20, ITERS + 1);
  }
});

// ─── §E health + void factor ──────────────────────────────────────────────
let voidF = 0;
let resetPending = false;
let healthy = true;

function checkHealth(){
  for (const p of particles){
    if (!isFinite(p.x) || !isFinite(p.y)) return false;
  }
  return true;
}

// ─── §F render ────────────────────────────────────────────────────────────
function poly(corners, fillRGBA, strokeRGBA, lw){
  ctx.beginPath();
  ctx.moveTo(corners[0].x, corners[0].y);
  for (let i = 1; i < corners.length; i++) ctx.lineTo(corners[i].x, corners[i].y);
  ctx.closePath();
  if (fillRGBA){ ctx.fillStyle = fillRGBA; ctx.fill(); }
  if (strokeRGBA){ ctx.strokeStyle = strokeRGBA; ctx.lineWidth = lw; ctx.stroke(); }
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Trailing clear: alpha increases with voidF so void mode = instant pure bg fade.
  const clearA = 0.20 + voidF * 0.80;
  ctx.fillStyle = `rgba(5, 5, 16, ${clearA})`;
  ctx.fillRect(0, 0, CW, CH);

  const vis = 1 - voidF;
  if (vis < 0.005) return;

  // Target glow — soft cyan pulse
  if (target){
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.005);
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = `rgba(0, 212, 255, ${0.35 * pulse * vis})`;
    ctx.beginPath(); ctx.arc(target.x, target.y, 12, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = `rgba(0, 212, 255, ${0.12 * pulse * vis})`;
    ctx.beginPath(); ctx.arc(target.x, target.y, 22, 0, Math.PI*2); ctx.stroke();
  }

  // Internal spokes (rigidity visible as a wireframe skeleton)
  ctx.lineWidth = 1;
  ctx.strokeStyle = `rgba(255, 107, 53, ${0.18 * vis})`;
  ctx.beginPath();
  for (const c of pent.corners){
    ctx.moveTo(pent.center.x, pent.center.y); ctx.lineTo(c.x, c.y);
  }
  ctx.stroke();
  ctx.strokeStyle = `rgba(0, 212, 255, ${0.14 * vis})`;
  ctx.beginPath();
  for (const c of hex.corners){
    ctx.moveTo(hex.center.x, hex.center.y); ctx.lineTo(c.x, c.y);
  }
  ctx.stroke();

  // Hex first (so pent overlaps on shared edge — pent looks "on top")
  poly(hex.corners,
       `rgba(0, 212, 255, ${0.05 * vis})`,
       `rgba(0, 212, 255, ${0.7 * vis})`,
       1.3);
  poly(pent.corners,
       `rgba(255, 107, 53, ${0.13 * vis})`,
       `rgba(255, 107, 53, ${0.95 * vis})`,
       1.7);

  // Center dots
  ctx.fillStyle = `rgba(255, 107, 53, ${0.95 * vis})`;
  ctx.beginPath(); ctx.arc(pent.center.x, pent.center.y, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = `rgba(0, 212, 255, ${0.7 * vis})`;
  ctx.beginPath(); ctx.arc(hex.center.x, hex.center.y, 2.5, 0, Math.PI*2); ctx.fill();

  // Handle indicator: the "leash" attach point on the hex tip
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = `rgba(0, 212, 255, ${0.95 * vis})`;
  ctx.beginPath(); ctx.arc(handle.x, handle.y, 5, 0, Math.PI*2); ctx.stroke();
}

// ─── §G main loop ─────────────────────────────────────────────────────────
let frameMs = 0;
const npEl = document.getElementById('np');
const nsEl = document.getElementById('ns');
const niEl = document.getElementById('ni');
const msEl = document.getElementById('ms');
const hpEl = document.getElementById('hp');
const vmEl = document.getElementById('vmode');

function loop(){
  const t0 = performance.now();

  applyAttraction();
  step();
  relax(ITERS);

  healthy = checkHealth();
  if (!healthy) resetPending = true;
  if (resetPending && voidF > 0.95){
    buildShape();
    resetPending = false;
  }

  render();
  frameMs = performance.now() - t0;

  // Void target: full if unhealthy, otherwise driven by frame ms (would only
  // engage under genuinely catastrophic load — this sim is tiny).
  const vt = !healthy ? 1 : Math.max(0, Math.min(1, (frameMs - 18) / (60 - 18)));
  voidF += (vt - voidF) * 0.12;

  npEl.textContent = particles.length;
  nsEl.textContent = sticks.length;
  niEl.textContent = ITERS;
  msEl.textContent = frameMs.toFixed(1);
  hpEl.textContent = healthy ? 'ok' : 'NaN · healing';
  hpEl.style.color = healthy ? '' : '#ff3050';

  if (voidF > 0.45){ vmEl.className = 'on';   vmEl.textContent = `VOID · ${Math.round(voidF*100)}%`; }
  else if (voidF > 0.08){ vmEl.className = 'warm'; vmEl.textContent = `VOID · WARMING · ${Math.round(voidF*100)}%`; }
  else { vmEl.className = ''; vmEl.textContent = 'VOID · ARMED'; }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
