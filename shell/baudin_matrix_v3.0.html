<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baudin v3.0 -- Two Planes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#e0e0e0;
  font-family:ui-monospace,monospace;font-size:10px;
  min-height:100vh;display:flex;flex-direction:column}
#hdr{padding:7px 12px;border-bottom:1px solid #1a1f2e;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
#hdr .t{font-size:11px;color:#cc44ff;letter-spacing:0.2em;text-transform:uppercase}
#hdr .s{font-size:8px;color:#333}
#wrap{flex:1;overflow:auto;padding:4px}
table{border-collapse:collapse;margin:0 auto}
th{font-size:6px;color:#2a2a3a;padding:1px 2px;text-align:center;
  font-weight:normal;letter-spacing:0.05em}
.rh{font-size:6px;color:#2a2a3a;padding-right:2px;
  text-align:right;vertical-align:middle}
.c{position:relative;cursor:pointer}
.c:hover canvas{outline:1px solid rgba(204,68,255,0.5)}
#bar{padding:4px 12px;border-top:1px solid #1a1f2e;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  flex-shrink:0;background:rgba(5,5,16,0.97);
  position:sticky;bottom:0;z-index:10}
.btn{background:#0a0e18;color:#333;border:1px solid #0f0f1a;
  border-radius:2px;padding:2px 7px;font-family:monospace;
  font-size:8px;cursor:pointer;text-transform:uppercase}
.btn:hover{border-color:#cc44ff;color:#cc44ff}
.btn.on{background:#cc44ff;color:#050510;border-color:#cc44ff}
.sep{width:1px;height:12px;background:#1a1f2e}
.sl{display:flex;align-items:center;gap:2px}
.sl input{width:50px;accent-color:#cc44ff}
.sv{font-size:8px;color:#cc44ff;min-width:20px}
#st{font-size:7px;color:rgba(204,68,255,0.15);margin-left:auto}
#pop{position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);z-index:30;
  background:rgba(5,5,16,0.98);border:1px solid #cc44ff;
  border-radius:5px;padding:14px 18px;min-width:240px;display:none}
#pop h3{color:#cc44ff;font-size:10px;letter-spacing:0.15em;margin-bottom:7px}
#pop .eq{font-size:11px;color:#00d4ff;margin:3px 0;font-family:serif}
#pop .ob{font-size:9px;color:#ffd700;margin:3px 0}
#pop .ds{font-size:8px;color:#666;line-height:1.6;margin:4px 0}
#pop button{background:#cc44ff;color:#050510;border:none;
  padding:2px 10px;border-radius:2px;cursor:pointer;
  font-size:8px;text-transform:uppercase;margin-top:4px;
  font-family:monospace}
</style>
</head>
<body>

<div id="hdr">
  <span class="t">Baudin v3.0</span>
  <span class="s">two planes . slow rotation . canvas 2D . pure math</span>
  <span class="s" style="color:#ff4488">plane A</span>
  <span class="s">+</span>
  <span class="s" style="color:#4488ff">plane B</span>
  <span class="s">=</span>
  <span class="s" style="color:#cc44ff">interference = THE PURPLE</span>
</div>
<div id="wrap"><table id="t"></table></div>
<div id="pop">
  <h3 id="pt">-</h3>
  <div class="eq" id="peq">-</div>
  <div class="ob" id="pob">-</div>
  <div class="ds" id="pds">-</div>
  <button onclick="document.getElementById('pop').style.display='none'">CLOSE</button>
</div>
<div id="bar">
  <span class="s">size</span>
  <button class="btn" onclick="setS(18)">XS</button>
  <button class="btn" onclick="setS(26)">S</button>
  <button class="btn on" id="bM" onclick="setS(36)">M</button>
  <button class="btn" onclick="setS(50)">L</button>
  <div class="sep"></div>
  <span class="s">offset</span>
  <div class="sl">
    <input type="range" id="slO" min="0" max="314" value="50"
      oninput="PHI=+this.value/100;document.getElementById('svO').textContent=(+this.value/100).toFixed(2)">
    <span class="sv" id="svO">0.50</span>
  </div>
  <div class="sep"></div>
  <span class="s">speed</span>
  <div class="sl">
    <input type="range" id="slS" min="1" max="200" value="30"
      oninput="SPD=+this.value/1000;document.getElementById('svS').textContent=(+this.value/1000).toFixed(3)">
    <span class="sv" id="svS">0.030</span>
  </div>
  <div class="sep"></div>
  <button class="btn on" id="bA" onclick="toggleA()">A</button>
  <button class="btn on" id="bB" onclick="toggleB()">B</button>
  <button class="btn on" id="bBl" onclick="toggleBl()">SCREEN</button>
  <span id="st">P=12 . chi=2 . always</span>
</div>
<script>// BAUDIN MATRIX v3.0
// Two planes. Pure Canvas 2D. Slow rotation.
// The math reveals. We just watch.
// Built: 2026-06-02T17:39:54Z


var T = 0;
var SPD = 0.030;
var PHI = 0.50;
var SZ = 36;
var showA = true;
var showB = true;
var blend = "screen";
var cells = [];
var lt = performance.now();
var STEPS = 360;

var BG  = "#050510";
var CA  = "#ff4488";
var CB  = "#4488ff";

// The exact Lissajous:
// Plane A: x=sin(c*t + T),    y=sin(r*t)
// Plane B: x=sin(c*t - T),    y=sin(r*t + PHI)
// T grows slowly. PHI = phase offset between planes.
// The two planes DRIFT past each other.
// Interference = the pattern. The secret.

function draw(ctx, W, H, r, c, T2, phi) {
  var m = Math.min(W,H)*0.46;
  ctx.beginPath();
  for (var i=0; i<=STEPS; i++) {
    var t = (i/STEPS)*Math.PI*2*Math.max(r,c);
    var x = W/2 + m*Math.sin(c*t/Math.max(r,c)*c + T2);
    var y = H/2 + m*Math.sin(r*t/Math.max(r,c)*r + phi);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();
}

function renderAll() {
  cells.forEach(function(c2) {
    var ctx = c2.cv.getContext("2d");
    var W = c2.s, H = c2.s;
    ctx.fillStyle = BG;
    ctx.fillRect(0,0,W,H);
    ctx.lineWidth = 0.6;
    
    if (showA && showB) {
      ctx.globalCompositeOperation = blend;
      ctx.strokeStyle = CA; ctx.globalAlpha = 0.75;
      draw(ctx, W, H, c2.r, c2.c, T, 0);
      ctx.strokeStyle = CB; ctx.globalAlpha = 0.75;
      draw(ctx, W, H, c2.r, c2.c, -T, PHI);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    } else if (showA) {
      ctx.strokeStyle = CA; ctx.globalAlpha = 0.85;
      draw(ctx, W, H, c2.r, c2.c, T, 0);
      ctx.globalAlpha = 1;
    } else if (showB) {
      ctx.strokeStyle = CB; ctx.globalAlpha = 0.85;
      draw(ctx, W, H, c2.r, c2.c, -T, PHI);
      ctx.globalAlpha = 1;
    }
  });
}

var ORBS = {
  "1,1":"s-orbital . always a circle",
  "1,2":"p-orbital . THE ELECTRON . figure-8",
  "2,3":"d-orbital . clover",
  "1,3":"p-orbital . 3-lobe",
  "3,4":"f-orbital",
  "2,2":"d-orbital . Lemniscate"
};

function pop(r, c) {
  var k = Math.min(r,c)+","+Math.max(r,c);
  document.getElementById("pt").textContent = r+":"+c;
  document.getElementById("peq").textContent =
    "A: sin("+c+"t+T), sin("+r+"t)   B: sin("+c+"t-T), sin("+r+"t+\u03c6)";
  document.getElementById("pob").textContent =
    ORBS[k] || "higher orbital "+r+":"+c;
  document.getElementById("pds").textContent =
    "Two planes drifting past each other. "+
    "Offset \u03c6="+PHI.toFixed(2)+". "+
    "As T grows: interference pattern rotates. "+
    "The secret was always in the drift. Always.";
  document.getElementById("pop").style.display="block";
}

function build() {
  var tbl = document.getElementById("t");
  tbl.innerHTML=""; cells=[];
  var N = 12;
  var hr = document.createElement("tr");
  var th0=document.createElement("th"); th0.textContent=""; hr.appendChild(th0);
  for(var c=1;c<=N;c++){
    var th=document.createElement("th"); th.textContent=c; hr.appendChild(th);
  }
  tbl.appendChild(hr);
  for(var r=1;r<=N;r++){
    var row=document.createElement("tr");
    var rh=document.createElement("td"); rh.className="rh";
    rh.textContent=r; row.appendChild(rh);
    for(var c=1;c<=N;c++){
      var td=document.createElement("td");
      var dv=document.createElement("div");
      dv.className="c"; dv.style.width=SZ+"px"; dv.style.height=SZ+"px";
      var cv=document.createElement("canvas");
      cv.width=SZ; cv.height=SZ; dv.appendChild(cv);
      (function(rr,cc){
        dv.addEventListener("click",function(){pop(rr,cc);});
      })(r,c);
      td.appendChild(dv); row.appendChild(td);
      cells.push({cv:cv,r:r,c:c,s:SZ});
    }
    tbl.appendChild(row);
  }
}

function setS(s){
  SZ=s; build();
}
function toggleA(){showA=!showA;document.getElementById("bA").classList.toggle("on",showA);}
function toggleB(){showB=!showB;document.getElementById("bB").classList.toggle("on",showB);}
function toggleBl(){
  blend=blend==="screen"?"source-over":"screen";
  document.getElementById("bBl").textContent=blend==="screen"?"SCREEN":"NORMAL";
}

document.addEventListener("click",function(e){
  var p=document.getElementById("pop");
  if(p.style.display==="block"&&!p.contains(e.target))p.style.display="none";
});

function loop(now){
  var dt=Math.min((now-lt)/1000,0.05); lt=now;
  T+=dt*SPD;
  renderAll();
  requestAnimationFrame(loop);
}

build();
requestAnimationFrame(loop);
</script>
</body>
</html>
