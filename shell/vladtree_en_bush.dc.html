<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="data/es_words.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#04070a;color:#e0e0e0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;overflow:hidden}
  @keyframes tgr{0%,100%{transform:scale(1.4);box-shadow:0 0 26px 5px rgba(255,90,30,.9)}50%{transform:scale(1.75);box-shadow:0 0 46px 12px rgba(255,50,15,1)}}
  #ef-plane{position:absolute;transform-origin:0 0;will-change:transform}
  .wnode{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;
    color:#d6e8c4;background:rgba(14,20,10,.5);border:1px solid rgba(110,150,70,.10);border-radius:4px;
    font-family:'Spectral',serif;font-weight:600;cursor:pointer;overflow:hidden;line-height:1.05;user-select:none}
  .wnode.flip{color:#ffd700;background:rgba(40,34,10,.9);border-color:rgba(255,215,0,.5)}
  .wnode.lit{color:#0a0a0a!important;background:#ffe04a!important;border-color:#fff!important;z-index:6}
  .wnode.tiger{color:#fff!important;background:linear-gradient(135deg,#ff7a2a,#c81e0a)!important;border-color:#fff!important;
    z-index:30;animation:tgr .5s ease-in-out infinite}
  #ef-fog{position:absolute;inset:0;pointer-events:none;z-index:20}
  #ef-bite{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 55%,transparent 35%,rgba(200,20,10,.6) 100%);opacity:0;transition:opacity .5s;z-index:40}
  .efbtn{background:#0a120c;border:1px solid #20331c;color:#86a378;border-radius:4px;padding:5px 11px;font-family:'IBM Plex Mono',monospace;font-size:9px;cursor:pointer;text-transform:uppercase;letter-spacing:.09em;white-space:nowrap;transition:all .15s}
  .efbtn:hover{color:#eafff0;border-color:#456a3c}
  .efbtn.on{color:#ff7a4a;border-color:rgba(255,120,70,.55);background:rgba(255,90,40,.08)}
  input[type=range]{-webkit-appearance:none;height:4px;border-radius:3px;background:linear-gradient(90deg,#33662c,#ff6a2a);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#ffd700;border:2px solid #04070a;cursor:pointer;box-shadow:0 0 8px rgba(255,215,0,.6)}
</style>
</helmet>
<div style="height:100vh;display:flex;flex-direction:column">

  <!-- CONTROL BAR (compact — this is a game, not a worksheet) -->
  <div style="flex:0 0 auto;display:flex;align-items:center;gap:13px;padding:8px 16px;border-bottom:1px solid #122016;background:rgba(2,5,3,.92);flex-wrap:wrap">
    <span style="font:600 15px/1 'Spectral',serif;color:#cfe6c0">🌲 The Bush</span>
    <span style="font:500 8px/1 'IBM Plex Mono',monospace;color:#566b4c;letter-spacing:.15em;text-transform:uppercase">EN · fog of war</span>
    <div style="width:1px;height:20px;background:#1a3320"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font:500 8px/1 'IBM Plex Mono',monospace;color:#6a8a5c;letter-spacing:.12em;text-transform:uppercase">saturation</span>
      <input id="ef-sat" type="range" min="40" max="4000" step="20" value="600" style="width:160px">
      <span id="ef-satval" style="font:600 12px/1 'Spectral',serif;color:#ffd700;min-width:42px">600</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font:500 8px/1 'IBM Plex Mono',monospace;color:#6a8a5c;letter-spacing:.12em;text-transform:uppercase">vision</span>
      <input id="ef-vis" type="range" min="70" max="360" step="10" value="160" style="width:110px">
    </div>
    <button class="efbtn on" id="ef-hunt" onClick="{{ onHunt }}">🐅 hunt: on</button>
    <div style="flex:1 1 60px"></div>
    <div style="display:flex;align-items:center;gap:6px">
      <input id="ef-input" type="text" placeholder="flush a word…" style="width:150px;background:#0a120c;border:1px solid #20331c;border-radius:4px;padding:5px 9px;font-family:'Spectral',serif;font-size:13px;color:#eafff0;outline:none">
      <button class="efbtn" onClick="{{ onMatch }}">find</button>
    </div>
    <span id="ef-fps" style="font:500 8px/1 'IBM Plex Mono',monospace;color:#3f5a40;min-width:60px;text-align:right">— fps</span>
  </div>

  <!-- THE MAP -->
  <div id="ef-grid" style="flex:1 1 auto;position:relative;overflow:hidden;cursor:crosshair;background:radial-gradient(120% 90% at 50% 0%,#0a140a,#04070a 70%)">
    <div id="ef-plane"></div>
    <canvas id="ef-fog"></canvas>
    <div id="ef-bite"></div>
    <!-- HUD -->
    <div id="ef-hud" style="position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(3,6,3,.8);border:1px solid rgba(255,120,70,.3);border-radius:8px;padding:6px 16px;display:flex;gap:16px;align-items:center;z-index:25;backdrop-filter:blur(3px)">
      <div style="display:flex;flex-direction:column;align-items:center"><span id="ef-caught" style="font:600 16px/1 'Spectral',serif;color:#7fff7f">0</span><span style="font:500 7px/1 'IBM Plex Mono',monospace;color:#566b4c;letter-spacing:.1em;text-transform:uppercase">caught</span></div>
      <div style="display:flex;flex-direction:column;align-items:center"><span id="ef-bitten" style="font:600 16px/1 'Spectral',serif;color:#ff7a6b">0</span><span style="font:500 7px/1 'IBM Plex Mono',monospace;color:#566b4c;letter-spacing:.1em;text-transform:uppercase">bitten</span></div>
      <div style="display:flex;flex-direction:column;align-items:center"><span id="ef-streak" style="font:600 16px/1 'Spectral',serif;color:#ffd700">0</span><span style="font:500 7px/1 'IBM Plex Mono',monospace;color:#566b4c;letter-spacing:.1em;text-transform:uppercase">streak</span></div>
    </div>
    <div id="ef-hint" style="position:absolute;left:50%;bottom:11px;transform:translateX(-50%);font:500 8px/1.5 'IBM Plex Mono',monospace;color:#2a3a28;letter-spacing:.12em;text-transform:uppercase;text-align:center;pointer-events:none;z-index:25">move to scout the bush · the tiger glows in the fog · click it before it pounces · don't think — feel</div>
  </div>

  <div style="flex:0 0 auto;background:rgba(2,5,3,.98);border-top:1px solid #122016;padding:6px 16px">
    <span id="ef-status" style="font:500 8px/1.4 'IBM Plex Mono',monospace;color:#3f5a40;letter-spacing:.09em;text-transform:uppercase">scout the fog. the words light as you pass. the eyes in the dark are the tiger. pure intuition.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 800 }
}">
class Component extends DCLogic {
  componentDidMount(){
    if(!window.ES_WORDS || !window.ES_WORDS.length){ this._w=(this._w||0)+1; if(this._w<60){ setTimeout(()=>this.componentDidMount(),50); return; } }
    this.WORDS=(window.ES_WORDS||[{es:"español",en:"loading…"}]).slice(); this.UNIQ=this.WORDS.length;
    this.pan={x:0,y:0,z:1}; this.drag=false; this.lm={x:0,y:0}; this.mouse={x:-999,y:-999};
    this.nodeEls=[]; this.POS=[];
    this.hunting=true; this.caught=0; this.bitten=0; this.streak=0;
    this.tigerEl=null; this.tigerIdx=-1; this.tigerTimer=null; this.spawnTimer=null;
    this.visR=160;
    this.fog=document.getElementById('ef-fog'); this.fctx=this.fog.getContext('2d');

    const sat=document.getElementById('ef-sat');
    const saved=parseInt(localStorage.getItem('vt_en_sat')||'600',10);
    this.count=isNaN(saved)?600:Math.max(40,Math.min(4000,saved));
    sat.value=this.count; document.getElementById('ef-satval').textContent=this.count;

    this._resizeFog(); window.addEventListener('resize',()=>this._resizeFog());
    this._build(); this._wire(); this._loop();

    sat.addEventListener('input',e=>document.getElementById('ef-satval').textContent=e.target.value);
    sat.addEventListener('change',e=>{ this.count=parseInt(e.target.value,10); localStorage.setItem('vt_en_sat',this.count); this._build(); });
    document.getElementById('ef-vis').addEventListener('input',e=>this.visR=parseInt(e.target.value,10));
    const inp=document.getElementById('ef-input'); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') this.match(); });
  }
  componentWillUnmount(){ if(this._raf)cancelAnimationFrame(this._raf); this._stopHunt(true); }

  _resizeFog(){ const g=document.getElementById('ef-grid').getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
    this.fog.width=g.width*dpr; this.fog.height=g.height*dpr; this.fctx.setTransform(dpr,0,0,dpr,0,0); this.FW=g.width; this.FH=g.height; }

  _sizeFor(C){ if(C<=100)return{w:96,h:46,f:15}; if(C<=300)return{w:78,h:40,f:13}; if(C<=700)return{w:60,h:32,f:11}; if(C<=1400)return{w:46,h:26,f:9.5}; if(C<=2500)return{w:36,h:21,f:8}; return{w:29,h:17,f:7}; }

  _build(){
    const wasHunting=this.hunting!==false;
    const plane=document.getElementById('ef-plane'); this._stopHunt(true);
    plane.innerHTML=''; this.nodeEls=[]; this.POS=[];
    const C=this.count, sz=this._sizeFor(C), cols=Math.max(1,Math.round(Math.sqrt(C*1.9))), gap=Math.max(2,Math.round(sz.w*0.06));
    for(let i=0;i<C;i++){
      const wd=this.WORDS[i%this.UNIQ], col=i%cols, row=Math.floor(i/cols), x=col*(sz.w+gap), y=row*(sz.h+gap);
      const d=document.createElement('div'); d.className='wnode';
      d.style.cssText='left:'+x+'px;top:'+y+'px;width:'+sz.w+'px;height:'+sz.h+'px;font-size:'+sz.f+'px;padding:0 2px';
      d.textContent=wd.en; d.dataset.en=wd.en; d.dataset.es=wd.es;   // EN shown, flip → ES
      d.onclick=(ev)=>this._click(d,ev);
      plane.appendChild(d); this.nodeEls.push(d); this.POS.push({x,y,w:sz.w,h:sz.h});
    }
    this.planeW=cols*(sz.w+gap); this.planeH=Math.ceil(C/cols)*(sz.h+gap);
    const g=document.getElementById('ef-grid').getBoundingClientRect();
    this.pan.z=Math.min(1.2,Math.max(0.18,Math.min(g.width/this.planeW,g.height/this.planeH)*0.98));
    this.pan.x=(g.width-this.planeW*this.pan.z)/2; this.pan.y=(g.height-this.planeH*this.pan.z)/2;
    this._applyT();
    this._status(C+' words hidden in the fog · scout to reveal · '+(C>this.UNIQ?('×'+(C/this.UNIQ).toFixed(1)+' immersion'):''));
    if(wasHunting){ this.hunting=true; const b=document.getElementById('ef-hunt'); if(b){ b.classList.add('on'); b.textContent='🐅 hunt: on'; } document.getElementById('ef-hud').style.display='flex'; this._spawn(); }
  }
  _applyT(){ document.getElementById('ef-plane').style.transform='translate('+this.pan.x+'px,'+this.pan.y+'px) scale('+this.pan.z+')'; }

  _wire(){
    const grid=document.getElementById('ef-grid');
    grid.addEventListener('pointermove',e=>{ const r=grid.getBoundingClientRect(); this.mouse={x:e.clientX-r.left,y:e.clientY-r.top};
      if(this.drag){ this.pan.x+=(e.clientX-this.lm.x); this.pan.y+=(e.clientY-this.lm.y); this.lm={x:e.clientX,y:e.clientY}; this._applyT(); } });
    grid.addEventListener('pointerdown',e=>{ if(e.target.classList.contains('wnode'))return; this.drag=true; this.lm={x:e.clientX,y:e.clientY}; });
    document.addEventListener('pointerup',()=>this.drag=false);
    grid.addEventListener('wheel',e=>{ e.preventDefault(); const oz=this.pan.z; this.pan.z=Math.max(.1,Math.min(3,this.pan.z*(e.deltaY>0?.9:1.11)));
      const r=grid.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;
      this.pan.x=cx-(cx-this.pan.x)*(this.pan.z/oz); this.pan.y=cy-(cy-this.pan.y)*(this.pan.z/oz); this._applyT(); },{passive:false});
  }

  _click(d,ev){ if(this.hunting && d.classList.contains('tiger')){ this._catch(d); if(ev)ev.stopPropagation(); return; }
    d.classList.toggle('flip'); d.textContent=d.classList.contains('flip')?d.dataset.es:d.dataset.en; }

  // screen position of a node index
  _screen(i){ const p=this.POS[i]; return {x:this.pan.x+(p.x+p.w/2)*this.pan.z, y:this.pan.y+(p.y+p.h/2)*this.pan.z}; }

  // ---- fog of war render loop ----
  _loop(){ let last=performance.now(),frames=0,acc=0;
    const tick=now=>{ frames++; acc+=now-last; last=now;
      if(acc>=500){ const fps=Math.round(frames/(acc/1000)); frames=0; acc=0; const el=document.getElementById('ef-fps'); if(el){ el.textContent=fps+' fps'; el.style.color=fps<28?'#ff7a6b':(fps<50?'#ffd700':'#3f5a40'); } }
      this._drawFog(); this._raf=requestAnimationFrame(tick); };
    this._raf=requestAnimationFrame(tick); }

  _drawFog(){
    const c=this.fctx, W=this.FW, H=this.FH; if(!W) return;
    c.clearRect(0,0,W,H);
    c.fillStyle='rgba(3,7,4,.93)'; c.fillRect(0,0,W,H);
    // vision hole at scout (mouse)
    c.globalCompositeOperation='destination-out';
    const punch=(x,y,r)=>{ const g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(.62,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); };
    if(this.mouse.x>-500) punch(this.mouse.x,this.mouse.y,this.visR);
    // matches glow through fog briefly
    if(this._litUntil>performance.now()){ this.nodeEls.forEach((d,i)=>{ if(d.classList.contains('lit')){ const s=this._screen(i); punch(s.x,s.y,26); } }); }
    c.globalCompositeOperation='source-over';
    // the tiger's eyes glow IN the fog (you sense it before you see it)
    if(this.hunting && this.tigerIdx>=0){
      const s=this._screen(this.tigerIdx);
      const inView = this.mouse.x>-500 && Math.hypot(s.x-this.mouse.x,s.y-this.mouse.y)<this.visR*0.75;
      const glow=c.createRadialGradient(s.x,s.y,0,s.x,s.y,inView?70:46);
      glow.addColorStop(0,'rgba(255,70,25,'+(inView?'.0':'.45')+')'); glow.addColorStop(1,'rgba(255,40,10,0)');
      c.fillStyle=glow; c.beginPath(); c.arc(s.x,s.y,inView?70:46,0,7); c.fill();
      if(!inView){ // two eyes in the dark
        c.fillStyle='rgba(255,196,60,.95)';
        c.beginPath(); c.arc(s.x-7,s.y,2.6,0,7); c.fill();
        c.beginPath(); c.arc(s.x+7,s.y,2.6,0,7); c.fill();
      }
    }
  }

  match(){
    const raw=(document.getElementById('ef-input').value||'').toLowerCase().trim();
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    let n=0; this.nodeEls.forEach(d=>{ d.classList.remove('lit'); if(!raw)return;
      const en=norm(d.dataset.en),es=norm(d.dataset.es),q=norm(raw);
      if(en===q||es===q||en.indexOf(q)>=0||es.split(/[ /]+/).indexOf(q)>=0){ d.classList.add('lit'); n++; } });
    this._litUntil=performance.now()+1500;
    this._status(raw?('“'+raw+'” flushed '+n+' from the bush'):'');
  }

  // ---- the tiger ----
  toggleHunt(){ this.hunting?this._stopHunt():this._startHunt(); }
  _startHunt(){ this.hunting=true; this.caught=0; this.bitten=0; this.streak=0; this._hud();
    const b=document.getElementById('ef-hunt'); b.classList.add('on'); b.textContent='🐅 hunt: on';
    document.getElementById('ef-hud').style.display='flex'; this._status('a tiger moves in the fog. find the eyes. click before it pounces.'); this._spawn(); }
  _stopHunt(silent){ this.hunting=false;
    if(this.spawnTimer){clearTimeout(this.spawnTimer);this.spawnTimer=null;} if(this.tigerTimer){clearTimeout(this.tigerTimer);this.tigerTimer=null;}
    if(this.tigerEl){ this.tigerEl.classList.remove('tiger'); this.tigerEl.textContent=this.tigerEl.dataset.en; } this.tigerEl=null; this.tigerIdx=-1;
    const b=document.getElementById('ef-hunt'); if(b){ b.classList.remove('on'); b.textContent='🐅 hunt: off'; }
    if(!silent) this._status('hunt paused'); }
  _spawn(){ if(!this.hunting||!this.nodeEls.length) return;
    const i=Math.floor(Math.random()*this.nodeEls.length); this.tigerIdx=i; this.tigerEl=this.nodeEls[i];
    this.tigerEl.classList.add('tiger'); this.tigerEl.classList.remove('flip'); this.tigerEl.textContent=this.tigerEl.dataset.en;
    const life=Math.max(1100,2600-this.caught*55); this.tigerTimer=setTimeout(()=>this._bite(),life); }
  _catch(el){ if(this.tigerTimer){clearTimeout(this.tigerTimer);this.tigerTimer=null;}
    el.classList.remove('tiger'); el.classList.add('flip'); el.textContent=el.dataset.es;
    setTimeout(()=>{ el.classList.remove('flip'); el.textContent=el.dataset.en; },700);
    this.caught++; this.streak++; this.tigerEl=null; this.tigerIdx=-1; this._hud();
    this._status('caught “'+el.dataset.en+'” = '+el.dataset.es+' · streak '+this.streak);
    this.spawnTimer=setTimeout(()=>this._spawn(),450); }
  _bite(){ if(this.tigerEl){ this.tigerEl.classList.remove('tiger'); this.tigerEl.textContent=this.tigerEl.dataset.en; } this.tigerEl=null; this.tigerIdx=-1;
    this.bitten++; this.streak=0; this._hud();
    const b=document.getElementById('ef-bite'); b.style.opacity='1'; setTimeout(()=>b.style.opacity='0',60);
    this._status('pounced. the word you didn’t scout bit you. now you’ll remember it.');
    this.spawnTimer=setTimeout(()=>this._spawn(),750); }
  _hud(){ const c=document.getElementById('ef-caught'),bi=document.getElementById('ef-bitten'),s=document.getElementById('ef-streak'); if(c)c.textContent=this.caught; if(bi)bi.textContent=this.bitten; if(s)s.textContent=this.streak; }

  _status(t){ const s=document.getElementById('ef-status'); if(s)s.textContent=t; }
  renderVals(){ return { onHunt:()=>this.toggleHunt(), onMatch:()=>this.match() }; }
}
</script>
</body>
</html>
